<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timers</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --success: #22c55e;
            --bg: #f8fafc;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --danger: #ef4444;
            --danger-bg: #fff1f2;
            --progress-line: #e2e8f0;
            --top-bar-bg: #1e293b;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --input-border: #cbd5e1;
            --btn-bg: #334155;
            --btn-close-bg: #f1f5f9;
            --settings-bg: #ffffff;
            --shadow-color: rgba(0,0,0,0.04);
        }

        [data-theme="dark"] {
            --primary: #38bdf8;
            --success: #4ade80;
            --bg: #0f172a;
            --text-dark: #f1f5f9;
            --text-light: #94a3b8;
            --danger: #f87171;
            --danger-bg: #3f1f1f;
            --progress-line: #1e293b;
            --top-bar-bg: #020617;
            --card-bg: #1e293b;
            --card-border: #334155;
            --input-border: #475569;
            --btn-bg: #475569;
            --btn-close-bg: #334155;
            --settings-bg: #1e293b;
            --shadow-color: rgba(0,0,0,0.3);
        }

        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text-dark); transition: background-color 0.3s ease, color 0.3s ease; }
        
        .top-bar { background: var(--top-bar-bg); display: flex; justify-content: space-between; align-items: center; padding: 12px 30px; z-index: 100; color: white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: background-color 0.3s ease; }
        .app-title { font-weight: 900; font-size: 1.2rem; letter-spacing: 1px; }
        .right-controls { display: flex; align-items: center; gap: 12px; }
        
        .lang-selector { background: var(--btn-bg); border: none; color: white; padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid #475569; outline: none; transition: background-color 0.3s ease; }
        
        .btn-sound-global { background: var(--btn-bg); border: 2px solid transparent; color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-sound-global.is-off { border-color: var(--danger); color: var(--danger); }
        .btn-ctrl { background: var(--btn-bg); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: background-color 0.3s ease; }
        .btn-ctrl:hover { opacity: 0.9; }

        .btn-theme { background: var(--btn-bg); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 8px; transition: all 0.2s; font-size: 1.2rem; }
        .btn-theme:hover { opacity: 0.9; }

        /* Menu dropdown ⋮ */
        .menu-wrapper { position: relative; display: inline-block; }
        .btn-menu { font-size: 1.4rem; font-weight: 900; padding: 8px 14px; line-height: 1; }
        .dropdown-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); min-width: 220px; z-index: 200; padding: 6px; }
        .dropdown-menu.visible { display: block; }
        .dropdown-item { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; color: var(--text-dark); border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.95rem; text-align: left; transition: background 0.15s; }
        .dropdown-item:hover { background: var(--btn-close-bg); }
        .dropdown-item.dropdown-danger { color: var(--danger); }
        .dropdown-item.dropdown-danger:hover { background: var(--danger-bg); }
        .dropdown-divider { height: 1px; background: var(--card-border); margin: 6px 0; }
        .dropdown-setting { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 200px; }
        .dropdown-setting label { font-size: 0.75rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
        .dropdown-setting-input { display: flex; align-items: center; gap: 8px; }
        .dropdown-setting-input input { width: 70px; padding: 6px 8px; border: 1px solid var(--input-border); border-radius: 6px; font-weight: 700; font-size: 0.95rem; background: var(--bg); color: var(--text-dark); outline: none; text-align: center; }
        .dropdown-setting-input input:focus { border-color: var(--primary); }
        .dropdown-setting-input span { font-weight: 700; color: var(--text-light); font-size: 0.9rem; }

        .settings-panel { background: var(--settings-bg); padding: 20px 25px; border-bottom: 1px solid var(--card-border); box-shadow: 0 4px 12px var(--shadow-color); transition: background-color 0.3s ease, border-color 0.3s ease; }
        .input-group { display: flex; gap: 20px; align-items: flex-end; justify-content: center; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 0.75rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; transition: color 0.3s ease; }
        input { padding: 12px; border: 2px solid var(--input-border); border-radius: 10px; font-weight: 700; font-size: 1rem; outline: none; background: var(--card-bg); color: var(--text-dark); transition: all 0.3s ease; }
        input:focus { border-color: var(--primary); }
        .input-name { width: 300px; }
        .input-time { width: 80px; text-align: center; }
        .btn-add-main { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: 800; font-size: 1rem; text-transform: uppercase; transition: opacity 0.2s; }
        .btn-add-main:hover { opacity: 0.9; }

        #durationsList { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); 
            gap: 35px; padding: 40px; overflow-y: auto; 
            max-height: calc(100vh - 160px); align-content: start;
        }
        
        .duration-card { 
            background: var(--card-bg); border-radius: 35px; padding: 40px 40px 50px 40px; 
            border: 1px solid var(--card-border); text-align: center; position: relative; 
            box-shadow: 0 12px 24px var(--shadow-color); transition: all 0.3s ease;
            overflow: hidden; cursor: grab; user-select: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .duration-card:hover { border-color: var(--text-light); }
        .duration-card.dragging { opacity: 0.4; transform: scale(0.98); }
        .duration-card.over {
            border: 2px dashed var(--primary);
            transform: scale(1.02);
        }
        
        .drag-handle { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-wrap: wrap; width: 12px; gap: 3px; opacity: 0; transition: opacity 0.3s; }
        .duration-card:hover .drag-handle { opacity: 0.4; }
        .drag-dot { width: 4px; height: 4px; background: var(--text-light); border-radius: 50%; }

        .active { border-color: var(--primary) !important; }
        .finished { background: var(--danger-bg) !important; border-color: var(--danger) !important; animation: pulse-red 1.5s infinite; }

        .progress-bar-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 12px; background: var(--progress-line); pointer-events: none; transition: background-color 0.3s ease; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 1s linear, background-color 0.3s ease; }
        .finished .progress-bar-fill { background: var(--danger); width: 100% !important; }

        .btn-close { position: absolute; top: 20px; right: 20px; background: var(--btn-close-bg); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-weight: 900; color: var(--text-light); z-index: 10; transition: all 0.3s ease; }
        .btn-close:hover { opacity: 0.7; }

        .btn-duplicate { position: absolute; top: 20px; left: 20px; background: var(--btn-close-bg); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-weight: 900; color: var(--text-light); z-index: 10; transition: all 0.3s ease; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
        .btn-duplicate:hover { opacity: 0.7; }
        
        .label-duree-titre { font-weight: 900; color: var(--text-light); font-size: 1.2rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s ease; cursor: pointer; padding: 6px 12px; border-radius: 8px; border: 2px dashed transparent; position: relative; display: inline-block; }
        .label-duree-titre::after { content: " ✏️"; opacity: 0; transition: opacity 0.2s ease; font-size: 0.9rem; }
        .label-duree-titre:hover { background: var(--btn-close-bg); color: var(--text-dark); border-color: var(--input-border); }
        .label-duree-titre:hover::after { opacity: 1; }
        .duration-edit-form { display: flex; gap: 8px; align-items: center; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; padding: 12px 16px; background: var(--bg); border: 2px solid var(--primary); border-radius: 12px; box-shadow: 0 4px 12px var(--shadow-color); }
        .duration-edit-form input { width: 70px; padding: 8px 10px; font-size: 1.1rem; border: 2px solid var(--input-border); border-radius: 8px; }
        .duration-edit-form input:focus { border-color: var(--primary); }
        .duration-edit-form span { font-weight: 700; color: var(--text-light); font-size: 0.9rem; text-transform: uppercase; }
        .duration-edit-form button { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 0.95rem; transition: opacity 0.2s; }
        .duration-edit-form button:hover { opacity: 0.85; }
        .duration-edit-form button.btn-cancel { background: var(--btn-close-bg); color: var(--text-light); border: 1px solid var(--input-border); }

        /* Modal de confirmation (pour ne pas sortir du plein écran) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
        .modal-overlay.visible { display: flex; }
        .modal-box { background: var(--card-bg); border-radius: 16px; padding: 30px 35px; max-width: 90%; width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 1px solid var(--card-border); }
        .modal-message { font-size: 1.2rem; font-weight: 700; color: var(--text-dark); margin-bottom: 25px; text-align: center; }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }
        .modal-actions button { padding: 12px 24px; border-radius: 10px; font-weight: 800; font-size: 1rem; cursor: pointer; border: none; min-width: 100px; transition: opacity 0.2s; }
        .modal-actions button:hover { opacity: 0.85; }
        .modal-btn-confirm { background: var(--danger); color: white; }
        .modal-btn-cancel { background: var(--btn-close-bg); color: var(--text-light); border: 1px solid var(--input-border) !important; }
        .label-nom { font-weight: 800; color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; transition: color 0.3s ease; }
        
        .time-left { font-size: 6rem; font-weight: 900; color: var(--input-border); margin: 0; line-height: 1; transition: all 0.2s ease; cursor: pointer; padding: 4px 12px; border-radius: 12px; }
        .time-left:hover { background: var(--btn-close-bg); }
        .active .time-left { color: var(--text-dark); }
        .finished .time-left { color: var(--danger); }
        .finished .time-left:hover { background: var(--danger-bg); }

        /* Champ seuil secondes */
        .field-threshold { border-left: 1px solid var(--card-border); padding-left: 20px; margin-left: 10px; }
        .threshold-input-wrapper { display: flex; align-items: center; gap: 6px; }
        .threshold-unit { font-weight: 700; color: var(--text-light); font-size: 0.9rem; }

        /* Indicateur de drop pour le drag */
        .drop-indicator { position: absolute; background: var(--primary); border-radius: 4px; pointer-events: none; z-index: 50; box-shadow: 0 0 12px rgba(14, 165, 233, 0.5); display: none; }
        .drop-indicator.visible { display: block; }

        .end-time-display { font-weight: 800; color: var(--text-light); font-size: 1.1rem; margin-bottom: 15px; min-height: 1.2em; text-transform: uppercase; transition: all 0.2s ease; }
        .active .end-time-display { color: var(--primary); }
        .finished .end-time-display { visibility: hidden; }
        /* Quand le timer est actif, l'heure de fin devient cliquable */
        .active .end-time-display { cursor: pointer; padding: 4px 10px; border-radius: 8px; border: 2px dashed transparent; display: inline-block; }
        .active .end-time-display:hover { background: var(--btn-close-bg); border-color: var(--input-border); }
        .end-time-display .start-time-part { color: var(--text-light); margin-right: 12px; font-weight: 700; }
        .end-time-display .start-time-part::after { content: " →"; margin-left: 8px; opacity: 0.6; }

        .card-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-start { background: var(--success); color: white; border: none; padding: 12px 30px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 1rem; width: 100%; max-width: 200px; transition: opacity 0.2s; }
        .btn-start:hover { opacity: 0.9; }
        .btn-action { background: var(--card-bg); color: var(--text-light); border: 2px solid var(--input-border); padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.3s ease; }
        .btn-action:hover { border-color: var(--text-light); }
        .btn-stop { border-color: var(--danger); color: var(--danger); }

        @keyframes pulse-red { 0% { box-shadow: 0 0 0px rgba(239, 68, 68, 0); } 50% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.3); } 100% { box-shadow: 0 0 0px rgba(239, 68, 68, 0); } }
        
        /* Onglets */
        .tabs-container { background: var(--settings-bg); border-bottom: 1px solid var(--card-border); display: flex; gap: 0; padding: 0 30px; transition: background-color 0.3s ease; }
        .tab-btn { background: transparent; border: none; color: var(--text-light); padding: 15px 25px; cursor: pointer; font-weight: 700; font-size: 1rem; border-bottom: 3px solid transparent; transition: all 0.3s ease; }
        .tab-btn:hover { color: var(--text-dark); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Éditeur Markdown */
        /* Onglet instructions (éditeur richtext WYSIWYG) */
        #instructions-tab.active { display: flex; flex-direction: column; height: calc(100vh - 100px); }
        .richtext-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .richtext-toolbar { background: var(--settings-bg); border-bottom: 1px solid var(--card-border); padding: 10px 20px; display: none; gap: 6px; align-items: center; flex-wrap: wrap; }
        .richtext-container.editing .richtext-toolbar { display: flex; }
        .richtext-toolbar button { background: var(--card-bg); color: var(--text-dark); border: 1px solid var(--card-border); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.9rem; transition: all 0.2s; min-width: 36px; }
        .richtext-toolbar button:hover { background: var(--btn-close-bg); border-color: var(--input-border); }
        .richtext-toolbar button.btn-close-edit { margin-left: auto; background: var(--btn-close-bg); color: var(--text-light); font-size: 1rem; font-weight: 900; }
        .richtext-toolbar button.btn-close-edit:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
        .richtext-toolbar button.rt-zoom-level { font-size: 0.8rem; min-width: 50px; color: var(--text-light); }
        .richtext-toolbar .toolbar-sep { width: 1px; height: 22px; background: var(--card-border); margin: 0 4px; }
        .richtext-editor { flex: 1; padding: 30px 40px; overflow-y: auto; background: var(--bg); color: var(--text-dark); line-height: 1.4; font-size: 1.5rem; outline: none; cursor: text; }
        /* Hors mode édition, le pointeur reste un text-cursor pour signaler qu'on peut éditer */
        .richtext-container:not(.editing) .richtext-editor { cursor: text; }
        .richtext-container:not(.editing) .richtext-editor:hover { background: var(--btn-close-bg); }
        .richtext-editor:focus { outline: none; }
        .richtext-editor h1 { font-size: 3.5rem; font-weight: 900; margin-top: 0; margin-bottom: 0.6rem; color: var(--primary); line-height: 1.1; }
        .richtext-editor h2 { font-size: 2.8rem; font-weight: 800; margin-top: 1.2rem; margin-bottom: 0.6rem; color: var(--text-dark); line-height: 1.1; }
        .richtext-editor h3 { font-size: 2.2rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: var(--text-dark); line-height: 1.1; }
        .richtext-editor p { margin-bottom: 0.6rem; }
        .richtext-editor ul, .richtext-editor ol { margin-bottom: 0.6rem; padding-left: 2.5rem; }
        .richtext-editor li { margin-bottom: 0.2rem; }
        .richtext-editor blockquote { border-left: 4px solid var(--primary); padding-left: 1.5rem; margin-left: 0; margin-bottom: 0.6rem; color: var(--text-light); font-style: italic; font-size: 1.6rem; line-height: 1.3; }
        .richtext-editor strong, .richtext-editor b { font-weight: 700; color: var(--text-dark); }
        .richtext-editor em, .richtext-editor i { font-style: italic; }
        .richtext-editor a { color: var(--primary); text-decoration: underline; }
        .richtext-editor:empty::before { content: attr(data-placeholder); color: var(--text-light); pointer-events: none; }
        
        
        /* Bouton toggle settings panel */
        .settings-panel { position: relative; transition: all 0.3s ease; }
        .settings-panel.collapsed { max-height: 0; overflow: hidden; padding: 0; border: none; }
        .toggle-settings-btn { position: absolute; right: 30px; top: 15px; background: transparent; border: 1px solid var(--card-border); color: var(--text-light); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; z-index: 10; }
        .toggle-settings-btn:hover { background: var(--card-bg); }
        
        .show-settings-bar { background: var(--settings-bg); padding: 15px 40px; border-bottom: 1px solid var(--card-border); display: none; transition: background-color 0.3s ease; text-align: right; }
        .show-settings-bar.visible { display: block; }
        .btn-show-settings { background: transparent; color: var(--text-light); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1.2rem; transition: all 0.2s; }
        .btn-show-settings:hover { background: var(--card-bg); }
        
        /* Responsive Mobile */
        @media (max-width: 768px) {
            .top-bar { 
                flex-direction: column; 
                padding: 10px 15px; 
                gap: 10px;
                align-items: stretch;
            }
            
            .app-title { 
                text-align: center; 
                font-size: 1rem;
            }
            
            .right-controls { 
                flex-wrap: wrap; 
                justify-content: center;
                gap: 8px;
            }
            
            .lang-selector, .btn-sound-global, .btn-ctrl, .btn-theme { 
                font-size: 0.75rem; 
                padding: 6px 10px;
            }
            
            .btn-theme {
                font-size: 1rem;
            }
            
            .settings-panel { 
                padding: 15px; 
            }
            
            .input-group { 
                flex-direction: column; 
                gap: 12px; 
                align-items: stretch;
            }
            
            .field { 
                width: 100%;
            }
            
            .input-name, .input-time { 
                width: 100%;
            }
            
            .btn-add-main { 
                width: 100%;
                padding: 12px;
            }
            
            .toggle-settings-btn {
                right: 15px;
            }
            
            .show-settings-bar {
                padding: 10px 15px;
            }
            
            #durationsList { 
                grid-template-columns: 1fr; 
                padding: 20px 15px; 
                gap: 20px;
            }
            
            .duration-card { 
                padding: 25px 20px 40px 20px;
                border-radius: 20px;
            }
            
            .time-left { 
                font-size: 4rem;
            }
            
            .label-nom { 
                font-size: 1.4rem;
            }
            
            .label-duree-titre { 
                font-size: 1rem;
            }
            
            .card-actions { 
                flex-direction: column; 
                gap: 8px;
            }
            
            .btn-start, .btn-action { 
                width: 100%;
                max-width: none;
            }
            
            .tabs-container {
                padding: 0 15px;
            }
            
            .tab-btn {
                padding: 12px 15px;
                font-size: 0.9rem;
            }
            
            .richtext-toolbar {
                padding: 8px 10px;
                gap: 4px;
            }
            
            .richtext-toolbar button {
                font-size: 0.85rem;
                padding: 5px 8px;
                min-width: 32px;
            }
            
            .richtext-editor { 
                padding: 20px; 
                font-size: 1.2rem;
            }
            
            .richtext-editor h1 { 
                font-size: 2.2rem;
            }
            
            .richtext-editor h2 { 
                font-size: 1.8rem;
            }
            
            .richtext-editor h3 { 
                font-size: 1.5rem;
            }
            
            .richtext-editor blockquote { 
                font-size: 1.3rem;
            }
        }
    </style>
</head>

    </audio>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="modal-message" id="confirmModalMessage"></div>
            <div class="modal-actions">
                <button class="modal-btn-cancel" id="confirmModalCancel">Annuler</button>
                <button class="modal-btn-confirm" id="confirmModalOk">Confirmer</button>
            </div>
        </div>
    </div>

    <div class="top-bar">
        <div class="app-title">TIMERS</div>
        <div class="right-controls">
            <button class="btn-theme" onclick="toggleTheme()" title="Basculer mode sombre/clair">
                <span id="themeIcon">🌙</span>
            </button>
            <select id="langSelector" class="lang-selector" onchange="changeLanguage(this.value)">
                <option value="fr">FR</option>
                <option value="de">DE</option>

// --- LOGIQUE EDITEUR WYSIWYG (contenteditable) ---
    // Convertit du Markdown brut en HTML, utilisé pour migrer l'ancien contenu
    // stocké en Markdown vers le nouveau format HTML.
    function markdownVersHtml(text) {
        let html = text
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/`(.+?)`/g, '<code>$1</code>')
            .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>')
            .replace(/^---$/gim, '<hr>')
            .replace(/^> (.+)$/gim, '<blockquote>$1</blockquote>');
        const lines = html.split('\n');
        let inList = false, inSubList = false, result = [];
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (/^- (.+)$/.test(line)) {
                if (!inList) { result.push('<ul>'); inList = true; }
                if (inSubList) { result.push('</ul></li>'); inSubList = false; }
                result.push('<li>' + line.replace(/^- /, '') + '</li>');
            } else if (/^  - (.+)$/.test(line) || /^\t- (.+)$/.test(line)) {
                if (!inSubList) {
                    result[result.length - 1] = result[result.length - 1].replace(/<\/li>$/, '');
                    result.push('<ul>'); inSubList = true;
                }
                result.push('<li>' + line.replace(/^  - /, '').replace(/^\t- /, '') + '</li>');
            } else if (/^\d+\. (.+)$/.test(line)) {
                if (inList && !inSubList) { result.push('</ul>'); inList = false; }
                if (inSubList) { result.push('</ul></li></ul>'); inList = false; inSubList = false; }
                if (!inList) { result.push('<ol>'); inList = true; }
                result.push('<li>' + line.replace(/^\d+\. /, '') + '</li>');
            } else {
                if (inSubList) { result.push('</ul></li>'); inSubList = false; }
                if (inList) { result.push(line.includes('<ol>') ? '</ol>' : '</ul>'); inList = false; }
                result.push(line);
            }
        }
        if (inSubList) result.push('</ul></li>');
        if (inList) result.push('</ul>');
        html = result.join('\n');
        html = html.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
        return '<p>' + html + '</p>';
    }

    function loadRichtext() {
        const editor = document.getElementById('richtextEditor');
        if (!editor) return;
        const savedHtml = localStorage.getItem('timers_richtext');
        if (savedHtml !== null) {
            editor.innerHTML = savedHtml;
            return;
        }
        // Migration : si du Markdown a été sauvegardé avec l'ancienne version
        const oldMarkdown = localStorage.getItem('timers_markdown');
        if (oldMarkdown) {
            editor.innerHTML = markdownVersHtml(oldMarkdown);
            saveRichtext();
            // On garde l'ancien Markdown pour le moment (au cas où) — il sera nettoyé via "Réinitialiser"
            return;
        }
        editor.innerHTML = defaultRichtext;
    }

    function saveRichtext() {
        const editor = document.getElementById('richtextEditor');
        if (!editor) return;
        localStorage.setItem('timers_richtext', editor.innerHTML);
    }

    // Applique une commande de formatage à la sélection courante
    function exec(command, value = null) {
        document.execCommand(command, false, value);
        const editor = document.getElementById('richtextEditor');
        if (editor) editor.focus();
        saveRichtext();
    }

    function formatBlock(tag) {
        // execCommand 'formatBlock' attend par exemple "<H1>" ou "h1" selon le navigateur
        document.execCommand('formatBlock', false, tag);
        const editor = document.getElementById('richtextEditor');
        if (editor) editor.focus();
        saveRichtext();
    }

    function insertLink() {

    }

    function entrerModeEdition() {
        const container = document.querySelector('.richtext-container');
        if (!container) return;
        if (container.classList.contains('editing')) return;
        container.classList.add('editing');
        // Mettre le focus dans l'éditeur (sans déplacer le curseur si l'utilisateur a déjà cliqué)
        const editor = document.getElementById('richtextEditor');
        if (editor && document.activeElement !== editor) editor.focus();
    }

    function sortirModeEdition() {
        const container = document.querySelector('.richtext-container');
        if (!container) return;
        container.classList.remove('editing');
        const editor = document.getElementById('richtextEditor');
        if (editor) {
            saveRichtext();
            editor.blur();
        }
    }

    function attacherToolbarRichtext() {
        const editor = document.getElementById('richtextEditor');
        if (!editor) return;
        // Auto-save (debouncé)
        let saveTimeout;
        editor.addEventListener('input', () => {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveRichtext, 500);
        });
        // Entrer en mode édition au clic ou au focus dans l'éditeur
        editor.addEventListener('mousedown', entrerModeEdition);
        editor.addEventListener('focus', entrerModeEdition);

        const bind = (id, fn) => {
            const btn = document.getElementById(id);
            if (btn) btn.addEventListener('click', (e) => { e.preventDefault(); fn(); });
        };
        bind('rt-h1', () => formatBlock('h1'));
        bind('rt-h2', () => formatBlock('h2'));
        bind('rt-h3', () => formatBlock('h3'));
        bind('rt-p', () => formatBlock('p'));
        bind('rt-bold', () => exec('bold'));
        bind('rt-italic', () => exec('italic'));
        bind('rt-underline', () => exec('underline'));
        bind('rt-ul', () => exec('insertUnorderedList'));
        bind('rt-ol', () => exec('insertOrderedList'));
        bind('rt-quote', () => formatBlock('blockquote'));
        bind('rt-link', () => insertLink());
        bind('rt-clear', () => exec('removeFormat'));
        bind('rt-close', () => sortirModeEdition());
        // Boutons zoom (n'entrent pas en mode édition pour éviter d'ouvrir la toolbar... attends, elle est déjà ouverte si on les voit)
        bind('rt-zoom-out', () => changerZoom(-0.1));
        bind('rt-zoom-in', () => changerZoom(0.1));
        bind('rt-zoom-reset', () => setZoom(1.0));
        // Appliquer le zoom restauré
        appliquerZoom();
    }

    function setZoom(value) {
        // Bornes : 0.7× à 2.5× pour rester raisonnable
        if (value < 0.7) value = 0.7;
        if (value > 2.5) value = 2.5;
        // Arrondir à 1 décimale pour éviter les flottants imprécis
        richtextZoom = Math.round(value * 10) / 10;
        appliquerZoom();
        sauvegarder();
    }

    function changerZoom(delta) {
        setZoom(richtextZoom + delta);
    }

    function appliquerZoom() {
        const editor = document.getElementById('richtextEditor');
        const pct = document.getElementById('rt-zoom-pct');
        if (editor) {
            // Le font-size de base de l'éditeur est 1.5rem dans le CSS
            const size = Math.round(1.5 * richtextZoom * 100) / 100;
            editor.style.fontSize = size + 'rem';
        }
        if (pct) pct.textContent = Math.round(richtextZoom * 100) + '%';
    }

// --- LOGIQUE AUDIO (IPAD FIX) ---
    const beep = document.getElementById('beepAudio');
    let audioCtx = null;
    let globalAudioCtx = null;

    function unlockAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        beep.play().then(() => { beep.pause(); beep.currentTime = 0; }).catch(() => {});
    }

    function playBellSound(id) {
        if (!globalSoundEnabled) return;
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        if (obj && obj.muted) return;

        try {
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            if (globalAudioCtx.state === 'suspended') {
                globalAudioCtx.resume();
            }

            const osc = globalAudioCtx.createOscillator();
            const g = globalAudioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, globalAudioCtx.currentTime);

            g.gain.setValueAtTime(0, globalAudioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0.4, globalAudioCtx.currentTime + 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, globalAudioCtx.currentTime + 1);

            osc.connect(g);
            g.connect(globalAudioCtx.destination);

            osc.start();
            osc.stop(globalAudioCtx.currentTime + 1);
            
        } catch(e) {
            console.log("Erreur audio répétition");
        }
    }

    function formaterTemps(s) { 
        const minutes = Math.floor(s/60);
        const secondes = s % 60;
        // On masque les secondes UNIQUEMENT si hideSeconds est actif ET qu'on est au-dessus du seuil
        if (hideSeconds && s >= secondsThreshold && minutes > 0) {
            return `${minutes} min`;
        }
        return `${minutes}:${secondes.toString().padStart(2,'0')}`; 
    }
    function formaterHeure(date) { return date.toLocaleTimeString(currentLang === 'en'?'en-US':(currentLang==='de'?'de-DE':'fr-FR'), {hour:'2-digit', minute:'2-digit'}); }

    function majHeureFin(id) {
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        const display = document.getElementById(`endtime-${id}`);
        if (obj?.start && display) {
            const finMs = obj.start + ((obj.totalSecs + obj.extraSecs) * 1000);
            const t = i18n[currentLang];
            const heureFin = formaterHeure(new Date(finMs));
            if (showStartTime) {
                const heureDebut = formaterHeure(new Date(obj.start));
                display.innerHTML = `<span class="start-time-part">${t.startedAt} ${heureDebut}</span>${t.finishAt} ${heureFin}`;
            } else {
                display.textContent = `${t.finishAt} ${heureFin}`;
            }
            display.title = t.showStartTimeTitle;
        } else if (display) {
            display.textContent = "";
            display.title = "";
        }
    }

    function toggleStartTime() {
        showStartTime = !showStartTime;
        // Rafraîchir tous les timers actifs
        listeDurees.forEach(d => majHeureFin(d.id));

    }

    // Helper : rafraîchir l'affichage de tous les timers (utilisé par toggle SEC et changement de seuil)
    function rafraichirTousAffichages() {
        listeDurees.forEach(d => {
            const timeDisplay = document.getElementById(`time-${d.id}`);
            if (timeDisplay) {
                const obj = listeDurees.find(obj => obj.id.toString() === d.id.toString());
                if (obj?.start) {
                    const ecoule = Date.now() - obj.start;
                    const total = (obj.totalSecs + obj.extraSecs) * 1000;
                    const restant = total - ecoule;
                    if (restant > 0) {
                        timeDisplay.textContent = formaterTemps(Math.ceil(restant/1000));
                    }
                } else {
                    timeDisplay.textContent = formaterTemps(d.totalSecs);
                }
            }
            const card = document.getElementById(`card-${d.id}`);
            if (card) {
                majTitreDuree(d.id);
            }
        });
    }

    function onThresholdChange() {
        const input = document.getElementById('thresholdInput');
        if (!input) return;
        let val = parseInt(input.value);
        if (isNaN(val) || val < 0) val = 0;
        if (val > 60) val = 60;
        input.value = val;
        secondsThreshold = val * 60;
        rafraichirTousAffichages();
        sauvegarder();
    }

    function ajouterDuree() {
        const t = i18n[currentLang];
        const nomInput = document.getElementById('nameInput').value.trim();
        const nom = nomInput || '';
        const totalSecs = (parseInt(document.getElementById('minInput').value)||0)*60 + (parseInt(document.getElementById('secInput').value)||0);
        if (totalSecs <= 0) return;
        const id = Date.now();
        const nouvelle = { id, nom, totalSecs, start: null, extraSecs: 0, muted: false };
        listeDurees.push(nouvelle);
        creerCarteHTML(nouvelle);
        document.getElementById('nameInput').value = ''; sauvegarder();
    }

    function creerCarteHTML(obj) {
        const t = i18n[currentLang];
        const card = document.createElement('div');
        card.className = 'duration-card'; card.id = `card-${obj.id}`; card.draggable = true;
        const nomHTML = obj.nom ? `<div class="label-nom">${obj.nom}</div>` : '';
        card.innerHTML = `<div class="drag-handle"><div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div></div>
            <button class="btn-duplicate" onclick="dupliquerDuree('${obj.id}')" title="${t.duplicate}">⎘</button>
            <button class="btn-close" onclick="supprimerDuree('${obj.id}')">×</button>
            <div class="label-duree-titre" id="title-${obj.id}" onclick="editerDuree('${obj.id}')" title="${t.editDurationTitle}">${t.duration} — ${formaterTemps(obj.totalSecs)}</div>
            ${nomHTML}
            <div class="time-left" id="time-${obj.id}" onclick="toggleHideSeconds()" title="${t.toggleSecondsTitle}">${formaterTemps(obj.totalSecs)}</div>
            <div class="end-time-display" id="endtime-${obj.id}" onclick="toggleStartTime()"></div>
            <div class="card-actions" id="actions-${obj.id}"><button class="btn-start" onclick="demarrerDuree('${obj.id}')">${t.start}</button></div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="progress-${obj.id}"></div></div>`;
        document.getElementById('durationsList').appendChild(card);
        attacherEvenementsDrag(card);
    }

    function demarrerDuree(id) {
        unlockAudio();
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        if(!obj) return;
        obj.start = Date.now();
        obj.extraSecs = 0;  // Réinitialiser le temps supplémentaire au démarrage
        majInterfaceActive(id); majHeureFin(id); majTitreDuree(id); lancerTick(id); sauvegarder();
    }

    // Met à jour le texte du titre "DURÉE — X:XX" ou "DURÉE — X:XX (+30s)" si extraSecs > 0
    function majTitreDuree(id) {
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const titleEl = document.getElementById(`title-${id}`);
        if (!titleEl) return;
        // Ne pas écraser si l'utilisateur est en mode édition
        if (titleEl.classList.contains('duration-edit-form')) return;
        const t = i18n[currentLang];
        let txt = `${t.duration} — ${formaterTemps(obj.totalSecs)}`;
        if (obj.extraSecs > 0) {
            txt += ` (+${formaterTempsExtra(obj.extraSecs)})`;
        }
        titleEl.textContent = txt;
    }

    // Format compact pour le temps supplémentaire : "30s", "1:30", "2:00"
    function formaterTempsExtra(s) {
        if (s < 60) return `${s}s`;
        const m = Math.floor(s/60);
        const sec = s % 60;
        if (sec === 0) return `${m}min`;
        return `${m}:${sec.toString().padStart(2,'0')}`;
    }

    // Tick global unique : tous les timers sont rafraîchis en même temps,
    // ce qui garantit l'affichage synchrone des timers dupliqués (même start).
    let globalTickInterval = null;
    let activeTickIds = new Set();

    function tickGlobal() {
        activeTickIds.forEach(id => {
            const obj = listeDurees.find(d => d.id.toString() === id.toString());
            if (!obj?.start) { activeTickIds.delete(id); return; }
            const ecoule = Date.now() - obj.start;
            const total = (obj.totalSecs + obj.extraSecs) * 1000;
            const restant = total - ecoule;
            const timeEl = document.getElementById(`time-${id}`);
            const progressEl = document.getElementById(`progress-${id}`);
            const card = document.getElementById(`card-${id}`);
            if (!timeEl || !progressEl || !card) { activeTickIds.delete(id); return; }
            if (restant <= 0) {
                timeEl.textContent = "0:00";
                progressEl.style.width = "100%";
                if (!card.classList.contains('finished')) { card.classList.add('finished'); lancerAlarme(id); }
                activeTickIds.delete(id);
                return;
            }
            timeEl.textContent = formaterTemps(Math.ceil(restant/1000));
            progressEl.style.width = (ecoule/total*100) + "%";
        });
        // Plus aucun timer actif → arrêter l'horloge
        if (activeTickIds.size === 0 && globalTickInterval !== null) {
            clearInterval(globalTickInterval);
            globalTickInterval = null;
        }
    }

    function lancerTick(id) {
        activeTickIds.add(id.toString());
        // Démarrer le tick global s'il n'est pas déjà actif
        if (globalTickInterval === null) {
            globalTickInterval = setInterval(tickGlobal, 250);
        }
        // Rafraîchissement immédiat pour que la carte affiche tout de suite la bonne valeur
        tickGlobal();
    }

    function arreterTick(id) {
        activeTickIds.delete(id.toString());
        if (activeTickIds.size === 0 && globalTickInterval !== null) {
            clearInterval(globalTickInterval);
            globalTickInterval = null;
        }
    }

    function lancerAlarme(id) { playBellSound(id); soundIntervals[id] = setInterval(() => playBellSound(id), 3000); }

    function stopDuree(id) {
        arreterTick(id); clearInterval(soundIntervals[id]);
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        obj.start = null; obj.extraSecs = 0;
        obj.muted = false;
        const card = document.getElementById(`card-${id}`);
        card.classList.remove('active', 'finished');
        document.getElementById(`time-${id}`).textContent = formaterTemps(obj.totalSecs);
        document.getElementById(`endtime-${id}`).textContent = "";
        majTitreDuree(id);
        document.getElementById(`actions-${id}`).innerHTML = `<button class="btn-start" onclick="demarrerDuree('${id}')">${i18n[currentLang].start}</button>`;
        sauvegarder();
    }

    function majInterfaceActive(id) {
        const t = i18n[currentLang]; const obj = listeDurees.find(d => d.id.toString() === id.toString());
        document.getElementById(`card-${id}`).classList.add('active');
        document.getElementById(`actions-${id}`).innerHTML = `
            <button class="btn-action btn-plus" onclick="ajouter30s('${id}')">${t.plus30}</button>
            <button class="btn-action btn-stop" onclick="stopDuree('${id}')">🛑 ${t.stop}</button>
            <button id="btn-mute-${id}" class="btn-action" onclick="toggleMute('${id}')">${obj.muted?'🔇':'🔊'} ${t.mute}</button>`;
    }

    function toggleMute(id) { 
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        obj.muted = !obj.muted; 
        document.getElementById(`btn-mute-${id}`).innerHTML = `${obj.muted?'🔇':'🔊'} ${i18n[currentLang].mute}`;
        sauvegarder();
    }

    function ajouter30s(id) {
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        obj.extraSecs += 30; majHeureFin(id); majTitreDuree(id);
        if (document.getElementById(`card-${id}`).classList.contains('finished')) {
            document.getElementById(`card-${id}`).classList.remove('finished');
            clearInterval(soundIntervals[id]); lancerTick(id);
        }
        sauvegarder();
    }

    async function supprimerDuree(id) {
        if (!document.getElementById(`card-${id}`).classList.contains('finished')) {
            const ok = await confirmDialog(i18n[currentLang].confirmDelete);
            if (!ok) return;
        }
        arreterTick(id); clearInterval(soundIntervals[id]);
        document.getElementById(`card-${id}`).remove();
        listeDurees = listeDurees.filter(d => d.id.toString() !== id.toString());
        sauvegarder();
    }

    // Modal de confirmation custom (préserve le plein écran, contrairement à window.confirm)
    function confirmDialog(message, options = {}) {
        return new Promise((resolve) => {
            const overlay = document.getElementById('confirmModal');
            const msg = document.getElementById('confirmModalMessage');
            const btnOk = document.getElementById('confirmModalOk');
            const btnCancel = document.getElementById('confirmModalCancel');
            const t = i18n[currentLang];
            const alertMode = options.alertMode === true;
            msg.textContent = message;
            btnOk.textContent = t.save || 'OK';
            btnCancel.textContent = t.cancel || 'Annuler';
            // En mode alerte, on n'affiche que OK
            btnCancel.style.display = alertMode ? 'none' : '';
            overlay.classList.add('visible');

            const cleanup = (result) => {
                overlay.classList.remove('visible');
                btnCancel.style.display = '';
                btnOk.removeEventListener('click', onOk);
                btnCancel.removeEventListener('click', onCancel);
                document.removeEventListener('keydown', onKey);
                overlay.removeEventListener('click', onOverlayClick);
                resolve(result);
            };
            const onOk = () => cleanup(true);
            const onCancel = () => cleanup(false);
            const onKey = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); cleanup(true); }
                else if (e.key === 'Escape') { e.preventDefault(); cleanup(alertMode ? true : false); }
            };
            const onOverlayClick = (e) => {
                // Clic sur le fond (pas sur la boîte) = annuler (ou OK en mode alerte)
                if (e.target === overlay) cleanup(alertMode ? true : false);
            };
            btnOk.addEventListener('click', onOk);
            btnCancel.addEventListener('click', onCancel);
            document.addEventListener('keydown', onKey);
            overlay.addEventListener('click', onOverlayClick);
            // En mode alerte, focus sur OK ; sinon sur Annuler (action moins destructive)
            setTimeout(() => (alertMode ? btnOk : btnCancel).focus(), 0);
        });
    }

    function dupliquerDuree(id) {
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        // Garantir un id unique même en cas de clics rapides
        let nouvelId = Date.now();
        while (listeDurees.some(d => d.id === nouvelId)) nouvelId++;
        // On copie TOUTES les propriétés du timer source
        const sourceLancee = obj.start !== null;
        const copie = {
            id: nouvelId,
            nom: obj.nom,
            totalSecs: obj.totalSecs,
            start: obj.start,           // même heure de départ exacte (synchro à la ms)
            extraSecs: obj.extraSecs,   // même temps supplémentaire
            muted: obj.muted            // même état muet
        };
        // Insérer juste après l'original dans la liste de données
        const index = listeDurees.findIndex(d => d.id.toString() === id.toString());
        listeDurees.splice(index + 1, 0, copie);
        // Créer la carte HTML et l'insérer juste après l'original dans le DOM
        creerCarteHTML(copie);
        const cardOriginale = document.getElementById(`card-${id}`);
        const cardCopie = document.getElementById(`card-${nouvelId}`);
        cardOriginale.after(cardCopie);
        // Si le timer source était en cours, refléter l'état d'exécution sur la copie
        if (sourceLancee) {
            const ecoule = Date.now() - copie.start;
            const total = (copie.totalSecs + copie.extraSecs) * 1000;
            if (ecoule < total) {
                majInterfaceActive(nouvelId);
                majHeureFin(nouvelId);
                majTitreDuree(nouvelId);
                lancerTick(nouvelId);
            } else {
                // Timer déjà terminé au moment de la duplication → reproduire l'état "fini"
                majInterfaceActive(nouvelId);
                majTitreDuree(nouvelId);
                document.getElementById(`time-${nouvelId}`).textContent = "0:00";
                document.getElementById(`progress-${nouvelId}`).style.width = "100%";
                const cardC = document.getElementById(`card-${nouvelId}`);
                cardC.classList.add('finished');
                lancerAlarme(nouvelId);
            }
        }
        sauvegarder();
    }

    function editerDuree(id) {
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const titleEl = document.getElementById(`title-${id}`);
        if (!titleEl) return;
        // Si déjà en mode édition, ne rien faire
        if (titleEl.querySelector('input')) return;
        // Fermer toute autre édition en cours
        document.querySelectorAll('.duration-edit-form').forEach(el => {
            const otherId = el.id.replace('title-', '');
            if (otherId !== id.toString()) annulerEditionDuree(otherId);
        });
        const t = i18n[currentLang];
        const min = Math.floor(obj.totalSecs / 60);
        const sec = obj.totalSecs % 60;
        titleEl.classList.remove('label-duree-titre');
        titleEl.classList.add('duration-edit-form');
        titleEl.onclick = null;
        titleEl.innerHTML = `
            <input type="number" id="edit-min-${id}" value="${min}" min="0" />
            <span>${t.labelMin}</span>
            <input type="number" id="edit-sec-${id}" value="${sec}" min="0" max="59" />
            <span>${t.labelSec}</span>
            <button type="button" id="edit-ok-${id}">${t.save}</button>
            <button type="button" class="btn-cancel" id="edit-cancel-${id}">${t.cancel}</button>
        `;
        const minInput = document.getElementById(`edit-min-${id}`);
        const secInput = document.getElementById(`edit-sec-${id}`);
        const btnOk = document.getElementById(`edit-ok-${id}`);
        const btnCancel = document.getElementById(`edit-cancel-${id}`);

        // Attacher les handlers via addEventListener pour plus de fiabilité
        // stopPropagation pour qu'un éventuel onclick parent ne se déclenche pas
        btnOk.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            validerEditionDuree(id);
        });
        btnCancel.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            annulerEditionDuree(id);
        });
        // Empêcher que le clic sur les inputs ferme/ré-ouvre quoi que ce soit
        [minInput, secInput].forEach(el => {
            el.addEventListener('click', (e) => e.stopPropagation());
        });

        minInput.focus();
        minInput.select();
        // Empêcher le drag pendant l'édition
        const card = document.getElementById(`card-${id}`);
        if (card) card.draggable = false;
        // Valider avec Entrée, annuler avec Échap
        const handler = (e) => {
            if (e.key === 'Enter') { e.preventDefault(); validerEditionDuree(id); }
            else if (e.key === 'Escape') { e.preventDefault(); annulerEditionDuree(id); }
        };
        minInput.addEventListener('keydown', handler);
        secInput.addEventListener('keydown', handler);
    }

    function validerEditionDuree(id) {
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const minInput = document.getElementById(`edit-min-${id}`);
        const secInput = document.getElementById(`edit-sec-${id}`);
        if (!minInput || !secInput) return;
        const nouveauTotal = (parseInt(minInput.value) || 0) * 60 + (parseInt(secInput.value) || 0);
        if (nouveauTotal <= 0) {
            // Durée invalide, on annule
            annulerEditionDuree(id);
            return;
        }
        // IMPORTANT : on ne touche PAS à obj.start si le timer tourne.
        // On modifie uniquement la durée totale ; le tick recalculera automatiquement.
        obj.totalSecs = nouveauTotal;

        // Restaurer le titre
        restaurerTitreDuree(id);

        // Si le timer tournait et qu'on a une nouvelle durée plus longue que le temps écoulé,
        // il faut potentiellement le sortir de l'état "fini" et relancer le tick.
        const card = document.getElementById(`card-${id}`);
        if (obj.start) {
            const ecoule = Date.now() - obj.start;
            const total = (obj.totalSecs + obj.extraSecs) * 1000;
            if (ecoule < total) {
                // Le timer doit (re)tourner
                if (card.classList.contains('finished')) {
                    card.classList.remove('finished');
                    clearInterval(soundIntervals[id]);
                }
                lancerTick(id);
                majHeureFin(id);
            } else {
                // La nouvelle durée est dépassée → forcer l'état fini si pas déjà
                document.getElementById(`time-${id}`).textContent = "0:00";
                document.getElementById(`progress-${id}`).style.width = "100%";
                if (!card.classList.contains('finished')) {
                    card.classList.add('finished');
                    lancerAlarme(id);
                }
                arreterTick(id);
            }
        } else {
            // Timer pas démarré : juste rafraîchir l'affichage du temps restant
            document.getElementById(`time-${id}`).textContent = formaterTemps(obj.totalSecs);
        }
        sauvegarder();
    }

    function annulerEditionDuree(id) {
        restaurerTitreDuree(id);
    }

    function restaurerTitreDuree(id) {
        const obj = listeDurees.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const titleEl = document.getElementById(`title-${id}`);
        if (!titleEl) return;
        const t = i18n[currentLang];
        titleEl.classList.remove('duration-edit-form');
        titleEl.classList.add('label-duree-titre');
        titleEl.title = t.editDurationTitle;
        titleEl.onclick = () => editerDuree(id);
        const card = document.getElementById(`card-${id}`);
        if (card) card.draggable = true;
        // Recalculer le texte avec extraSecs si pertinent
        majTitreDuree(id);
    }

    function sauvegarder() {
        if (listeDurees.length === 0 && !localStorage.getItem('timers_v17_data')) {
            // Ne rien faire si aucune donnée à sauvegarder
        }
        
        const dataToSave = {
            timers: listeDurees,
            globalSound: globalSoundEnabled,
            lang: currentLang,
            darkMode: darkMode,
            hideSeconds: hideSeconds,
            secondsThreshold: secondsThreshold,
            showStartTime: showStartTime,
            richtextZoom: richtextZoom
        };
        localStorage.setItem('timers_v17_data', JSON.stringify(dataToSave));
    }

    function handleDragStart(e) {
        this.classList.add('dragging');
        dragSrcEl = this;
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnter(e) {
        // (rien : on gère tout dans dragover pour avoir la position du curseur)
    }

    function handleDragLeave(e) {
        // (rien : on cache l'indicateur seulement à dragend ou drop)
    }

    function handleDragOver(e) {
        if (e.preventDefault) e.preventDefault();
        if (this === dragSrcEl) return false;
        const rect = this.getBoundingClientRect();
        // Détection du layout : si le voisin direct est à droite (même rangée), on est en mode multi-colonnes
        // → utiliser X pour décider du sens d'insertion. Sinon (mono-colonne), utiliser Y.
        const list = document.getElementById('durationsList');
        const cards = Array.from(list.querySelectorAll('.duration-card'));
        const idx = cards.indexOf(this);
        const voisinDroite = cards[idx + 1];
        const voisinGauche = cards[idx - 1];
        const memeRangee = (
            (voisinDroite && Math.abs(voisinDroite.getBoundingClientRect().top - rect.top) < 10) ||
            (voisinGauche && Math.abs(voisinGauche.getBoundingClientRect().top - rect.top) < 10)
        );
        const insererAvant = memeRangee
            ? (e.clientX < rect.left + rect.width / 2)
            : (e.clientY < rect.top + rect.height / 2);
        positionnerIndicateurDrop(this, insererAvant, memeRangee);
        return false;
    }

    function positionnerIndicateurDrop(targetCard, insererAvant, vertical) {
        const indicator = document.getElementById('dropIndicator');
        if (!indicator) return;
        const targetRect = targetCard.getBoundingClientRect();
        if (vertical) {
            // Barre verticale entre deux colonnes
            const left = insererAvant ? targetRect.left - 6 : targetRect.right - 2;
            indicator.style.left = (left + window.scrollX) + 'px';
            indicator.style.top = (targetRect.top + window.scrollY) + 'px';
            indicator.style.width = '6px';
            indicator.style.height = targetRect.height + 'px';
        } else {
            // Barre horizontale au-dessus/en-dessous (mono-colonne)
            const top = insererAvant ? targetRect.top - 6 : targetRect.bottom - 2;
            indicator.style.left = (targetRect.left + window.scrollX) + 'px';
            indicator.style.top = (top + window.scrollY) + 'px';
            indicator.style.width = targetRect.width + 'px';
            indicator.style.height = '6px';
        }
        indicator.classList.add('visible');
        indicator.dataset.targetId = targetCard.id;
        indicator.dataset.before = insererAvant ? '1' : '0';
    }

    function cacherIndicateurDrop() {
        const indicator = document.getElementById('dropIndicator');
        if (indicator) {
            indicator.classList.remove('visible');
            delete indicator.dataset.targetId;
            delete indicator.dataset.before;
        }
    }

    function handleDrop(e) {
        if (e.stopPropagation) e.stopPropagation();
        if (e.preventDefault) e.preventDefault();
        const indicator = document.getElementById('dropIndicator');
        const targetId = indicator?.dataset.targetId;
        const before = indicator?.dataset.before === '1';
        cacherIndicateurDrop();
        if (!dragSrcEl || !targetId) return false;
        const target = document.getElementById(targetId);
        if (!target || target === dragSrcEl) return false;
        if (before) target.before(dragSrcEl);
        else target.after(dragSrcEl);
        reindexerListe();
        return false;
    }

    function handleDragEnd(e) {
        cacherIndicateurDrop();
        const cards = document.querySelectorAll('.duration-card');
        cards.forEach(card => {
            card.classList.remove('over');
            card.classList.remove('dragging');
        });
    }

    function reindexerListe() {
        const nouvellesCartes = document.querySelectorAll('.duration-card');
        const nouvelleListe = [];
        nouvellesCartes.forEach(carte => {
            const id = carte.id.replace('card-', '');
            const timerObj = listeDurees.find(d => d.id.toString() === id.toString());
            if (timerObj) nouvelleListe.push(timerObj);
        });
        listeDurees = nouvelleListe;
        sauvegarder();
    }

    function attacherEvenementsDrag(el) {
        el.addEventListener('dragstart', handleDragStart, false);
        el.addEventListener('dragenter', handleDragEnter, false);
        el.addEventListener('dragover', handleDragOver, false);
        el.addEventListener('dragleave', handleDragLeave, false);
        el.addEventListener('drop', handleDrop, false);
        el.addEventListener('dragend', handleDragEnd, false);
    }

    async function reinitialiserTout() { fermerMenu(); if(await confirmDialog(i18n[currentLang].confirmReset)) { localStorage.clear(); location.reload(); } }
    function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

    // --- MENU DROPDOWN ---
    function toggleMenu(e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById('dropdownMenu');
        if (!menu) return;
        const isVisible = menu.classList.toggle('visible');
        if (isVisible) {
            // Fermer au prochain clic en dehors
            setTimeout(() => {
                const handler = (ev) => {
                    if (!menu.contains(ev.target)) {
                        fermerMenu();
                        document.removeEventListener('click', handler);
                    }
                };
                document.addEventListener('click', handler);
            }, 0);
        }
    }
    function fermerMenu() {
        const menu = document.getElementById('dropdownMenu');
        if (menu) menu.classList.remove('visible');
    }

    // --- EXPORT / IMPORT ---
    function exporterConfig() {
        fermerMenu();
        const data = {
            version: 1,
            exportedAt: new Date().toISOString(),
            data: {
                timers_v17_data: localStorage.getItem('timers_v17_data'),
                timers_richtext: localStorage.getItem('timers_richtext'),
                timers_markdown: localStorage.getItem('timers_markdown'), // legacy, pour les anciens utilisateurs pas encore migrés
                timers_current_tab: localStorage.getItem('timers_current_tab'),
                timers_settings_visible: localStorage.getItem('timers_settings_visible')
            }
        };
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const today = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `timers-backup-${today}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function importerConfig() {
        fermerMenu();
        const input = document.getElementById('importFileInput');
        if (!input) return;
        // Reset value pour pouvoir réimporter le même fichier deux fois de suite
        input.value = '';
        input.click();
    }

    async function gererFichierImport(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        try {
            const text = await file.text();
            const parsed = JSON.parse(text);
            // Valider la structure minimale
            if (!parsed || typeof parsed !== 'object' || !parsed.data || typeof parsed.data !== 'object') {
                throw new Error('Structure invalide');
            }
            // Au moins une clé connue doit être présente
            const knownKeys = ['timers_v17_data', 'timers_richtext', 'timers_markdown', 'timers_current_tab', 'timers_settings_visible'];
            const hasAnyKey = knownKeys.some(k => k in parsed.data);
            if (!hasAnyKey) throw new Error('Aucune donnée reconnue');
            // Confirmer avant écrasement
            const ok = await confirmDialog(i18n[currentLang].confirmImport);
            if (!ok) return;
            // Écrire dans localStorage (uniquement les clés présentes)
            knownKeys.forEach(k => {
                const v = parsed.data[k];
                if (v === null || v === undefined) {
                    localStorage.removeItem(k);
                } else if (typeof v === 'string') {
                    localStorage.setItem(k, v);
                }
            });
            // Recharger pour que tout soit appliqué proprement
            location.reload();
        } catch (e) {
            console.error('Import error:', e);
            await confirmDialog(i18n[currentLang].importError, { alertMode: true });
        }
    }

    document.addEventListener('dragend', (e) => {
        if (e.target.classList.contains('duration-card')) {
            e.target.classList.remove('dragging');
            reindexerListe();
        }
    });

    window.onload = () => {
        const savedData = localStorage.getItem('timers_v17_data');
        
        if (savedData) {
            const data = JSON.parse(savedData);
            
            // 1. Restaurer les réglages
            currentLang = data.lang || 'fr';
            globalSoundEnabled = data.globalSound !== undefined ? data.globalSound : true;
            darkMode = data.darkMode !== undefined ? data.darkMode : false;
            hideSeconds = data.hideSeconds !== undefined ? data.hideSeconds : false;
            secondsThreshold = data.secondsThreshold !== undefined ? data.secondsThreshold : 180;
            // Migration : si l'ancienne forme (Set d'IDs) existe, on prend "true" si non vide
            if (data.showStartTime !== undefined) {
                showStartTime = data.showStartTime;
            } else if (Array.isArray(data.showStartTimeIds) && data.showStartTimeIds.length > 0) {
                showStartTime = true;
            } else {
                showStartTime = false;
            }
            richtextZoom = data.richtextZoom !== undefined ? data.richtextZoom : 1.0;
            
            // 2. Vider la liste actuelle avant de recharger
            listeDurees = [];
            document.getElementById('durationsList').innerHTML = "";

            // 3. Recharger les timers
            if (data.timers && data.timers.length > 0) {
                data.timers.forEach(d => {
                    listeDurees.push(d);
                    creerCarteHTML(d);
                    
                    if (d.start) {
                        const ecoule = Date.now() - d.start;
                        const total = (d.totalSecs + d.extraSecs) * 1000;
                        
                        if (ecoule < total) {
                            majInterfaceActive(d.id);
                            majHeureFin(d.id);
                            lancerTick(d.id);
                        } else {
                            d.start = null; 
                            d.extraSecs = 0;
                            d.muted = false;
                        }
                    }
                });
            }
            
            // 4. Appliquer la langue, le son, le thème et le seuil de secondes
            changeLanguage(currentLang);
            updateGlobalSoundUI();
            const threshInput = document.getElementById('thresholdInput');
            if (threshInput) threshInput.value = Math.round(secondsThreshold / 60);
            applyTheme();
        }
        
        // 5. Restaurer l'onglet actif
        const savedTab = localStorage.getItem('timers_current_tab');
        if (savedTab) {
            currentTab = savedTab;
            switchTab(savedTab);
        }
        
        // 6. Restaurer l'état du panneau settings
        const savedSettingsVisible = localStorage.getItem('timers_settings_visible');
        if (savedSettingsVisible !== null) {
            settingsPanelVisible = savedSettingsVisible === 'true';
            const panel = document.getElementById('settingsPanel');
            const btn = document.getElementById('toggleSettingsBtn');
            const showBar = document.getElementById('showSettingsBar');
            if (!settingsPanelVisible) {
                panel.classList.add('collapsed');
                showBar.classList.add('visible');
                btn.textContent = '▼';
            }
        }

        // 7. Initialiser l'éditeur richtext (toolbar + contenu)
        attacherToolbarRichtext();
        loadRichtext();

        // 8. Attacher le gestionnaire d'import de fichier
        const importInput = document.getElementById('importFileInput');
        if (importInput) importInput.addEventListener('change', gererFichierImport);
    };

</script>
