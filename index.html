    // (Re)build the Notes clock inside the editor, honoring notesClockVisible/Mode/Scale.
    // The clock is a contenteditable=false floating element; text wraps around it.
    function syncNotesClock() {
        const editor = document.getElementById('richtextEditor');
        if (!editor) return;
        stopNotesClockAnimations();
        // Remove any existing clock first.
        editor.querySelectorAll('.notes-clock-float').forEach(el => el.remove());
        if (!notesClockVisible) return;
        const t = i18n[currentLang];
        const handle = `<div class="clock-resize-handle" onmousedown="event.stopPropagation(); startNotesClockResize(event)" ontouchstart="event.stopPropagation(); startNotesClockResize(event)" title="${t.clockResizeTitle || 'Glisser pour redimensionner'}"></div>`;
        let inner = '';
        if (notesClockMode === 'digital') {
            inner = `<div class="clock-digital" id="notesClockDigital"></div>`;
        } else if (notesClockMode === 'cff') {
            inner = buildNotesCffSvg();
        } else { // both
            inner = `${buildNotesCffSvg()}<div class="clock-digital" id="notesClockDigital"></div>`;
        }
        // Build the floating element. contenteditable=false so the caret can't enter it.
        // Structure: .clock-clickable > (.notes-clock-inner [scaled content] + handle).
        // The handle is a sibling of the scaled content, so it neither shifts the centering
        // nor distorts the transform-origin used for scaling.
        const wrap = document.createElement('div');
        wrap.className = 'notes-clock-float' + (notesClockMode === 'cff' ? ' cff-mode' : (notesClockMode === 'both' ? ' both-mode' : ''));
        wrap.setAttribute('contenteditable', 'false');
        wrap.innerHTML = `<div class="clock-clickable" onclick="cycleNotesClock()" title="${t.clockToggleTitle || ''}"><div class="notes-clock-inner">${inner}</div>${handle}</div>`;
        // Insert as the first child so the float sits at the top-right and text flows around.
        editor.insertBefore(wrap, editor.firstChild);
        applyNotesClockScale();
        if (notesClockMode === 'cff' || notesClockMode === 'both') tickNotesCffClock();
        if (notesClockMode === 'digital' || notesClockMode === 'both') tickNotesDigitalClock();
    }

    function applyNotesClockScale() {
        // Scale the inner content only (not the handle), so the transform-origin matches
        // the visual center of the clock and the handle stays put.
        const wrapper = document.querySelector('.notes-clock-float .notes-clock-inner');
        if (!wrapper) return;
        // The clock lives inside the editor, which itself may be zoomed (richtextZoom).
        // To keep the clock's apparent size independent of the editor zoom, divide the
        // clock scale by the current editor zoom (so zoom × (scale/zoom) = scale).
        const z = (typeof richtextZoom === 'number' && richtextZoom > 0) ? richtextZoom : 1;
        applyScale(wrapper, notesClockScale / z);
    }

    // Toggle clock on/off (toolbar button).
    function toggleNotesClock() {
        notesClockVisible = !notesClockVisible;
        if (notesClockVisible && (notesClockMode === 'none' || !notesClockMode)) notesClockMode = 'both';
        syncNotesClock();
        updateNotesClockButton();
        save();
    }

    // Cycle through the 3 display modes when clicking the clock.
    function cycleNotesClock() {
        const order = ['digital', 'cff', 'both'];
        const i = order.indexOf(notesClockMode);
        notesClockMode = order[(i + 1) % order.length];
        syncNotesClock();
        save();
    }

    function updateNotesClockButton() {
        const btn = document.getElementById('notesClockBtn');
        if (btn) btn.classList.toggle('active', notesClockVisible);
    }

    function startNotesClockResize(e) {
        const wrapper = document.querySelector('.notes-clock-float .clock-clickable');
        if (!wrapper) return;
        e.preventDefault();
        const point = e.touches ? e.touches[0] : e;
        const startX = point.clientX, startY = point.clientY;
        const startScale = notesClockScale;
        wrapper.classList.add('resizing');
        let aBouge = false;
        const onMove = (ev) => {
            const p = ev.touches ? ev.touches[0] : ev;
            const dx = p.clientX - startX, dy = p.clientY - startY;
            if (Math.abs(dx) + Math.abs(dy) > 3) aBouge = true;
            // Handle is bottom-LEFT: dragging left (dx negative) and/or down (dy positive)
            // should enlarge. So we use (-dx + dy)/2 as the growth delta.
            let newScale = startScale + (-dx + dy) / 2 / 100;
            if (newScale < 0.4) newScale = 0.4;
            // No maximum cap — let it grow as large as the user wants.
            notesClockScale = Math.round(newScale * 100) / 100;
            applyNotesClockScale();
        };
        const onEnd = () => {
            wrapper.classList.remove('resizing');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
            if (aBouge) {
                const blockClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); document.removeEventListener('click', blockClick, true); };
                document.addEventListener('click', blockClick, true);
            }
            save();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
    }


    function globalTick() {
        activeTickIds.forEach(id => {
            const obj = timersList.find(d => d.id.toString() === id.toString());
            if (!obj?.start) { activeTickIds.delete(id); return; }
            const ecoule = effectiveNow(obj) - obj.start;
            const total = (obj.totalSecs + obj.extraSecs) * 1000;
            const restant = total - ecoule;
            const timeEl = document.getElementById(`time-${id}`);
            const progressEl = document.getElementById(`progress-${id}`);
            const card = document.getElementById(`card-${id}`);
            if (!timeEl || !progressEl || !card) { activeTickIds.delete(id); return; }
            if (restant <= 0) {
                timeEl.textContent = "0:00";
                progressEl.style.width = "100%";
                if (showVisualTimer) updateVisualTimerDisc(id);
                if (!card.classList.contains('finished')) { markFinished(id); }
                activeTickIds.delete(id);
                return;
            }
            timeEl.textContent = formatTime(Math.ceil(restant/1000));
            progressEl.style.width = (ecoule/total*100) + "%";
            if (showVisualTimer) updateVisualTimerDisc(id);
        });
        // No more active timers → stop the clock
        if (activeTickIds.size === 0 && globalTickInterval !== null) {
            clearInterval(globalTickInterval);
            globalTickInterval = null;
        }
    }

    function startTick(id) {
        activeTickIds.add(id.toString());
        // Start the global tick if not already active
        if (globalTickInterval === null) {
            globalTickInterval = setInterval(globalTick, 250);
        }
        // Immediate refresh so the card displays the correct value right away
        globalTick();
        // Keep the screen on while a timer is running.
        refreshWakeLock();
    }

    function stopTick(id) {
        activeTickIds.delete(id.toString());
        if (activeTickIds.size === 0 && globalTickInterval !== null) {
            clearInterval(globalTickInterval);
            globalTickInterval = null;
        }
        // Drop the wake lock if no timer is running anymore.
        refreshWakeLock();
    }

    // ============================================================================
    // SCHEDULED START — daily-recurring auto-start at a chosen time of day.
    // Each timer carries a `scheduledTimeOfDay` string "HH:MM:SS" (or null). When the
    // autoStartTimers option is ON and the current wall-clock time crosses this time,
    // the timer is started. The schedule does NOT get consumed — tomorrow at the same
    // wall-clock time it will fire again. So a programmed timer is essentially a daily
    // alarm. To avoid firing twice in the same crossing, we remember each timer's last
    // fired day+time in a transient Map (not persisted).
    //
    // Crossing logic: at every tick, for each timer with a schedule, we compute the
    // most-recent-past occurrence of its time-of-day. If that occurrence is more recent
    // than what we last fired AND the timer isn't currently running (start === null),
    // we fire. This naturally handles the case where the page was opened after the
    // scheduled time has passed today (we won't fire — we wait for tomorrow's crossing).
    // ============================================================================
    let scheduledTickInterval = null;
    const lastFiredOccurrence = new Map(); // id -> ms timestamp of the last occurrence we fired

    // Parse "HH:MM:SS" or "HH:MM" → {h,m,s}. Returns null on invalid input.
    function parseTimeOfDay(str) {
        if (typeof str !== 'string') return null;
        const m = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
        if (!m) return null;
        const h = parseInt(m[1], 10), mn = parseInt(m[2], 10), s = m[3] ? parseInt(m[3], 10) : 0;
        if (h < 0 || h > 23 || mn < 0 || mn > 59 || s < 0 || s > 59) return null;
        return { h, m: mn, s };
    }

    function formatTimeOfDay(str) {
        const p = parseTimeOfDay(str);
        if (!p) return '';
        return `${p.h.toString().padStart(2,'0')}:${p.m.toString().padStart(2,'0')}:${p.s.toString().padStart(2,'0')}`;
    }

    // Given a time-of-day "HH:MM:SS", return the most recent past (or current) occurrence
    // as a Date.now()-style timestamp. If today's occurrence is still in the future,
    // returns yesterday's occurrence (so the difference with Date.now() tells whether we
    // are before or after the next crossing).
    function mostRecentOccurrenceMs(timeOfDay) {
        const p = parseTimeOfDay(timeOfDay);
        if (!p) return null;
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), p.h, p.m, p.s, 0).getTime();
        if (today <= Date.now()) return today;
        // today's occurrence is in the future → most-recent-past is yesterday's
        return today - 24 * 3600 * 1000;
    }

    // Next occurrence in the future (for display purposes).
    function nextOccurrenceMs(timeOfDay) {
        const p = parseTimeOfDay(timeOfDay);
        if (!p) return null;
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), p.h, p.m, p.s, 0).getTime();
        return (today > Date.now()) ? today : (today + 24 * 3600 * 1000);
    }

    function anyScheduledPending() {
        if (!autoStartTimers) return false;
        return timersList.some(d => d.scheduledTimeOfDay && d.start === null);
    }

    // Start/stop the scheduled tick based on whether there's anything to wait for.
    function refreshScheduledTick() {
        if (anyScheduledPending()) {
            if (scheduledTickInterval === null) {
                scheduledTickInterval = setInterval(scheduledTick, 250);
            }
        } else if (scheduledTickInterval !== null) {
            clearInterval(scheduledTickInterval);
            scheduledTickInterval = null;
        }
    }

    // At each tick, fire any timer whose most-recent occurrence is in the (recent) past
    // and hasn't been fired for that occurrence yet. We seed lastFiredOccurrence on load
    // with today's-or-past occurrence so we DON'T retroactively fire one that was crossed
    // before the page opened.
    function scheduledTick() {
        if (!autoStartTimers) { refreshScheduledTick(); return; }
        let didFire = false;
        timersList.forEach(d => {
            if (!d.scheduledTimeOfDay || d.start !== null) return;
            const occ = mostRecentOccurrenceMs(d.scheduledTimeOfDay);
            if (occ === null) return;
            const last = lastFiredOccurrence.get(d.id.toString()) || 0;
            // Fire only if a NEW occurrence has been crossed since the last one we fired,
            // and it's within a reasonable window (≤ 12h ago) so we never auto-start a
            // timer for an occurrence the user couldn't have wanted to honor (e.g. opened
            // the page hours after the scheduled time).
            const ageMs = Date.now() - occ;
            if (occ > last && ageMs <= 12 * 3600 * 1000 && ageMs >= 0) {
                lastFiredOccurrence.set(d.id.toString(), occ);
                startTimer(d.id);
                didFire = true;
            }
        });
        if (didFire) {
            refreshChainLabels();
            save();
        }
    }

    // Seed lastFiredOccurrence at load time so retroactive crossings don't fire on open.
    // Called once after timers are loaded.
    function seedSchedulesAtLoad() {
        timersList.forEach(d => {
            if (!d.scheduledTimeOfDay) return;
            const occ = mostRecentOccurrenceMs(d.scheduledTimeOfDay);
            if (occ !== null) lastFiredOccurrence.set(d.id.toString(), occ);
        });
    }

    // Programmatic API to schedule a timer. Pass an "HH:MM:SS" string, or null to clear.
    function setTimerSchedule(id, timeOfDay) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        if (obj.start !== null) return;  // can't schedule an already-running timer
        const normalized = timeOfDay ? formatTimeOfDay(timeOfDay) : '';
        obj.scheduledTimeOfDay = normalized || null;
        // When a NEW schedule is set, seed lastFired so today's already-past occurrence
        // doesn't fire immediately on the next tick. (If the user wants to fire today,
        // they should set a time slightly in the future.)
        if (obj.scheduledTimeOfDay) {
            const occ = mostRecentOccurrenceMs(obj.scheduledTimeOfDay);
            if (occ !== null) lastFiredOccurrence.set(id.toString(), occ);
        } else {
            lastFiredOccurrence.delete(id.toString());
        }
        refreshChainLabels();
        save();
        refreshScheduledTick();
        refreshAudioUnlockBanner();
    }

    // ---- Schedule modal (opened by the A↻ button on each not-started timer card) ----
    let currentScheduleTimerId = null;

    function openScheduleModal(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        currentScheduleTimerId = id;
        const modal = document.getElementById('scheduleModal');
        const hI = document.getElementById('scheduleH');
        const mI = document.getElementById('scheduleM');
        const sI = document.getElementById('scheduleS');
        const delBtn = document.getElementById('txt-schedule-delete');
        // Pre-fill: existing schedule, or current time + 1 minute if none yet.
        const existing = parseTimeOfDay(obj.scheduledTimeOfDay || '');
        if (existing) {
            hI.value = existing.h; mI.value = existing.m; sI.value = existing.s;
            if (delBtn) delBtn.style.display = '';
        } else {
            const now = new Date(Date.now() + 60000);
            hI.value = now.getHours(); mI.value = now.getMinutes(); sI.value = now.getSeconds();
            if (delBtn) delBtn.style.display = 'none';
        }
        modal.classList.add('visible');
        // Focus the hours field for quick editing
        setTimeout(() => hI.focus(), 50);
        // Escape closes, Enter confirms
        const onKey = (e) => {
            if (e.key === 'Escape') { e.preventDefault(); closeScheduleModal(); }
            else if (e.key === 'Enter' && ['scheduleH','scheduleM','scheduleS'].includes(e.target.id)) {
                e.preventDefault(); confirmScheduleSet();
            }
        };
        document.addEventListener('keydown', onKey);
        modal._onKey = onKey;
    }

    function closeScheduleModal() {
        const modal = document.getElementById('scheduleModal');
        if (!modal) return;
        modal.classList.remove('visible');
        if (modal._onKey) { document.removeEventListener('keydown', modal._onKey); modal._onKey = null; }
        currentScheduleTimerId = null;
    }

    function confirmScheduleSet() {
        if (currentScheduleTimerId === null) return;
        const h = parseInt(document.getElementById('scheduleH').value, 10) || 0;
        const m = parseInt(document.getElementById('scheduleM').value, 10) || 0;
        const s = parseInt(document.getElementById('scheduleS').value, 10) || 0;
        const clamp = (v, max) => Math.max(0, Math.min(max, v));
        const time = `${clamp(h,23).toString().padStart(2,'0')}:${clamp(m,59).toString().padStart(2,'0')}:${clamp(s,59).toString().padStart(2,'0')}`;
        setTimerSchedule(currentScheduleTimerId, time);
        closeScheduleModal();
    }

    function confirmScheduleDelete() {
        if (currentScheduleTimerId === null) return;
        setTimerSchedule(currentScheduleTimerId, null);
        closeScheduleModal();
    }

    function playAlarm(id) { playBellSound(id); soundIntervals[id] = setInterval(() => playBellSound(id), 3000); }

    // Map id → setTimeout for auto-reset countdowns
    let autoResetTimeouts = {};
    // Track when each auto-reset started, to be able to compute remaining time after
    // a DOM reorganization (drag&drop) which interrupts the CSS transition.
    let autoResetStartedAt = {};

    // Marks a timer as finished: adds the finished class, plays the alarm, and starts
    // possibly the auto-reset depending on the setting. Centralized to avoid duplicating logic.
    function markFinished(id) {
        const card = document.getElementById(`card-${id}`);
        if (!card || card.classList.contains('finished')) return;
        card.classList.add('finished');
        card.classList.remove('is-running');
        playAlarm(id);
        updatePauseAllButton();
        // Auto-reset runs normally (it animates the bar back down). When "hide finished
        // timers" is enabled, the timer gets hidden AFTER the auto-reset completes (handled
        // in startAutoReset's timeout). If there's no auto-reset delay, we hide after a
        // short grace period so the alarm is heard.
        if (autoResetDelay > 0) startAutoReset(id);
        else if (hideFinished) {
            // No reset delay: let the alarm play briefly, then hide. hideTimer() resets the
            // timer first, so it's hidden in a clean (non-red) state.
            setTimeout(() => { hideTimer(id); }, 1500);
        }
        // Timer chaining: when enabled, finishing a timer auto-starts the next one in
        // display order that hasn't been started yet. This lets the user queue a sequence
        // of timers (e.g. exercise intervals) that run one after another.
        // IMPORTANT: markFinished is called from within globalTick's forEach loop. Starting
        // the next timer there would re-enter globalTick (via startTick) while we're still
        // iterating activeTickIds — that corrupts the iteration and overwrites the
        // just-applied auto-reset bar animation (the finished timer would no longer reset).
        // So we defer the chaining to the next macrotask, after the current tick completes.
        if (chainTimers) {
            const idx = timersList.findIndex(d => d.id.toString() === id.toString());
            if (idx !== -1 && idx + 1 < timersList.length) {
                // Strictly the immediately-following timer — never skip to a later one.
                // Only start it if it hasn't been started yet (and isn't paused/running).
                const next = timersList[idx + 1];
                if (next.start === null) {
                    const nextId = next.id;
                    setTimeout(() => {
                        // Re-check it's still not started (could have changed in the
                        // meantime, e.g. user interaction).
                        const nextObj = timersList.find(d => d.id === nextId);
                        if (nextObj && nextObj.start === null) startTimer(nextId);
                    }, 0);
                }
            }
        }
    }

    function startAutoReset(id) {
        // Cancel any previously scheduled reset for this timer
        cancelAutoReset(id);
        const card = document.getElementById(`card-${id}`);
        const fill = document.getElementById(`progress-${id}`);
        if (!card || !fill) return;
        // Animate the red bar from right to left: invert direction via a class,
        // then trigger the transition to width:0 over the autoResetDelay duration.
        card.classList.add('auto-resetting');
        // Forcer reflow pour que la transition prenne effet (sinon le navigateur peut
        // grouper les changements de style et zapper la transition).
        fill.style.width = '100%';
        // eslint-disable-next-line no-unused-expressions
        fill.offsetWidth;
        fill.style.transition = `width ${autoResetDelay}s linear`;
        fill.style.width = '0%';
        autoResetStartedAt[id] = Date.now();
        // At the end of the delay, reset the timer
        autoResetTimeouts[id] = setTimeout(() => {
            delete autoResetTimeouts[id];
            delete autoResetStartedAt[id];
            stopTimer(id);
            // If "hide finished timers" is enabled, hide the timer now that the auto-reset
            // delay has elapsed (the timer is back to its initial state and gets tucked away).
            if (hideFinished) hideTimer(id);
        }, autoResetDelay * 1000);
    }

    function cancelAutoReset(id) {
        if (autoResetTimeouts[id]) {
            clearTimeout(autoResetTimeouts[id]);
            delete autoResetTimeouts[id];
        }
        delete autoResetStartedAt[id];
        const card = document.getElementById(`card-${id}`);
        const fill = document.getElementById(`progress-${id}`);
        if (card) card.classList.remove('auto-resetting');
        if (fill) {
            // Restore the default transition (1s linear like in the base CSS)
            fill.style.transition = '';
        }
    }

    function onButtonsHoverOnlyChange() {
        const checkbox = document.getElementById('buttonsHoverOnlyCheckbox');
        if (!checkbox) return;
        buttonsHoverOnly = checkbox.checked;
        applyButtonsVisibilityMode();
        save();
    }

    function onHideTimerButtonsChange() {
        const checkbox = document.getElementById('hideTimerButtonsCheckbox');
        if (!checkbox) return;
        hideTimerButtons = checkbox.checked;
        applyHideTimerButtonsMode();
        save();
    }

    // Toggle the body class that drives the "hide timer buttons" CSS. When on, per-card
    // action buttons are hidden at rest (their space preserved) and revealed on hover/tap.
    function applyHideTimerButtonsMode() {
        document.body.classList.toggle('hide-timer-buttons', hideTimerButtons);
        if (!hideTimerButtons) document.body.classList.remove('timer-buttons-revealed');
    }

    function onChainTimersChange() {
        const checkbox = document.getElementById('chainTimersCheckbox');
        if (!checkbox) return;
        chainTimers = checkbox.checked;
        save();
        // Toggling chaining changes whether "auto start" hints are shown.
        refreshChainLabels();
    }

    function onAutoStartTimersChange() {
        const checkbox = document.getElementById('autoStartTimersCheckbox');
        if (!checkbox) return;
        autoStartTimers = checkbox.checked;
        save();
        // Toggling this option changes whether "scheduled start" labels appear, and
        // whether the scheduled tick is running.
        refreshChainLabels();
        refreshScheduledTick();
        refreshAudioUnlockBanner();
    }

    function onHideFinishedChange() {
        const checkbox = document.getElementById('hideFinishedCheckbox');
        if (!checkbox) return;
        hideFinished = checkbox.checked;
        save();
    }

    function onVisualTimerChange() {
        const checkbox = document.getElementById('visualTimerCheckbox');
        if (!checkbox) return;
        const wasOn = showVisualTimer;
        showVisualTimer = checkbox.checked;
        applyVisualTimerVisibility();
        // If we just turned the feature ON (not at initial load), play the wind-up
        // animation only on timers that are already running. Timers not started yet
        // stay with an empty disc.
        if (showVisualTimer && !wasOn) {
            timersList.forEach(d => {
                if (d.start !== null) animateVisualTimerWindUp(d.id);
            });
        }
        save();
    }

    // Show/hide the Visual Timer disc on every timer card and adjust the
    // time-left font size accordingly (smaller when the disc is shown to keep the
    // card layout balanced).
    function applyVisualTimerVisibility() {
        document.querySelectorAll('.duration-card').forEach(card => {
            card.classList.toggle('with-visual-timer', showVisualTimer);
        });
        // Refresh all displays so the disc shows the current remaining time
        if (showVisualTimer) {
            timersList.forEach(d => updateVisualTimerDisc(d.id));
        }
    }

    // Toggle a body class that controls whether floating buttons (add/play/stop/zoom)
    // are visible at all times or only when the user hovers near their corner.
    function applyButtonsVisibilityMode() {
        document.body.classList.toggle('buttons-hover-only', buttonsHoverOnly);
        // Make sure global play/pause/stop are not classed `hidden` from the legacy code path
        const btnStartAll = document.getElementById('btnStartAll');
        if (btnStartAll) btnStartAll.classList.remove('hidden');
        const btnPauseAll = document.getElementById('btnPauseAll');
        if (btnPauseAll) btnPauseAll.classList.remove('hidden');
        const btnStopAll = document.getElementById('btnStopAll');
        if (btnStopAll) btnStopAll.classList.remove('hidden');
    }

    // In hover-only mode, reveal the buttons when the user moves the mouse into the
    // bottom-right area of the screen, or when the user taps anywhere (touch devices).
    // The reveal lasts a few seconds after the last interaction.
    let revealTimer = null;
    const REVEAL_MS = 3000;

    function revealFloatingButtons(durationMs = REVEAL_MS) {
        if (!buttonsHoverOnly) return;
        document.body.classList.add('buttons-temp-revealed');
        if (revealTimer) clearTimeout(revealTimer);
        revealTimer = setTimeout(() => {
            document.body.classList.remove('buttons-temp-revealed');
            revealTimer = null;
        }, durationMs);
    }

    // Same idea for the per-card timer buttons. On desktop the reveal is driven by CSS
    // (#durationsList:hover), but touch devices have no hover, so a tap reveals them here
    // for a few seconds. We also reveal on mouse movement as a convenience.
    let revealTimerBtnTimer = null;
    function revealTimerButtons(durationMs = REVEAL_MS) {
        if (!hideTimerButtons) return;
        document.body.classList.add('timer-buttons-revealed');
        if (revealTimerBtnTimer) clearTimeout(revealTimerBtnTimer);
        revealTimerBtnTimer = setTimeout(() => {
            document.body.classList.remove('timer-buttons-revealed');
            revealTimerBtnTimer = null;
        }, durationMs);
    }

    // Mouse: reveal when the cursor enters the bottom-right quadrant (within ~250px of
    // the corner). Use mousemove with throttling.
    let lastMoveCheck = 0;
    document.addEventListener('mousemove', (e) => {
        if (!buttonsHoverOnly) return;
        const now = Date.now();
        if (now - lastMoveCheck < 50) return; // throttle to ~20 Hz
        lastMoveCheck = now;
        const dx = window.innerWidth - e.clientX;
        const dy = window.innerHeight - e.clientY;
        if (dx >= 0 && dx <= 350 && dy >= 0 && dy <= 320) {
            revealFloatingButtons();
        }
    });

    // Touch: tapping anywhere on the page reveals the floating buttons for a few seconds
    // so the user can then aim at one. We bind on `touchend` (not `touchstart`) so that we
    // don't perturb the click event chain — on iOS, mutating the DOM/CSS during touchstart
    // can sometimes cancel the subsequent click on the originally-tapped element (e.g. a
    // START button on a timer card). By waiting for touchend, the click has already been
    // queued by the browser.
    document.addEventListener('touchend', () => {
        if (buttonsHoverOnly) revealFloatingButtons();
        if (hideTimerButtons) revealTimerButtons();
    }, { passive: true });

    // Detect browsers that correctly support the CSS 'zoom' property.
    // Safari desktop and mobile both support 'zoom' (since Safari 4) but iPad OS 13+ has
    // a bug where 'zoom' doesn't scale text correctly on certain elements (rem units stay).
    // Firefox supports 'zoom' since 126; older Firefox parses and discards it.
    // Strategy: use 'zoom' everywhere EXCEPT on iPad OS where we fall back to transform.
    // (Note: iPhone iOS Safari seems to handle 'zoom' correctly, but iPad OS doesn't —
    // we lump them together to be safe, since they share the same WebKit engine.)
    const supportsCssZoom = (() => {
        const ua = navigator.userAgent;
        const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        // Old Firefox (< 126) doesn't support zoom either
        const ffMatch = ua.match(/Firefox\/(\d+)/);
        const isOldFirefox = ffMatch && parseInt(ffMatch[1]) < 126;
        return !isIOS && !isOldFirefox;
    })();

    // Applies a visual scaling factor to an element, in a compatible way.
    // Strategy:
    //   - On Firefox/Chrome/Edge: 'zoom' (clean rendering, layout handled automatically)
    //   - On Safari/iOS: 'transform: scale' with centered transform-origin and compensating margin
    function applyScale(el, scale) {
        if (!el) return;
        // Reset if scale = 1 (default case)
        if (Math.abs(scale - 1.0) < 0.001) {
            el.style.transform = '';
            el.style.transformOrigin = '';
            el.style.marginBottom = '';
            el.style.zoom = '';
            return;
        }
        if (supportsCssZoom) {
            // Main path (desktop except Safari): native zoom
            el.style.zoom = scale;
            el.style.transform = '';
            el.style.transformOrigin = '';
            el.style.marginBottom = '';
            return;
        }
        // Safari/iOS path: transform: scale + vertical compensation
        el.style.zoom = '';
        el.style.transformOrigin = '50% 0';
        el.style.transform = `scale(${scale})`;
        // Vertical compensation: reserve more space if growing, reclaim space if shrinking.
        // The naturalHeight (offsetHeight) is the un-scaled box; the visible height is
        // naturalHeight * scale. We adjust margin-bottom by the delta so the layout
        // matches the visual rendering on Safari/iOS where 'transform: scale' doesn't
        // affect layout box dimensions.
        requestAnimationFrame(() => {
            const naturalHeight = el.offsetHeight;
            // (scale - 1) is positive when growing, negative when shrinking
            el.style.marginBottom = (naturalHeight * (scale - 1)) + 'px';
        });
    }

    function onAutoResetChange() {
        const input = document.getElementById('autoResetInput');
        if (!input) return;
        let val = parseInt(input.value);
        if (isNaN(val) || val < 0) val = 0;
        if (val > 3600) val = 3600;
        input.value = val;
        autoResetDelay = val;
        save();
    }

    function onExtraDelayChange() {
        const input = document.getElementById('extraDelayInput');
        if (!input) return;
        let val = parseInt(input.value);
        if (isNaN(val) || val < 1) val = 1;
        if (val > 3600) val = 3600;
        input.value = val;
        extraDelay = val;
        // Update the label of the "+Xs" button on all active timers
        document.querySelectorAll('.btn-plus').forEach(btn => {
            btn.textContent = extraLabel();
        });
        save();
    }

    // Generates the label of the "+Xs" button based on the extraDelay value
    function extraLabel() {
        const m = Math.floor(extraDelay / 60);
        const sec = extraDelay % 60;
        return `+ ${m}:${sec.toString().padStart(2,'0')}`;
    }

    function stopTimer(id) {
        stopTick(id); clearInterval(soundIntervals[id]); cancelAutoReset(id);
        const obj = timersList.find(d => d.id.toString() === id.toString());
        obj.start = null; obj.extraSecs = 0;
        obj.muted = false;
        obj.pausedAt = null;
        const card = document.getElementById(`card-${id}`);
        card.classList.remove('active', 'finished', 'paused', 'is-running');
        // Immediate bar reset, without animation (otherwise we'd see the bar "flow" to 0)
        const fill = document.getElementById(`progress-${id}`);
        if (fill) {
            fill.style.transition = 'none';
            fill.style.width = '0%';
            // Force reflow then restore the default transition for future uses
            // eslint-disable-next-line no-unused-expressions
            fill.offsetWidth;
            fill.style.transition = '';
        }
        document.getElementById(`time-${id}`).textContent = formatTime(obj.totalSecs);
        document.getElementById(`endtime-${id}`).textContent = "";
        updateTimerTitle(id);
        // Stop any running wind-up animation and clear the Visual Timer red disc
        // (since obj.start is now null, updateVisualTimerDisc will draw an empty disc).
        visualTimerAnimating.delete(id.toString());
        updateVisualTimerDisc(id);
        document.getElementById(`actions-${id}`).innerHTML = startActionsHTML(id);
        save();
        // Stopping a timer can change the chain state for the following timer.
        refreshChainLabels();
        updatePauseAllButton();
    }

    // Returns true if a timer is "active" in the sense that it has been started and is
    // still in its run cycle (running, paused, or finished-but-not-yet-reset). Used to
    // decide whether the NEXT timer should show the "auto start" label.
    function isTimerActive(obj) {
        if (!obj) return false;
        if (obj.start !== null) return true;
        return false;
    }

    // Builds the HTML for the action area of a NOT-started timer. Normally just the START
    // button, but when chaining is on AND the previous timer (in display order) is active,
    // it shows a "Démarrage (auto.)" hint instead — that timer will auto-start when the
    // previous one finishes.
    function startActionsHTML(id) {
        const t = i18n[currentLang];
        const idx = timersList.findIndex(d => d.id.toString() === id.toString());
        const obj = timersList[idx];
        // PRIORITY 1: scheduled start. If autoStartTimers is on AND this timer has a
        // scheduledTimeOfDay, the start button shows "Démarrage programmé à HH:MM:SS"
        // — overriding the chain "auto start" hint. The label is the wall-clock time
        // (daily-recurring), not a one-shot timestamp.
        let scheduledLabel = null;
        if (autoStartTimers && obj && obj.scheduledTimeOfDay) {
            const prefix = t.scheduledStartLabel || 'Démarrage à';
            scheduledLabel = `${prefix} ${formatTimeOfDay(obj.scheduledTimeOfDay)}`;
        }
        // PRIORITY 2 (cascade): this not-started timer shows "auto start" if, walking
        // backwards over a continuous run of not-started timers, we reach an active timer.
        let pending = false;
        if (!scheduledLabel && chainTimers && idx > 0) {
            for (let j = idx - 1; j >= 0; j--) {
                if (isTimerActive(timersList[j])) { pending = true; break; }
            }
        }
        let mainBtn;
        if (scheduledLabel) {
            // The scheduled button shows "Démarrage à HH:MM:SS"; on hover it reveals the
            // normal green "DÉMARRER" affordance (via the .btn-start-scheduled CSS, using
            // the label carried in data-hover-label) — so hovering feels like a normal start.
            mainBtn = `<button class="btn-start btn-start-scheduled" onclick="startTimer('${id}')" data-hover-label="${t.start}"><span class="sched-label">${scheduledLabel}</span></button>`;
        } else if (pending) {
            mainBtn = `<button class="btn-start btn-start-auto" onclick="startTimer('${id}')">${t.autoStart || 'Démarrage (auto.)'}</button>`;
        } else {
            mainBtn = `<button class="btn-start" onclick="startTimer('${id}')">${t.start}</button>`;
        }
        // The A↻ button (auto-start scheduling) appears to the RIGHT of the start button
        // when the autoStartTimers option is ON. It opens the schedule modal and follows
        // the same hover/visibility rules as the other timer-action buttons.
        let schedBtn = '';
        if (autoStartTimers) {
            const sched = obj && obj.scheduledTimeOfDay;
            schedBtn = `<button class="btn-action btn-schedule${sched ? ' has-schedule' : ''}" onclick="openScheduleModal('${id}')" title="${t.scheduleTitle || 'Programmer un démarrage automatique'}" aria-label="${t.scheduleTitle || 'Programmer'}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="13" r="7.5"/><polyline points="11 9 11 13 14 14.5"/><text x="20" y="8" font-size="11" font-weight="800" text-anchor="middle" stroke="none" fill="currentColor">A</text></svg></button>`;
        }
        // Reserve the vertical space of the MUTE line (which exists once the timer runs) so
        // the card height doesn't jump when the timer is started. The spacer is an invisible
        // button of the same size as a real action button, on its own line (via the break).
        const muteSpacer = `<span class="btn-mute-break"></span><button class="btn-action btn-mute-spacer" tabindex="-1" aria-hidden="true">🔊 ${t.soundOn}</button>`;
        return mainBtn + schedBtn + muteSpacer;
    }

    // Refresh the START button / "auto start" hint on every not-started timer. Called
    // whenever the chain state could change (a timer starts, stops, finishes, the chain
    // option toggles, or the list is reordered).
    function refreshChainLabels() {
        timersList.forEach(obj => {
            if (obj.start !== null) return; // only not-started timers have a START area
            const actions = document.getElementById(`actions-${obj.id}`);
            if (actions) actions.innerHTML = startActionsHTML(obj.id);
        });
    }

    function updateActiveUI(id) {
        const t = i18n[currentLang]; const obj = timersList.find(d => d.id.toString() === id.toString());
        const card = document.getElementById(`card-${id}`);
        card.classList.add('active');
        // Mark the card with the paused state so CSS can adapt (e.g. progress-bar shimmer
        // is muted on paused timers — they shouldn't look "alive").
        card.classList.toggle('paused', obj.pausedAt !== null);
        // .is-running drives the progress-bar wave: present ONLY while actively counting
        // down (started, not paused, not finished). Removed otherwise so the wave vanishes.
        const running = obj.start !== null && obj.pausedAt === null && !card.classList.contains('finished');
        card.classList.toggle('is-running', running);
        // Action button: PAUSE when running, RESUME when paused.
        const mainBtn = (obj.pausedAt !== null)
            ? `<button class="btn-action btn-resume" onclick="resumeTimer('${id}')">▶ ${t.resume}</button>`
            : `<button class="btn-action btn-pause" onclick="pauseTimer('${id}')">⏸ ${t.pause}</button>`;
        document.getElementById(`actions-${id}`).innerHTML = `
            ${mainBtn}
            <button class="btn-action btn-plus" onclick="addExtraTime('${id}')">${extraLabel()}</button>
            <button class="btn-action btn-stop" onclick="stopTimer('${id}')">↺ ${t.stop}</button>
            <span class="btn-mute-break"></span>
            <button id="btn-mute-${id}" class="btn-action btn-mute" onclick="toggleMute('${id}')">${muteLabel(obj.muted)}</button>`;
        updatePauseAllButton();
    }

    // Label for the mute button: shows the icon AND a word reflecting the state —
    // "ACTIVÉ" (sound on) or "MUET" (muted). Helps tell the two states apart at a glance.
    function muteLabel(muted) {
        const t = i18n[currentLang];
        return muted ? `🔇 ${t.mute}` : `🔊 ${t.soundOn}`;
    }

    function toggleMute(id) { 
        const obj = timersList.find(d => d.id.toString() === id.toString());
        obj.muted = !obj.muted; 
        document.getElementById(`btn-mute-${id}`).innerHTML = muteLabel(obj.muted);
        save();
    }

    function addExtraTime(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        const card = document.getElementById(`card-${id}`);
        const etaitFini = card.classList.contains('finished');
        // If the timer is finished, we also need to compensate for accumulated delay so that
        // +30s actually elapses from now. The compensation is added to
        // extraSecs: this way the title "(+X:XX)" reflects the total time actually added
        // beyond the original duration.
        if (etaitFini && obj.start) {
            const ecouleSec = (effectiveNow(obj) - obj.start) / 1000;
            const totalActuel = obj.totalSecs + obj.extraSecs;
            const retardSec = Math.max(0, Math.round(ecouleSec - totalActuel));
            obj.extraSecs += retardSec;
        }
        obj.extraSecs += extraDelay;
        updateEndTime(id); updateTimerTitle(id);
        if (etaitFini) {
            cancelAutoReset(id);
            card.classList.remove('finished');
            // Restore the bar to full width (auto-reset may have already shrunk it)
            const fill = document.getElementById(`progress-${id}`);
            if (fill) { fill.style.transition = ''; fill.style.width = '100%'; }
            clearInterval(soundIntervals[id]);
            // Don't tick a paused timer — wait until the user explicitly resumes.
            if (obj.pausedAt === null) startTick(id);
        }
        save();
    }

    async function deleteTimer(id) {
        const card = document.getElementById(`card-${id}`);
        const obj = timersList.find(d => d.id.toString() === id.toString());
        const isFinished = card.classList.contains('finished');
        const t = i18n[currentLang];
        // A running timer (started, not finished) can't be hidden — disable that option.
        // We consider a timer "running" if it has a start and isn't finished (paused counts
        // as running here: it's mid-countdown).
        const isRunning = obj && obj.start !== null && !isFinished;
        // For a finished timer the original behavior deleted immediately without asking.
        // We keep a confirmation only for non-finished timers, but always offer "Hide".
        const result = await confirmDialog(t.confirmDelete, {
            okLabel: t.deleteLabel || t.confirmDelete,
            thirdLabel: t.hideLabel || 'Masquer',
            thirdDisabled: isRunning,
            thirdDisabledTitle: t.hideDisabledRunning || ''
        });
        if (result === false) return;            // Cancel
        if (result === 'third') {                // Hide
            hideTimer(id);
            return;
        }
        // result === true → Delete
        stopTick(id); clearInterval(soundIntervals[id]); cancelAutoReset(id);
        card.remove();
        timersList = timersList.filter(d => d.id.toString() !== id.toString());
        save();
    }

    // Hide a timer: collapse its card into a small empty rectangle. If the timer is
    // finished or still running/auto-resetting, we reset it FIRST so it's never hidden in
    // a "red"/finished state — it's tucked away clean, ready to start when unhidden.
    // (A running timer can't reach here via the × dialog, which disables Hide while running,
    // but hideFinished and other paths may, so we handle it for safety.)
    function hideTimer(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const card = document.getElementById(`card-${id}`);
        const isFinished = card && card.classList.contains('finished');
        if (isFinished || obj.start !== null) {
            stopTimer(id); // back to initial state (clears finished, redraws empty bar)
        }
        obj.hidden = true;
        if (card) card.classList.add('hidden-timer');
        save();
    }

    // Unhide a timer: restore its full card display. If the timer was hidden while it was
    // finished or still auto-resetting (red bar running), bring it back to a clean "ready
    // to start" state rather than showing it mid-reset/red.
    function unhideTimer(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        obj.hidden = false;
        const card = document.getElementById(`card-${id}`);
        if (card) card.classList.remove('hidden-timer');
        // If it's finished or has been started (incl. auto-resetting), reset it to its
        // initial state so it reappears ready to start, not red.
        const isFinished = card && card.classList.contains('finished');
        if (isFinished || obj.start !== null) {
            stopTimer(id); // resets start/extra/muted/paused, clears finished, redraws bar
        }
        save();
    }

    // Custom confirmation modal (preserves full-screen, unlike window.confirm)
    // Options:
    //   alertMode: only show OK
    //   thirdLabel: if set, shows a third button; resolving with 'third' when clicked
    //   thirdDisabled: if true, the third button is shown but disabled
    //   okLabel / cancelLabel: override default button texts
    function confirmDialog(message, options = {}) {
        return new Promise((resolve) => {
            const overlay = document.getElementById('confirmModal');
            const msg = document.getElementById('confirmModalMessage');
            const btnOk = document.getElementById('confirmModalOk');
            const btnCancel = document.getElementById('confirmModalCancel');
            const btnThird = document.getElementById('confirmModalThird');
            const t = i18n[currentLang];
            const alertMode = options.alertMode === true;
            msg.textContent = message;
            btnOk.textContent = options.okLabel || t.save || 'OK';
            btnCancel.textContent = options.cancelLabel || t.cancel || 'Annuler';
            btnCancel.style.display = alertMode ? 'none' : '';
            // Third button (e.g. "Hide") — optional
            if (options.thirdLabel) {
                btnThird.textContent = options.thirdLabel;
                btnThird.style.display = '';
                btnThird.disabled = options.thirdDisabled === true;
                btnThird.title = options.thirdDisabledTitle && options.thirdDisabled ? options.thirdDisabledTitle : '';
            } else {
                btnThird.style.display = 'none';
            }
            overlay.classList.add('visible');

            const cleanup = (result) => {
                overlay.classList.remove('visible');
                btnCancel.style.display = '';
                btnThird.style.display = 'none';
                btnThird.disabled = false;
                btnOk.removeEventListener('click', onOk);
                btnCancel.removeEventListener('click', onCancel);
                btnThird.removeEventListener('click', onThird);
                document.removeEventListener('keydown', onKey);
                overlay.removeEventListener('click', onOverlayClick);
                resolve(result);
            };
            const onOk = () => cleanup(true);
            const onCancel = () => cleanup(false);
            const onThird = () => { if (!btnThird.disabled) cleanup('third'); };
            const onKey = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); cleanup(true); }
                else if (e.key === 'Escape') { e.preventDefault(); cleanup(alertMode ? true : false); }
            };
            const onOverlayClick = (e) => {
                // Click on the backdrop (not the box) = cancel (or OK in alert mode)
                if (e.target === overlay) cleanup(alertMode ? true : false);
            };
            btnOk.addEventListener('click', onOk);
            btnCancel.addEventListener('click', onCancel);
            btnThird.addEventListener('click', onThird);
            document.addEventListener('keydown', onKey);
            overlay.addEventListener('click', onOverlayClick);
            // En mode alerte, focus sur OK ; sinon sur Annuler (action moins destructive)
            setTimeout(() => (alertMode ? btnOk : btnCancel).focus(), 0);
        });
    }

    function duplicateTimer(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        // Guarantee a unique id even with rapid clicks
        let nouvelId = Date.now();
        while (timersList.some(d => d.id === nouvelId)) nouvelId++;
        // Copy ALL properties from the source timer
        const sourceLancee = obj.start !== null;
        const copie = {
            id: nouvelId,
            nom: obj.nom,
            totalSecs: obj.totalSecs,
            start: obj.start,           // same exact start time (millisecond-synced)
            extraSecs: obj.extraSecs,   // same extra time
            muted: obj.muted,           // same mute state
            pausedAt: obj.pausedAt,     // same pause state
            hidden: false,              // a duplicate is always visible
            scheduledTimeOfDay: obj.scheduledTimeOfDay  // duplicates inherit the scheduled time
        };
        // Insert right after the original in the data list
        const index = timersList.findIndex(d => d.id.toString() === id.toString());
        timersList.splice(index + 1, 0, copie);
        // Create the HTML card and insert it right after the original in the DOM
        createCardHTML(copie);
        const cardOriginale = document.getElementById(`card-${id}`);
        const cardCopie = document.getElementById(`card-${nouvelId}`);
        cardOriginale.after(cardCopie);
        // If the source timer was running, reflect the running state on the copy
        if (sourceLancee) {
            const ecoule = Date.now() - copie.start;
            const total = (copie.totalSecs + copie.extraSecs) * 1000;
            if (ecoule < total) {
                updateActiveUI(nouvelId);
                updateEndTime(nouvelId);
                updateTimerTitle(nouvelId);
                startTick(nouvelId);
            } else {
                // Timer already finished at duplication time → reproduce the "finished" state
                updateActiveUI(nouvelId);
                updateTimerTitle(nouvelId);
                document.getElementById(`time-${nouvelId}`).textContent = "0:00";
                document.getElementById(`progress-${nouvelId}`).style.width = "100%";
                markFinished(nouvelId);
            }
        }
        save();
    }

    function editTimer(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const titleEl = document.getElementById(`title-${id}`);
        if (!titleEl) return;
        // If already in edit mode, do nothing
        if (titleEl.querySelector('input')) return;
        // Close any other ongoing edit
        document.querySelectorAll('.duration-edit-form').forEach(el => {
            const otherId = el.id.replace('title-', '');
            if (otherId !== id.toString()) cancelTimerEdit(otherId);
        });
        const t = i18n[currentLang];
        const min = Math.floor(obj.totalSecs / 60);
        const sec = obj.totalSecs % 60;
        titleEl.classList.remove('label-duree-titre');
        titleEl.classList.add('duration-edit-form');
        titleEl.onclick = null;
        // "Cancel extra time" button only if extraSecs > 0
        const btnRemoveExtra = obj.extraSecs > 0
            ? `<button type="button" class="btn-remove-extra" id="edit-remove-extra-${id}" title="${t.removeExtraTitle}">↩ ${formatExtraTime(obj.extraSecs)}</button>`
            : '';
        titleEl.innerHTML = `
            <input type="number" id="edit-min-${id}" value="${min}" min="0" />
            <span>${t.labelMin}</span>
            <input type="number" id="edit-sec-${id}" value="${sec}" min="0" max="59" />
            <span>${t.labelSec}</span>
            <button type="button" id="edit-ok-${id}" title="${t.save}">✓</button>
            <button type="button" class="btn-cancel" id="edit-cancel-${id}" title="${t.cancel}">✕</button>
            ${btnRemoveExtra}
        `;
        const minInput = document.getElementById(`edit-min-${id}`);
        const secInput = document.getElementById(`edit-sec-${id}`);
        const btnOk = document.getElementById(`edit-ok-${id}`);
        const btnCancel = document.getElementById(`edit-cancel-${id}`);
        const btnRemove = document.getElementById(`edit-remove-extra-${id}`);

        // Attach handlers via addEventListener for better reliability
        // stopPropagation so any parent onclick doesn't fire
        btnOk.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            confirmTimerEdit(id);
        });
        btnCancel.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            cancelTimerEdit(id);
        });
        if (btnRemove) {
            btnRemove.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                cancelExtraTime(id);
            });
        }
        // Prevent clicks on the inputs from closing/reopening anything
        [minInput, secInput].forEach(el => {
            el.addEventListener('click', (e) => e.stopPropagation());
        });

        minInput.focus();
        minInput.select();
        // Prevent drag during edit
        const card = document.getElementById(`card-${id}`);
        if (card) card.draggable = false;
        // Validate with Enter, cancel with Escape
        const handler = (e) => {
            if (e.key === 'Enter') { e.preventDefault(); confirmTimerEdit(id); }
            else if (e.key === 'Escape') { e.preventDefault(); cancelTimerEdit(id); }
        };
        minInput.addEventListener('keydown', handler);
        secInput.addEventListener('keydown', handler);
    }

    function confirmTimerEdit(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const minInput = document.getElementById(`edit-min-${id}`);
        const secInput = document.getElementById(`edit-sec-${id}`);
        if (!minInput || !secInput) return;
        const nouveauTotal = (parseInt(minInput.value) || 0) * 60 + (parseInt(secInput.value) || 0);
        if (nouveauTotal <= 0) {
            // Invalid duration, cancel
            cancelTimerEdit(id);
            return;
        }
        // IMPORTANT: we do NOT touch obj.start if the timer is running.
        // We only modify the total duration; the tick will recalculate automatically.
        obj.totalSecs = nouveauTotal;

        // Restaurer le titre
        restoreTimerTitle(id);

        // If the timer was running and we have a new duration longer than elapsed time,
        // we may need to take it out of the "finished" state and restart the tick.
        const card = document.getElementById(`card-${id}`);
        if (obj.start) {
            const ecoule = effectiveNow(obj) - obj.start;
            const total = (obj.totalSecs + obj.extraSecs) * 1000;
            if (ecoule < total) {
                // Le timer doit (re)tourner
                if (card.classList.contains('finished')) {
                    card.classList.remove('finished');
                    clearInterval(soundIntervals[id]);
                }
                // Don't tick a paused timer — its display stays frozen until the user
                // explicitly resumes it.
                if (obj.pausedAt === null) startTick(id);
                updateEndTime(id);
            } else {
                // The new duration is exceeded → force the finished state if not already
                document.getElementById(`time-${id}`).textContent = "0:00";
                document.getElementById(`progress-${id}`).style.width = "100%";
                if (!card.classList.contains('finished')) {
                    markFinished(id);
                }
                stopTick(id);
            }
        } else {
            // Timer not started: just refresh the remaining-time display
            document.getElementById(`time-${id}`).textContent = formatTime(obj.totalSecs);
        }
        save();
    }

    function cancelTimerEdit(id) {
        restoreTimerTitle(id);
    }

    // Sets extraSecs back to 0 (timer shortened by the extra time added via +Xs).
    // If the result puts the timer behind, it transitions to finished like in confirmTimerEdit.
    function cancelExtraTime(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        obj.extraSecs = 0;
        // Close the edit form
        restoreTimerTitle(id);
        // If the timer is running, check if the new duration is exceeded
        const card = document.getElementById(`card-${id}`);
        if (obj.start && card) {
            const ecoule = effectiveNow(obj) - obj.start;
            const total = obj.totalSecs * 1000;
            if (ecoule >= total) {
                // Duration exceeded → mark finished if not already
                document.getElementById(`time-${id}`).textContent = "0:00";
                document.getElementById(`progress-${id}`).style.width = "100%";
                if (!card.classList.contains('finished')) {
                    markFinished(id);
                }
                stopTick(id);
            } else {
                // The timer continues with its original duration, update the end time
                updateEndTime(id);
            }
        }
        save();
    }

    function restoreTimerTitle(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const titleEl = document.getElementById(`title-${id}`);
        if (!titleEl) return;
        const t = i18n[currentLang];

        titleEl.classList.add('label-duree-titre');

        titleEl.onclick = () => editTimer(id);
        const card = document.getElementById(`card-${id}`);
        if (card) card.draggable = true;

        updateTimerTitle(id);
    }

    // Escape HTML characters to avoid injections via timer name
    function escapeHtml(str) {

            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function save() {

    function handleDragStart(e) {
        this.classList.add('dragging');
        dragSrcEl = this;
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnter(e) {
        // (nothing: we handle everything in dragover to have the cursor position)
    }

    function handleDragLeave(e) {
        // (nothing: we hide the indicator only on dragend or drop)
    }

    function handleDragOver(e) {
        if (e.preventDefault) e.preventDefault();
        if (this === dragSrcEl) return false;
        const rect = this.getBoundingClientRect();
        // Layout detection: if the direct neighbor is to the right (same row), we're in multi-column mode
        // → use X to decide insertion side. Otherwise (single-column), use Y.
        const list = document.getElementById('durationsList');
        const cards = Array.from(list.querySelectorAll('.duration-card'));
        const idx = cards.indexOf(this);
        const voisinDroite = cards[idx + 1];
        const voisinGauche = cards[idx - 1];
        // Compare vertical CENTERS, not tops: a hidden timer is a short box centered in its
        // grid cell, so its top differs from full-height neighbors even on the same row.
        // Centers stay aligned because the grid cell height is the same across the row.
        const centerY = rect.top + rect.height / 2;
        const sameRowAs = (other) => {
            if (!other) return false;
            const r = other.getBoundingClientRect();
            const otherCenterY = r.top + r.height / 2;
            // Same row if the vertical centers are close, OR the cards overlap vertically.
            return Math.abs(otherCenterY - centerY) < 40 || (r.top < rect.bottom && r.bottom > rect.top);
        };
        const memeRangee = sameRowAs(voisinDroite) || sameRowAs(voisinGauche);
        const insererAvant = memeRangee
            ? (e.clientX < rect.left + rect.width / 2)
            : (e.clientY < rect.top + rect.height / 2);
        positionDropIndicator(this, insererAvant, memeRangee);
        return false;
    }

    function positionDropIndicator(targetCard, insererAvant, vertical) {
        const indicator = document.getElementById('dropIndicator');
        if (!indicator) return;
        const list = document.getElementById('durationsList');
        const cards = Array.from(list.querySelectorAll('.duration-card'));
        const idx = cards.indexOf(targetCard);
        // Find the neighbor card on the insertion side (may be null at the edges)
        const voisin = insererAvant ? cards[idx - 1] : cards[idx + 1];
        const targetRect = targetCard.getBoundingClientRect();
        const voisinRect = voisin ? voisin.getBoundingClientRect() : null;

        if (vertical) {
            // Barre verticale dans le gap horizontal entre deux cartes voisines
            // If no neighbor (edge), place right next to the target card
            let centerX;
            if (voisinRect) {
                if (insererAvant) centerX = (voisinRect.right + targetRect.left) / 2;
                else centerX = (targetRect.right + voisinRect.left) / 2;
            } else {
                centerX = insererAvant ? targetRect.left - 8 : targetRect.right + 8;
            }
            indicator.style.left = (centerX - 3 + window.scrollX) + 'px';
            indicator.style.top = (targetRect.top + window.scrollY) + 'px';
            indicator.style.width = '6px';
            indicator.style.height = targetRect.height + 'px';
        } else {
            // Horizontal bar in the vertical gap between two cards (single-column or different rows)
            let centerY;
            if (voisinRect) {
                if (insererAvant) centerY = (voisinRect.bottom + targetRect.top) / 2;
                else centerY = (targetRect.bottom + voisinRect.top) / 2;
            } else {
                centerY = insererAvant ? targetRect.top - 8 : targetRect.bottom + 8;
            }
            indicator.style.left = (targetRect.left + window.scrollX) + 'px';
            indicator.style.top = (centerY - 3 + window.scrollY) + 'px';
            indicator.style.width = targetRect.width + 'px';
            indicator.style.height = '6px';
        }
        indicator.classList.add('visible');
        indicator.dataset.targetId = targetCard.id;
        indicator.dataset.before = insererAvant ? '1' : '0';
    }

    function hideDropIndicator() {
        const indicator = document.getElementById('dropIndicator');
        if (indicator) {
            indicator.classList.remove('visible');
            delete indicator.dataset.targetId;
            delete indicator.dataset.before;
        }
    }

    function handleDrop(e) {
        if (e.stopPropagation) e.stopPropagation();
        if (e.preventDefault) e.preventDefault();
        const indicator = document.getElementById('dropIndicator');
        const targetId = indicator?.dataset.targetId;
        const before = indicator?.dataset.before === '1';
        hideDropIndicator();
        if (!dragSrcEl || !targetId) return false;
        const target = document.getElementById(targetId);
        if (!target || target === dragSrcEl) return false;
        if (before) target.before(dragSrcEl);
        else target.after(dragSrcEl);
        reindexList();
        return false;
    }

    function handleDragEnd(e) {
        hideDropIndicator();
        const cards = document.querySelectorAll('.duration-card');
        cards.forEach(card => {
            card.classList.remove('over');
            card.classList.remove('dragging');
        });
    }

    function reindexList() {
        const nouvellesCartes = document.querySelectorAll('.duration-card');
        const nouvelleListe = [];
        nouvellesCartes.forEach(carte => {
            const id = carte.id.replace('card-', '');
            const timerObj = timersList.find(d => d.id.toString() === id.toString());
            if (timerObj) nouvelleListe.push(timerObj);
        });
        timersList = nouvelleListe;
        // After a DOM move, the CSS transition on .progress-bar-fill is interrupted.
        // For each finished card, we restore the visual state correctly:
        //  - Not in auto-reset: bar stays at 100% (full red).
        //  - In auto-reset: compute how far the animation has progressed and resume
        //    the transition from that point with the remaining time.
        document.querySelectorAll('.duration-card.finished').forEach(card => {
            const id = card.id.replace('card-', '');
            const fill = card.querySelector('.progress-bar-fill');
            if (!fill) return;
            if (card.classList.contains('auto-resetting') && autoResetStartedAt[id]) {
                // Compute remaining auto-reset time and current bar percentage
                const elapsed = (Date.now() - autoResetStartedAt[id]) / 1000;
                const remaining = Math.max(0, autoResetDelay - elapsed);
                const currentPct = Math.max(0, Math.min(100, 100 * remaining / autoResetDelay));
                // Restore the bar to its current visual position, then continue animating to 0%
                fill.style.transition = 'none';
                fill.style.width = currentPct + '%';
                // eslint-disable-next-line no-unused-expressions
                fill.offsetWidth;
                if (remaining > 0) {
                    fill.style.transition = `width ${remaining}s linear`;
                    fill.style.width = '0%';
                }
            } else {
                // Plain finished: restore to 100%
                fill.style.transition = 'none';
                fill.style.width = '100%';
                // eslint-disable-next-line no-unused-expressions
                fill.offsetWidth;
                fill.style.transition = '';
            }
        });
        save();
        // Reordering can change which timers follow an active one — refresh the hints.
        refreshChainLabels();
    }

    function attachDragEvents(el) {
        el.addEventListener('dragstart', handleDragStart, false);
        el.addEventListener('dragenter', handleDragEnter, false);
        el.addEventListener('dragover', handleDragOver, false);
        el.addEventListener('dragleave', handleDragLeave, false);
        el.addEventListener('drop', handleDrop, false);
        el.addEventListener('dragend', handleDragEnd, false);
        // Touch support (iOS/Android): HTML5 drag events don't work on Safari iOS,
        // so we simulate via touchstart/move/end with a long-press to activate.
        el.addEventListener('touchstart', handleTouchStart, { passive: true });
    }

    // Make the drop forgiving: also listen on the whole list container, not just on cards.
    // When the pointer is over a gap (or the empty area of the grid), we find the nearest
    // card and position the indicator relative to it. This avoids the "have to insist"
    // problem where releasing between cards did nothing because no card got the dragover.
    function findNearestCard(x, y) {
        const cards = Array.from(document.querySelectorAll('.duration-card')).filter(c => c !== dragSrcEl);
        let best = null, bestDist = Infinity;
        for (const c of cards) {
            const r = c.getBoundingClientRect();
            // Distance from the pointer to the card's center (clamped to the card box so
            // a pointer inside a card has distance ~0).
            const cx = Math.max(r.left, Math.min(x, r.right));
            const cy = Math.max(r.top, Math.min(y, r.bottom));
            const dist = (x - cx) ** 2 + (y - cy) ** 2;
            if (dist < bestDist) { bestDist = dist; best = c; }
        }
        return best;
    }

    function containerDragOver(e) {
        if (!dragSrcEl) return;
        if (e.preventDefault) e.preventDefault();
        // If the event already bubbled from a specific card, handleDragOver dealt with it.
        // Here we only act when the pointer isn't directly over a card (the gaps).
        if (e.target.closest && e.target.closest('.duration-card')) return;
        const target = findNearestCard(e.clientX, e.clientY);
        if (!target) return;
        const rect = target.getBoundingClientRect();
        const list = document.getElementById('durationsList');
        const cards = Array.from(list.querySelectorAll('.duration-card'));
        const idx = cards.indexOf(target);
        const centerY = rect.top + rect.height / 2;
        const sameRowAs = (other) => {
            if (!other) return false;
            const r = other.getBoundingClientRect();
            const oc = r.top + r.height / 2;
            return Math.abs(oc - centerY) < 40 || (r.top < rect.bottom && r.bottom > rect.top);
        };
        const memeRangee = sameRowAs(cards[idx + 1]) || sameRowAs(cards[idx - 1]);
        const insererAvant = memeRangee
            ? (e.clientX < rect.left + rect.width / 2)
            : (e.clientY < rect.top + rect.height / 2);
        positionDropIndicator(target, insererAvant, memeRangee);
    }

    // --- DRAG TACTILE (iPad/Android) ---
    let touchDragState = null;

    function handleTouchStart(e) {
        // Ignore if already dragging, or if touching a button/input/link inside the card
        // (we don't want to start a drag when the user taps START, +30s, the pencil, etc.)
        const target = e.target;
        if (target.closest('button, input, select, textarea, a, .btn-edit-start, .duration-edit-form, .name-edit-form, .end-time-display.start-edit-form')) return;
        if (touchDragState) return;
        const card = e.currentTarget;
        const touch = e.touches[0];
        touchDragState = {
            card,
            startX: touch.clientX,
            startY: touch.clientY,
            longPressTimer: null,
            active: false,
            cancelled: false
        };
        // Start a 400ms long-press; if the user moves before that, it's a scroll so we cancel.
        touchDragState.longPressTimer = setTimeout(() => activateTouchDrag(), 400);
        document.addEventListener('touchmove', handleTouchMove, { passive: false });
        document.addEventListener('touchend', handleTouchEnd, { passive: true });
        document.addEventListener('touchcancel', handleTouchEnd, { passive: true });
    }

    function activateTouchDrag() {
        if (!touchDragState || touchDragState.cancelled) return;
        touchDragState.active = true;
        const card = touchDragState.card;
        card.classList.add('dragging');
        dragSrcEl = card;
        // Light vibration to indicate the drag is armed (if supported)
        if (navigator.vibrate) navigator.vibrate(30);
    }

    function handleTouchMove(e) {
        if (!touchDragState) return;
        const touch = e.touches[0];
        const dx = touch.clientX - touchDragState.startX;
        const dy = touch.clientY - touchDragState.startY;

        if (!touchDragState.active) {
            // Not yet in drag mode: if the user moves significantly, it's a scroll.
            // Cancel the long-press to let the natural scroll happen.
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                clearTimeout(touchDragState.longPressTimer);
                touchDragState.cancelled = true;
            }
            return;
        }
        // Active drag mode: prevent page scroll while moving
        e.preventDefault();
        // Find the card under the finger
        const targetCard = findCardUnder(touch.clientX, touch.clientY);
        if (!targetCard || targetCard === touchDragState.card) {
            hideDropIndicator();
            return;
        }
        // Reuses the same logic as handleDragOver to position the indicator
        const rect = targetCard.getBoundingClientRect();
        const list = document.getElementById('durationsList');
        const cards = Array.from(list.querySelectorAll('.duration-card'));
        const idx = cards.indexOf(targetCard);
        const voisinDroite = cards[idx + 1];
        const voisinGauche = cards[idx - 1];
        const memeRangee = (
            (voisinDroite && Math.abs(voisinDroite.getBoundingClientRect().top - rect.top) < 10) ||
            (voisinGauche && Math.abs(voisinGauche.getBoundingClientRect().top - rect.top) < 10)
        );
        const insererAvant = memeRangee
            ? (touch.clientX < rect.left + rect.width / 2)
            : (touch.clientY < rect.top + rect.height / 2);
        positionDropIndicator(targetCard, insererAvant, memeRangee);

        document.removeEventListener('touchcancel', handleTouchEnd);

            const indicator = document.getElementById('dropIndicator');
            const targetId = indicator?.dataset.targetId;
            const before = indicator?.dataset.before === '1';
            const card = touchDragState.card;
            card.classList.remove('dragging');
            hideDropIndicator();
            if (targetId && dragSrcEl) {
                const target = document.getElementById(targetId);
                if (target && target !== dragSrcEl) {
                    if (before) target.before(dragSrcEl);
                    else target.after(dragSrcEl);
                    reindexList();
                }
            }
            dragSrcEl = null;
        }
        touchDragState = null;
    }

    // elements overlap. We look for the first .duration-card in the stack.
    function findCardUnder(x, y) {
        const els = document.elementsFromPoint(x, y);
        for (const el of els) {
            const card = el.closest('.duration-card');
            if (card) return card;
        }
        return null;
    }
