    // Edit the start time of a running timer via an in-place mini-form
    // (consistent with editing the duration and the name).
    function editStartTime(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj || !obj.start) return;
        const display = document.getElementById(`endtime-${id}`);
        if (!display) return;
        // If already editing, do nothing
        if (display.querySelector('input[type="time"]')) return;
        const t = i18n[currentLang];
        const startDate = new Date(obj.start);
        const hh = startDate.getHours().toString().padStart(2, '0');
        const mm = startDate.getMinutes().toString().padStart(2, '0');
        const ss = startDate.getSeconds().toString().padStart(2, '0');
        // Save the parent onclick and remove it during edit so it doesn't
        // trigger the showStartTime toggle on clicks within the form.
        const oldOnclick = display.onclick;
        display.onclick = null;
        display.classList.add('start-edit-form');
        display.innerHTML = `
            <input type="time" id="edit-start-${id}" value="${hh}:${mm}:${ss}" step="1" />
            <button type="button" id="edit-start-ok-${id}" title="${t.save}">✓</button>
            <button type="button" class="btn-cancel" id="edit-start-cancel-${id}" title="${t.cancel}">✕</button>
        `;
        const input = document.getElementById(`edit-start-${id}`);
        const btnOk = document.getElementById(`edit-start-ok-${id}`);
        const btnCancel = document.getElementById(`edit-start-cancel-${id}`);

        // Compute the allowed window for the new start time:
        //   - earliest: effectiveNow - totalSecs (timer that just finished — no time remaining)
        //   - latest:   effectiveNow (timer that just starts now)
        // We use effectiveNow() instead of Date.now() so the bounds also work for paused
        // timers: a paused timer's "current moment" is its pausedAt, so the editable range
        // is anchored there. Otherwise the user couldn't represent the actual current state
        // of a long-paused timer (its real start might be hours before Date.now() - duration).
        const computeBounds = () => {
            const now = effectiveNow(obj);
            return {
                min: now - (obj.totalSecs + obj.extraSecs) * 1000,
                max: now
            };
        };
        // Parse the input value to a Date object based on the day of obj.start.
        // Returns null if the format is invalid.
        const parseInputToDate = (val) => {
            const match = val.match(/^(\d{2}):(\d{2})(?::(\d{2}))?$/);
            if (!match) return null;
            const h = parseInt(match[1]);
            const m = parseInt(match[2]);
            const s = match[3] ? parseInt(match[3]) : 0;
            const d = new Date(obj.start);
            d.setHours(h, m, s, 0);
            return d;
        };
        // Update the OK button state based on whether the input is in the allowed window.
        const updateValidationState = () => {
            const val = input.value;
            // Empty value: leave button enabled (validation will be a no-op)
            if (!val) {
                btnOk.disabled = false;
                btnOk.textContent = '✓';
                btnOk.title = t.save;
                return;
            }
            const candidate = parseInputToDate(val);
            if (!candidate) {
                btnOk.disabled = true;
                btnOk.textContent = '🚫';
                btnOk.title = t.invalidTimeFormat || 'Format invalide';
                return;
            }
            const { min, max } = computeBounds();
            const t_ms = candidate.getTime();
            if (t_ms < min) {
                btnOk.disabled = true;
                btnOk.textContent = '🚫';
                btnOk.title = t.startTimeTooEarly || 'Trop loin dans le passé';
                return;
            }
            if (t_ms > max) {
                btnOk.disabled = true;
                btnOk.textContent = '🚫';
                btnOk.title = t.startTimeTooLate || 'Trop loin dans le futur';
                return;
            }
            btnOk.disabled = false;
            btnOk.textContent = '✓';
            btnOk.title = t.save;
        };
        // Initial validation (in case obj.start is itself out of bounds, which shouldn't
        // happen but is harmless — and to set the default state cleanly)
        updateValidationState();
        input.addEventListener('input', updateValidationState);

        const restore = () => {
            display.classList.remove('start-edit-form');
            display.onclick = oldOnclick;
            updateEndTime(id);
        };
        const valider = () => {
            // Don't validate if the OK button is disabled (out-of-range or invalid format).
            if (btnOk.disabled) return;
            const val = input.value;
            // If the user validates without modifying, we don't touch obj.start
            // (otherwise we'd overwrite milliseconds to 0 needlessly).
            if (val === `${hh}:${mm}:${ss}` || val === `${hh}:${mm}`) {
                restore();
                return;
            }
            const newStart = parseInputToDate(val);
            if (newStart) {
                obj.start = newStart.getTime();
                save();
                // Re-evaluate the timer's state: the new start may put it in or out of
                // the finished state.
                const card = document.getElementById(`card-${id}`);
                const total = (obj.totalSecs + obj.extraSecs) * 1000;
                const elapsed = effectiveNow(obj) - obj.start;
                if (elapsed >= total) {
                    // Should be finished — mark it (markFinished is idempotent).
                    if (card && !card.classList.contains('finished')) {
                        markFinished(id);
                    }
                } else {
                    // Should be active — un-finish if needed and ensure the tick is running.
                    if (card && card.classList.contains('finished')) {
                        card.classList.remove('finished');
                        card.classList.add('active');
                        cancelAutoReset(id);
                        // Restore the progress bar (auto-reset may have shrunk it)
                        const fill = document.getElementById(`progress-${id}`);
                        if (fill) {
                            fill.style.transition = 'none';
                            fill.style.width = '0%';
                            // eslint-disable-next-line no-unused-expressions
                            fill.offsetWidth;
                            fill.style.transition = '';
                        }
                    }
                    // Don't tick a paused timer — its display stays frozen until the user
                    // explicitly resumes it.
                    if (obj.pausedAt === null) startTick(id);
                }
                refreshTimerDisplay(id);
            }
            restore();
        };
        const annuler = () => restore();

        btnOk.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); valider(); });
        btnCancel.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); annuler(); });
        input.addEventListener('click', (e) => e.stopPropagation());
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); valider(); }
            else if (e.key === 'Escape') { e.preventDefault(); annuler(); }
        });
        // Try to directly open the native picker for a clearer UX than focus().
        // showPicker() is supported on Chrome/Edge 99+, Safari 16+, Firefox 101+.
        setTimeout(() => {
            try {
                if (typeof input.showPicker === 'function') input.showPicker();
                else input.focus();
            } catch (e) {
                input.focus();
            }
        }, 0);
    }

    function toggleGlobalSound() { globalSoundEnabled = !globalSoundEnabled; updateGlobalSoundUI(); save(); }
    function updateGlobalSoundUI() {
        const btn = document.getElementById('globalSoundBtn');
        btn.classList.toggle('is-off', !globalSoundEnabled);
        document.getElementById('globalSoundIcon').textContent = globalSoundEnabled ? '🔊' : '🔇';
        document.getElementById('globalSoundText').textContent = globalSoundEnabled ? i18n[currentLang].on : i18n[currentLang].off;
    }

    function toggleHideSeconds() { 
        hideSeconds = !hideSeconds; 
        refreshAllDisplays();
        save(); 
    }

    function refreshTimerDisplay(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const timeDisplay = document.getElementById(`time-${id}`);
        if (!timeDisplay) return;
        if (obj.start) {
            const ecoule = effectiveNow(obj) - obj.start;
            const total = (obj.totalSecs + obj.extraSecs) * 1000;
            const restant = total - ecoule;
            if (restant > 0) {
                timeDisplay.textContent = formatTime(Math.ceil(restant/1000));
            }
        } else {
            timeDisplay.textContent = formatTime(obj.totalSecs);
        }
        updateTimerTitle(id);
        if (showVisualTimer) updateVisualTimerDisc(id);
    }

    // Helper: refresh display of all timers (used by SEC toggle and threshold change)
    function refreshAllDisplays() {
        timersList.forEach(d => refreshTimerDisplay(d.id));
    }

    function onThresholdChange() {
        const input = document.getElementById('thresholdInput');
        if (!input) return;
        let val = parseInt(input.value);
        if (isNaN(val) || val < 0) val = 0;
        if (val > 60) val = 60;
        input.value = val;
        secondsThreshold = val * 60;
        refreshAllDisplays();
        save();
    }

    function openAddModal() {
        const modal = document.getElementById('addTimerModal');
        if (!modal) return;
        // Reset fields
        document.getElementById('nameInput').value = '';
        document.getElementById('durationH').value = '0';
        document.getElementById('durationM').value = '5';
        document.getElementById('durationS').value = '0';
        // Clear any error state from a previous opening
        ['durationH','durationM','durationS'].forEach(id => {
            document.getElementById(id).classList.remove('required-empty');
        });
        modal.classList.add('visible');
        // Focus on the name
        setTimeout(() => document.getElementById('nameInput').focus(), 50);
        // Escape to close
        const onKey = (e) => {
            if (e.key === 'Escape') { e.preventDefault(); closeAddModal(); document.removeEventListener('keydown', onKey); }
            else if (e.key === 'Enter' && ['nameInput','durationH','durationM','durationS'].includes(e.target.id)) {
                e.preventDefault(); addTimer();
            }
        };
        document.addEventListener('keydown', onKey);
        modal._onKey = onKey;
    }

    // Clears the "required field" error state on the duration fields as soon as the user
    // starts typing again. The red validation only appears on add attempt.
    function clearAddModalError() {
        ['durationH','durationM','durationS'].forEach(id => {
            document.getElementById(id).classList.remove('required-empty');
        });
    }

    function closeAddModal() {
        const modal = document.getElementById('addTimerModal');
        if (!modal) return;
        modal.classList.remove('visible');
        if (modal._onKey) { document.removeEventListener('keydown', modal._onKey); modal._onKey = null; }
    }

    function addTimer() {
        const nomInput = document.getElementById('nameInput').value.trim();
        const nom = nomInput || '';
        const h = parseInt(document.getElementById('durationH').value) || 0;
        const m = parseInt(document.getElementById('durationM').value) || 0;
        const s = parseInt(document.getElementById('durationS').value) || 0;
        const totalSecs = h*3600 + m*60 + s;
        if (totalSecs <= 0) {
            // Mark all duration fields red and focus the minutes (most common entry point)
            ['durationH','durationM','durationS'].forEach(id => {
                document.getElementById(id).classList.add('required-empty');
            });
            document.getElementById('durationM').focus();
            return;
        }
        const id = Date.now();
        const nouvelle = { id, nom, totalSecs, start: null, extraSecs: 0, muted: false, pausedAt: null, hidden: false, scheduledTimeOfDay: null };
        timersList.push(nouvelle);
        createCardHTML(nouvelle);
        save();
        closeAddModal();
    }

    function createCardHTML(obj) {
        const t = i18n[currentLang];
        const card = document.createElement('div');
        card.className = 'duration-card'; card.id = `card-${obj.id}`; card.draggable = true;
        if (showVisualTimer) card.classList.add('with-visual-timer');
        if (hideTimeWithVisualTimer) card.classList.add('hide-time-with-visual');
        if (obj.hidden) card.classList.add('hidden-timer');
        // The name field is ALWAYS present (even empty) so it can be clicked/renamed.
        // Si vide on affiche un placeholder visuel via CSS (data-empty="1").
        const nomTexte = obj.nom || t.untiteld || 'Sans titre';
        const nomDataEmpty = obj.nom ? '' : 'data-empty="1"';
        // Visual Timer SVG: a 60-minute analog dial with a red sector showing remaining time.
        // The sector is updated by updateVisualTimerDisc() each tick.
        // viewBox 0 0 200 200, center at (100,100), radius 80 for the dial.
        // The red sector is drawn as a <path> with d updated dynamically.
        // Wrapped in a container so we can attach a resize handle without affecting the SVG itself.
        const visualTimerSvg = `
            <div class="visual-timer-wrapper" id="visual-timer-wrapper-${obj.id}">
                <svg class="visual-timer" id="visual-timer-${obj.id}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" onclick="toggleHideTimeWithVisualTimer()" title="${t.toggleHideTimeTitle || 'Cliquer pour afficher/masquer le temps restant'}">
                    <circle cx="100" cy="100" r="92" fill="white" stroke="#222" stroke-width="3"/>
                    <g class="tt-ticks">${buildVisualTimerTicks()}</g>
                    <g class="tt-numbers">${buildVisualTimerNumbers()}</g>
                    <path class="tt-sector" id="visual-timer-sector-${obj.id}" d="" fill="#d8262a"/>
                    <path class="tt-sector-overflow" id="visual-timer-overflow-${obj.id}" d="" fill="#5c1010"/>
                    <circle cx="100" cy="100" r="6" fill="#222"/>
                </svg>
                <div class="visual-timer-resize-handle" onmousedown="event.stopPropagation(); startVisualTimerResize(event)" ontouchstart="event.stopPropagation(); startVisualTimerResize(event)" title="${t.visualTimerResizeTitle || 'Glisser pour redimensionner'}"></div>
            </div>`;
        card.innerHTML = `<div class="hidden-timer-overlay" onclick="unhideTimer('${obj.id}')" title="${t.unhideTitle || 'Cliquer pour réafficher ce timer'}"></div>
            <div class="drag-handle"><div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div></div>
            <button class="btn-duplicate" onclick="duplicateTimer('${obj.id}')" title="${t.duplicate}">⎘</button>
            <button class="btn-close" onclick="deleteTimer('${obj.id}')">×</button>
            <div class="label-duree-titre" id="title-${obj.id}" onclick="editTimer('${obj.id}')" title="${t.editDurationTitle}">${t.duration} — ${formatTime(obj.totalSecs)}</div>
            <div class="label-nom" id="nom-${obj.id}" ${nomDataEmpty} onclick="editName('${obj.id}')" title="${t.editNameTitle || 'Cliquer pour renommer'}">${escapeHtml(nomTexte)}</div>
            ${visualTimerSvg}
            <div class="time-left" id="time-${obj.id}" onclick="toggleHideSeconds()" title="${t.toggleSecondsTitle}">${formatTime(obj.totalSecs)}</div>
            <div class="end-time-display" id="endtime-${obj.id}" onclick="toggleStartTime()"></div>
            <div class="card-actions" id="actions-${obj.id}"><button class="btn-start" onclick="startTimer('${obj.id}')">${t.start}</button></div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="progress-${obj.id}"></div></div>`;
        document.getElementById('durationsList').appendChild(card);
        // If chaining is active and the previous timer is running, show the auto-start hint.
        const actionsEl = card.querySelector(`#actions-${obj.id}`);
        if (actionsEl && obj.start === null) actionsEl.innerHTML = startActionsHTML(obj.id);
        attachDragEvents(card);
        updateVisualTimerDisc(obj.id);
    }

    // Build the 60 minute tick marks around the Visual Timer dial.
    // Major ticks every 5 minutes, minor ticks every minute.
    function buildVisualTimerTicks() {
        let s = '';
        for (let i = 0; i < 60; i++) {
            const angle = i * 6; // 360 / 60
            const isMajor = i % 5 === 0;
            const len = isMajor ? 8 : 4;
            const width = isMajor ? 2 : 1;
            // Tick from radius 84 (just inside circle r=92) inward by `len`
            const r1 = 84;
            const r2 = 84 - len;
            const rad = (angle - 90) * Math.PI / 180;
            const x1 = 100 + r1 * Math.cos(rad);
            const y1 = 100 + r1 * Math.sin(rad);
            const x2 = 100 + r2 * Math.cos(rad);
            const y2 = 100 + r2 * Math.sin(rad);
            s += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="#222" stroke-width="${width}"/>`;
        }
        return s;
    }

    // Build the minute numbers (5, 10, 15, ..., 55) around the dial.
    function buildVisualTimerNumbers() {
        let s = '';
        for (let i = 5; i < 60; i += 5) {
            const angle = i * 6;
            const r = 68;
            const rad = (angle - 90) * Math.PI / 180;
            const x = 100 + r * Math.cos(rad);
            const y = 100 + r * Math.sin(rad);
            s += `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#222">${i}</text>`;
        }
        return s;
    }

    // Track timers currently in their "wind-up" animation. While animating, the regular
    // updateVisualTimerDisc() calls (from globalTick) are skipped to avoid overwriting the
    // in-progress animation path.
    let visualTimerAnimating = new Set();

    // Update the red sector of a timer's Visual Timer disc based on remaining time.
    // Update the red sector(s) of a timer's Visual Timer disc based on remaining time.
    // Two sectors are stacked:
    //   - The base (red, #d8262a) represents the LAST hour of remaining time.
    //   - The overflow (dark red / "bordeaux", #5c1010) represents the second-to-last hour.
    // This way we can visually distinguish remaining times up to 120 minutes.
    //   < 60 min remaining: only red shows (size = remaining_min / 60 × 360°)
    //   60-120 min: red is full (60 min), dark-red shows on top (size = (remaining-60)/60 × 360°)
    //   > 120 min: both full (red full + dark-red full)
    function updateVisualTimerDisc(id) {
        if (visualTimerAnimating.has(id.toString())) return;
        const sector = document.getElementById(`visual-timer-sector-${id}`);
        const overflow = document.getElementById(`visual-timer-overflow-${id}`);
        if (!sector) return;
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        // If the timer hasn't been started yet, show an empty disc (no red sector).
        if (obj.start === null) {
            sector.setAttribute('d', '');
            if (overflow) overflow.setAttribute('d', '');
            return;
        }
        const elapsedS = (effectiveNow(obj) - obj.start) / 1000;
        const remainingSecs = (obj.totalSecs + obj.extraSecs) - elapsedS;
        if (remainingSecs <= 0) {
            sector.setAttribute('d', '');
            if (overflow) overflow.setAttribute('d', '');
            return;
        }
        const remainingMin = remainingSecs / 60;
        // Base red: last hour. Full disc when remaining > 60 min.
        const redAngle = Math.min(remainingMin, 60) / 60 * 360;
        sector.setAttribute('d', buildSectorPath(100, 100, 80, redAngle));
        // Overflow dark-red: between 60 and 120 minutes. Empty if ≤ 60 min remaining.
        if (overflow) {
            const overflowMin = Math.max(0, Math.min(remainingMin - 60, 60));
            const overflowAngle = overflowMin / 60 * 360;
            overflow.setAttribute('d', buildSectorPath(100, 100, 80, overflowAngle));
        }
    }

    // Wind-up animation: sector grows from 0° to 360° (clockwise), then shrinks down to
    // the angle representing the actual remaining time. Used when a timer starts or when
    // the Visual Timer feature is enabled, to visually emphasize the disc.
    //   Phase 1: 0° → 360°  over ~600ms
    //   Phase 2: 360° → finalAngle  over ~400ms
    function animateVisualTimerWindUp(id) {
        const sector = document.getElementById(`visual-timer-sector-${id}`);
        const overflow = document.getElementById(`visual-timer-overflow-${id}`);
        if (!sector) return;
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        // No animation if the timer isn't running — disc stays empty.
        if (obj.start === null) {
            sector.setAttribute('d', '');
            if (overflow) overflow.setAttribute('d', '');
            return;
        }
        const remainingSecsAtStart = (obj.totalSecs + obj.extraSecs) - (effectiveNow(obj) - obj.start) / 1000;
        if (remainingSecsAtStart <= 0) return;
        const idStr = id.toString();
        visualTimerAnimating.add(idStr);

        // The wind-up animation uses a "global angle" going from 0 to 720°:
        //   0-360°: red sector grows from empty to (almost) full
        //   360-720°: red is full, dark-red ("overflow") sector grows from empty to full
        // Phase 1 winds up to a max angle that depends on remaining time:
        //   - remaining <= 60 min: wind up to 359.5° (shows just red ramp)
        //   - remaining > 60 min: wind up to 719.5° (red ramp then dark-red ramp on top)
        // PHASE1_MAX caps at near-360 to keep path topology consistent (avoids flash).
        const remainingMin = remainingSecsAtStart / 60;
        // PHASE1_TOP caps just below 359.9° (the threshold above which buildSectorPath
        // switches to the full-circle path). For >60 min we wind up the overflow disc on
        // top of a full red, so the cap is 360 + 359.89 = 719.89°.
        const PHASE1_TOP = remainingMin > 60 ? 719.89 : 359.89;

        // Apply the current "global angle" to the two sectors.
        const applyGlobalAngle = (a) => {
            if (a <= 360) {
                // Only red is partially filled
                sector.setAttribute('d', buildSectorPath(100, 100, 80, a));
                if (overflow) overflow.setAttribute('d', '');
            } else {
                // Red is full (use 359.89° to stay just under the full-circle threshold,
                // matching what we draw during phase 1's red ramp), overflow grows on top.
                sector.setAttribute('d', buildSectorPath(100, 100, 80, 359.89));
                if (overflow) overflow.setAttribute('d', buildSectorPath(100, 100, 80, a - 360));
            }
        };

        // Helper: convert remaining-seconds to a "global angle" for phase 2 / live rendering.
        const targetGlobalAngle = () => {
            const el = (effectiveNow(obj) - obj.start) / 1000;
            const r = (obj.totalSecs + obj.extraSecs) - el;
            if (r <= 0) return 0;
            const min = r / 60;
            if (min <= 60) return min / 60 * 360;
            // 60-120 min: 360 + (min-60)/60 × 360
            return 360 + Math.min(min - 60, 60) / 60 * 360;
        };

        const PHASE1_MS = 600;
        const PHASE2_MS = 600;
        const startT = performance.now();

        const tick = (now) => {
            const elapsed = now - startT;
            let angle;
            if (elapsed < PHASE1_MS) {
                // Phase 1 (wind-up): ease-out from 0 to PHASE1_TOP.
                const p = elapsed / PHASE1_MS;
                const eased = 1 - Math.pow(1 - p, 3); // cubic ease-out
                angle = eased * PHASE1_TOP;
            } else if (elapsed < PHASE1_MS + PHASE2_MS) {
                // Phase 2 (return): ease-out from PHASE1_TOP to current target.
                const p = (elapsed - PHASE1_MS) / PHASE2_MS;
                const eased = 1 - Math.pow(1 - p, 3); // cubic ease-out
                const target = targetGlobalAngle();
                angle = PHASE1_TOP + eased * (target - PHASE1_TOP);
            } else {
                angle = targetGlobalAngle();
            }
            applyGlobalAngle(angle);
            if (elapsed < PHASE1_MS + PHASE2_MS) {
                requestAnimationFrame(tick);
            } else {
                visualTimerAnimating.delete(idStr);
                // Final sync to the current remaining time
                updateVisualTimerDisc(id);
            }
        };
        requestAnimationFrame(tick);
    }


    // --- Drag to resize all Visual Timer discs (global scale) via the handle on any one of them ---
    function startVisualTimerResize(e) {
        // The handle that was clicked is on a wrapper; we use it for visual feedback,
        // but the scale change applies to ALL Visual Timer wrappers (global setting).
        const wrapper = e.currentTarget ? e.currentTarget.parentElement : null;
        if (!wrapper) return;
        e.preventDefault();
        const point = e.touches ? e.touches[0] : e;
        const startX = point.clientX;
        const startY = point.clientY;
        const startScale = visualTimerScale;
        wrapper.classList.add('resizing');
        let aBouge = false;

        const onMove = (ev) => {
            const p = ev.touches ? ev.touches[0] : ev;
            const dx = p.clientX - startX;
            const dy = p.clientY - startY;
            if (Math.abs(dx) + Math.abs(dy) > 3) aBouge = true;
            const delta = (dx + dy) / 2;
            // Sensitivity: 100 px of movement = +1.0 scale
            let newScale = startScale + delta / 100;
            // Lower bound: 0.4
            if (newScale < 0.4) newScale = 0.4;
            // Upper bound: the disc must fit in the timer card's content width.
            // Card has max-width 500px (see grid CSS) and ~30px horizontal padding total.
            // The disc's natural width is 220px. So max scale = (cardWidth - padding) / 220.
            const card = wrapper.closest('.duration-card');
            if (card) {
                const cs = window.getComputedStyle(card);
                const padL = parseFloat(cs.paddingLeft) || 0;
                const padR = parseFloat(cs.paddingRight) || 0;
                const innerWidth = card.clientWidth - padL - padR;
                const maxByCard = innerWidth / 220;
                if (newScale > maxByCard) newScale = maxByCard;
            }
            // Hard cap as safety net
            if (newScale > 2.5) newScale = 2.5;
            visualTimerScale = Math.round(newScale * 100) / 100;
            applyVisualTimerScale();
        };
        const onEnd = () => {
            wrapper.classList.remove('resizing');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
            // Useful for adjusting default values: log the final scale on release.
            console.log('[visual-timer resize] visualTimerScale =', visualTimerScale);
            // Block the click that follows mouseup if the user actually dragged
            if (aBouge) {
                const blockClick = (ev) => {
                    ev.stopPropagation();
                    ev.preventDefault();
                    document.removeEventListener('click', blockClick, true);
                };
                document.addEventListener('click', blockClick, true);
            }
            save();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
    }

    // Apply the global Visual Timer scale to the document root (all wrappers read --vt-scale).
    function applyVisualTimerScale() {
        document.documentElement.style.setProperty('--vt-scale', visualTimerScale);
    }

    // --- WAKE LOCK (keep screen on while at least one timer is running) ---
    // Uses the Screen Wake Lock API where supported (Chrome/Edge/Android, Safari iOS 16.4+).
    // For older iOS Safari, falls back to playing a tiny silent looping video, which keeps
    // the screen awake (a documented technique used by web video apps before Wake Lock API).
    // The lock is acquired automatically when a timer becomes active and released when no
    // timer is running — there's no user setting because it makes no sense to want the
    // screen to sleep during a countdown.

    // Lazily create the wake-lock fallback video element. Only called on browsers that
    // don't support the Wake Lock API. By creating it on-demand instead of having it in
    // the static HTML, we avoid Firefox/Chrome trying (and failing) to decode it on every
    // page load, which produces console errors and wastes resources.
    function getOrCreateWakeLockVideo() {
        let video = document.getElementById('wakeLockVideo');
        if (video) return video;
        video = document.createElement('video');
        video.id = 'wakeLockVideo';
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('playsinline', '');
        video.preload = 'auto';
        video.style.cssText = 'position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; bottom:0; right:0; z-index:-1;';
        const source = document.createElement('source');

    function ensureWakeLock() {
        // Prefer the modern Wake Lock API. If unsupported (iOS Safari < 16.4), fall back
        // to playing a hidden silent looping video which keeps the screen awake.
        // The video.play() must happen synchronously inside the user-gesture chain (e.g.
        // a click on START), so we attempt it first; the async wakeLock.request comes after.
        if (!('wakeLock' in navigator)) {
            const video = getOrCreateWakeLockVideo();
            if (video.paused) video.play().catch(() => {});
            return;
        }
        if (!wakeLockSentinel) {
            navigator.wakeLock.request('screen').then(s => {
                wakeLockSentinel = s;
                s.addEventListener('release', () => { wakeLockSentinel = null; });
            }).catch(e => {
                // Wake Lock API exists but request failed (e.g. page hidden, or in some
                // Safari iOS edge cases). Fall back to the video as a safety net.
                const video = getOrCreateWakeLockVideo();
                if (video.paused) video.play().catch(() => {});
                console.log('Wake lock request failed:', e.message);
            });
        }
    }

    async function dropWakeLock() {
        // Called when no timer is active anymore. Release the wake lock.
        if (wakeLockSentinel) {
            try { await wakeLockSentinel.release(); } catch (e) {}
            wakeLockSentinel = null;
        }
        // Only touch the video if it actually exists (it's only created on-demand on
        // browsers that don't support the Wake Lock API).
        const video = document.getElementById('wakeLockVideo');
        if (video && !video.paused) video.pause();
    }

    // Call this whenever a timer starts or stops to refresh the wake-lock state.
    function refreshWakeLock() {
        const anyActive = activeTickIds && activeTickIds.size > 0;
        if (anyActive) ensureWakeLock();
        else dropWakeLock();
    }

    // Re-acquire the wake lock when the page becomes visible again (it gets auto-released
    // when the page is hidden, e.g. when the user switches tabs or backgrounds the app).
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            refreshWakeLock();
        }
    });

    // Toggle the visibility of the numeric time-left when the Visual Timer is shown.
    // Triggered by clicking the disc itself.
    function toggleHideTimeWithVisualTimer() {
        if (!showVisualTimer) return; // No effect if Visual Timer feature is off
        hideTimeWithVisualTimer = !hideTimeWithVisualTimer;
        applyHideTimeWithVisualTimer();
        save();
    }

    function applyHideTimeWithVisualTimer() {
        document.querySelectorAll('.duration-card').forEach(card => {
            card.classList.toggle('hide-time-with-visual', hideTimeWithVisualTimer);
        });
    }

    // spanning from 12 o'clock clockwise by `angleDeg` degrees.
    function buildSectorPath(cx, cy, r, angleDeg) {
        if (angleDeg <= 0) return '';
        // For a (near-)full disc, draw a true circle using two 180° arcs. This avoids the
        // degenerate case where start and end points are numerically identical (browsers
        // silently fail to render that single arc). The threshold is tight (>= 359.9°)
        // so that any visible chord (e.g. at 358° = 20 sec before 60 min) still renders
        // as a partial sector — otherwise the user sees a perceptible "jump" when the
        // remaining time crosses the 358° boundary.
        if (angleDeg >= 359.9) {
            return `M ${cx-r} ${cy} A ${r} ${r} 0 1 1 ${cx+r} ${cy} A ${r} ${r} 0 1 1 ${cx-r} ${cy} Z`;
        }
        const startRad = -Math.PI / 2; // 12 o'clock
        const endRad = startRad + angleDeg * Math.PI / 180;
        const x1 = cx + r * Math.cos(startRad);
        const y1 = cy + r * Math.sin(startRad);
        const x2 = cx + r * Math.cos(endRad);
        const y2 = cy + r * Math.sin(endRad);
        const largeArc = angleDeg > 180 ? 1 : 0;
        return `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
    }

    function startTimer(id) {
        unlockAudio();
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if(!obj) return;
        // A chained start (or any start) on a hidden timer un-hides it automatically:
        // the user needs to see a timer that's now counting down.
        if (obj.hidden) unhideTimer(id);
        obj.start = Date.now();
        obj.extraSecs = 0;  // Reset extra time on start
        obj.pausedAt = null; // Fresh start: not paused
        // NOTE: scheduledTimeOfDay is NOT cleared — the programmation recurs daily. The
        // timer will run today, and tomorrow at the same time the schedule fires again.
        updateActiveUI(id); updateEndTime(id); updateTimerTitle(id); startTick(id); save();
        // Wind-up animation on the Visual Timer disc (if the feature is enabled)
        if (showVisualTimer) animateVisualTimerWindUp(id);
        // The timer that follows this one may now need the "auto start" hint, and the
        // scheduled tick may need to stop if this was the last pending schedule.
        refreshChainLabels();
        refreshScheduledTick();
        // Make sure the newly-started timer is actually visible: switch to the Timers tab
        // if we're elsewhere (e.g. a scheduled/chained start fired while on Notes), and
        // scroll the card into view if it's off-screen.
        revealStartedTimer(id);
    }

    // Bring a just-started timer into view: jump to the Timers tab if needed, then scroll
    // the card into view if it isn't already visible. Kept defensive (no-op on errors).
    function revealStartedTimer(id) {
        try {
            if (currentTab !== 'timers') switchTab('timers');
            const card = document.getElementById(`card-${id}`);
            if (!card) return;
            const rect = card.getBoundingClientRect();
            const fullyVisible = rect.top >= 0 && rect.bottom <= (window.innerHeight || document.documentElement.clientHeight);
            if (!fullyVisible) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        } catch (e) { /* non-critical */ }
    }

    // Updates the title text "DURATION — X:XX" or "DURATION — X:XX (+30s)" if extraSecs > 0
    function updateTimerTitle(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const titleEl = document.getElementById(`title-${id}`);
        if (!titleEl) return;
        // Don't overwrite if the user is in edit mode
        if (titleEl.classList.contains('duration-edit-form')) return;
        const t = i18n[currentLang];
        let txt = `${t.duration} — ${formatTime(obj.totalSecs)}`;
        if (obj.extraSecs > 0) {
            txt += ` (+${formatExtraTime(obj.extraSecs)})`;
        }
        titleEl.textContent = txt;
    }

    // Compact format for extra time: "0:30", "1:00", "1:30"
    function formatExtraTime(s) {
        const m = Math.floor(s/60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2,'0')}`;
    }

    // For a timer in the paused state, the "current time" is frozen at obj.pausedAt
    // instead of Date.now(). Use this helper instead of Date.now() when computing elapsed
    // time on a timer object — it transparently handles paused timers.
    function effectiveNow(obj) {
        return (obj && obj.pausedAt !== null && obj.pausedAt !== undefined) ? obj.pausedAt : Date.now();
    }

    // Pause a running timer: freeze its display at the current remaining time. We record
    // when the pause started in obj.pausedAt; when the user resumes, we shift obj.start
    // forward by the pause duration so the remaining time picks up exactly where it was.
    function pauseTimer(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj || obj.start === null || obj.pausedAt !== null) return;
        // A finished timer (in its "red" auto-reset phase) must NOT be put on hold —
        // pausing it would freeze the auto-reset animation in a half-red state, which is
        // confusing. Just leave it to its reset cycle.
        const card = document.getElementById(`card-${id}`);
        if (card && card.classList.contains('finished')) return;
        obj.pausedAt = Date.now();
        // Remove from active tick set so the global tick stops updating this card.
        // (We don't call stopTick because we also want to keep wake-lock if other timers
        // are still running. stopTick handles the wake lock release when the set empties.)
        stopTick(id);
        // Refresh button bar (showing RESUME instead of PAUSE)
        updateActiveUI(id);
        save();
    }

    function resumeTimer(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj || obj.pausedAt === null) return;
        const pauseDuration = Date.now() - obj.pausedAt;
        obj.start += pauseDuration; // shift forward, so elapsed = (Date.now() - start) is unchanged
        obj.pausedAt = null;
        startTick(id);
        updateActiveUI(id);
        updateEndTime(id);
        save();
    }

    // Single global tick: all timers are refreshed at the same time,
    // which guarantees synchronous display for duplicated timers (same start).
    let globalTickInterval = null;
    let activeTickIds = new Set();

    // Starts all timers that are not yet running, and resumes any that are paused.
    // Does not affect timers that are already running or finished.
    // ============================================================================
    // GLOBAL PLAY/PAUSE — single button that mutates between ▶ (start/resume) and ⏸
    // (pause everything running). Rule of priority:
    //   - if anything is currently running → next click PAUSES everything running
    //   - else if any timer is paused      → next click RESUMES ONLY those (rule (b))
    //   - else                              → next click STARTS all NON-HIDDEN, not-started timers
    // Chained mode keeps its existing 3-button dialog (first / all / cancel). The "all"
    // branch and the simple start branch BOTH filter out hidden timers — the chain's own
    // propagation (un-hiding a chained hidden timer) is NOT affected by this filter.
    // ============================================================================

    // Set of timer ids that were paused by the global pause action, so the resume action
    // can target exactly those — and not timers the user had paused individually beforehand.
    let pausedByPauseAll = new Set();

    // Public entry point wired to the floating button.
    async function globalPlayPause() {
        // A timer is "running" for the purposes of the global pause button only if it's
        // started, not paused, AND not in its finished/red state — finished timers must
        // not be put on hold (their auto-reset would freeze mid-animation).
        const isFinished = (d) => {
            const card = document.getElementById(`card-${d.id}`);
            return !!(card && card.classList.contains('finished'));
        };
        const running = timersList.filter(d => d.start !== null && d.pausedAt === null && !isFinished(d));
        if (running.length > 0) {
            // PAUSE phase: pause everything running, remember which ones.
            pausedByPauseAll = new Set();
            running.forEach(d => { pausedByPauseAll.add(d.id.toString()); pauseTimer(d.id); });
            updateGlobalPlayPauseButton();
            return;
        }
        // Nothing is running → PLAY phase
        await globalStartOrResume();
        updateGlobalPlayPauseButton();
    }

    // PLAY action: rule (b). If any timer is paused, resume ONLY those — leave not-started
    // timers alone. Only when nothing is paused do we start the (non-hidden) not-started
    // timers (with the chained-mode dialog if applicable).
    async function globalStartOrResume() {
        const t = i18n[currentLang];
        const paused = timersList.filter(d => d.pausedAt !== null);
        if (paused.length > 0) {
            // Resume the ones the global pause button paused (if still paused); fall back to
            // resuming any paused timer if the set is empty (e.g. after reload).
            const toResume = pausedByPauseAll.size > 0
                ? paused.filter(d => pausedByPauseAll.has(d.id.toString()))
                : paused;
            toResume.forEach(d => { if (d.pausedAt !== null) resumeTimer(d.id); });
            pausedByPauseAll = new Set();
            return;
        }
        // Nothing paused: start the non-hidden, not-started timers.
        // Hidden timers are never started by the global button (they keep their hidden state).
        // The chain's own propagation (un-hide + start) is unaffected — it lives in markFinished.
        const notStartedVisible = timersList.filter(d => d.start === null && !d.hidden);
        if (notStartedVisible.length === 0) return;
        if (chainTimers && notStartedVisible.length > 1) {
            const choice = await confirmDialog(t.chainStartPrompt, {
                okLabel: t.chainStartFirst,        // start only the first
                thirdLabel: t.chainStartAll,       // start all at once
                cancelLabel: t.cancel
            });
            if (choice === false) return;          // Cancel
            if (choice === true) {
                // Start only the first not-started visible timer; chain handles the rest.
                startTimer(notStartedVisible[0].id);
                return;
            }
            // choice === 'third' → fall through to "start all visible"
        }
        notStartedVisible.forEach(d => startTimer(d.id));
    }

    // Update the global button icon + title to reflect the current action.
    function updateGlobalPlayPauseButton() {
        const btn = document.getElementById('btnStartAll');
        if (!btn) return;
        const t = i18n[currentLang];
        const anyRunning = timersList.some(d => d.start !== null && d.pausedAt === null);
        if (anyRunning) {
            // Show PAUSE icon (two bars) and switch the button to the orange palette.
            btn.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
            btn.title = t.pauseAllTitle;
            btn.classList.add('as-pause');
        } else {
            // Show PLAY icon (triangle) and switch back to the green palette.
            btn.innerHTML = '<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
            btn.title = t.startAllTitle || 'Démarrer';
            btn.classList.remove('as-pause');
        }
    }

    // Back-compat shims: anything still calling startAll / togglePauseAll / pauseAll /
    // updatePauseAllButton routes to the new behavior, so we don't have to touch every
    // historical call site (translateInterface, init, etc.).
    function startAll()             { return globalPlayPause(); }
    function togglePauseAll()       { return globalPlayPause(); }
    function pauseAll()              { return globalPlayPause(); }
    function updatePauseAllButton() { updateGlobalPlayPauseButton(); }

    // Stops all running or finished timers (resets them to initial state).
    async function stopAll() {
        // Don't bother confirming if no timer is actually running.
        const anyRunning = timersList.some(d => d.start !== null);
        if (!anyRunning) return;
        const ok = await confirmDialog(i18n[currentLang].confirmStopAll);
        if (!ok) return;
        timersList.forEach(d => {
            if (d.start !== null) stopTimer(d.id);
        });
    }

    // Changes the zoom level of the timers grid (all cards and their contents,
    // including in-place edit forms created on the fly, are affected).
    // Bounds: 0.6 (60%) to 2.0 (200%).
    // Dispatch zoom according to the active tab:
    // - on the timers tab, modifies timersZoom and applies to #durationsList
    // - on the notes tab, modifies richtextZoom and applies to #richtextEditor
    function zoomTimers(delta) {
        if (currentTab === 'instructions') {
            changeZoom(delta);
            return;
        }
        const newZoom = Math.round((timersZoom + delta) * 10) / 10;
        if (newZoom < 0.6 || newZoom > 2.0) return;
        timersZoom = newZoom;
        applyTimersZoom();
        save();
    }

    function resetZoomTimers() {
        if (currentTab === 'instructions') {
            setZoom(1.0);
            return;
        }
        timersZoom = 1.0;
        applyTimersZoom();
        save();
    }

    function applyTimersZoom() {
        const list = document.getElementById('durationsList');
        if (!list) return;
        // For the timers grid we ALWAYS use native CSS 'zoom' (even on iPad), because
        // 'transform: scale' wouldn't trigger grid reflow — the column count would stay
        // fixed regardless of zoom level. 'zoom' has minor rem-scaling quirks on iPad but
        // those are acceptable; the column-count behavior is what matters here.
        list.style.transform = '';
        list.style.transformOrigin = '';
        list.style.marginBottom = '';
        if (Math.abs(timersZoom - 1.0) < 0.001) {
            list.style.zoom = '';
        } else {
            list.style.zoom = timersZoom;
        }
        // Synchroniser les boutons UNIQUEMENT si on est sur l'onglet timers
        // (otherwise they reflect richtextZoom applied via applyZoom)
        if (currentTab === 'timers') syncZoomButtons();
    }

    // Updates the % label and the disabled state of the floating zoom buttons
    // according to the currently displayed tab.
    function syncZoomButtons() {
        const zoom = currentTab === 'instructions' ? richtextZoom : timersZoom;
        const btnIn = document.getElementById('btnZoomIn');
        const btnOut = document.getElementById('btnZoomOut');
        const btnReset = document.getElementById('btnZoomReset');
        const lbl = document.getElementById('btnZoomResetLabel');
        if (btnIn) btnIn.disabled = zoom >= 2.0;
        if (btnOut) btnOut.disabled = zoom <= 0.6;
        if (btnReset) btnReset.disabled = Math.abs(zoom - 1.0) < 0.01;
        if (lbl) lbl.textContent = Math.round(zoom * 100) + '%';
    }
    // Two separate handles: one for the digital setTimeout, one for the CFF rAF.
    // Allows having both in parallel ('both' mode) and cleaning up properly.
    let digitalClockTimeout = null;
    let cffClockRaf = null;

    function stopClockAnimations() {
        if (digitalClockTimeout !== null) { clearTimeout(digitalClockTimeout); digitalClockTimeout = null; }
        if (cffClockRaf !== null) { cancelAnimationFrame(cffClockRaf); cffClockRaf = null; }
    }

    function onClockModeChange() {
        const sel = document.getElementById('clockModeSelect');
        if (!sel) return;
        clockMode = sel.value;
        applyClock();
        save();
    }

    // Clic sur l'horloge : cycler entre les 3 modes visibles (digital → cff → both → digital).
    // The "none" mode is set only via the menu and doesn't enter the cycle.
    function cycleClock() {
        const cycle = ['digital', 'cff', 'both', 'none'];
        const idx = cycle.indexOf(clockMode);
        clockMode = cycle[(idx + 1) % cycle.length] || 'digital';
        const sel = document.getElementById('clockModeSelect');
        if (sel) sel.value = clockMode;
        applyClock();
        save();
    }

    function applyClock() {
        const container = document.getElementById('clockContainer');
        if (!container) return;
        stopClockAnimations();
        container.classList.remove('cff-mode', 'both-mode');
        const t = i18n[currentLang];
        const titleAttr = t.clockToggleTitle ? ` title="${t.clockToggleTitle}"` : '';
        // Resize handle, visible on wrapper hover.
        const handle = `<div class="clock-resize-handle" onmousedown="event.stopPropagation(); startClockResize(event)" ontouchstart="event.stopPropagation(); startClockResize(event)" title="${t.clockResizeTitle || 'Glisser pour redimensionner'}"></div>`;
        if (clockMode === 'none') {
            // Empty but clickable zone to allow returning to a visible mode.
            // Height reserved to stay consistent with other modes.
            container.innerHTML = `<div class="clock-clickable clock-empty" onclick="cycleClock()"${titleAttr}></div>`;
            return;
        }
        if (clockMode === 'digital') {
            container.innerHTML = `<div class="clock-clickable" onclick="cycleClock()"${titleAttr}><div class="clock-digital" id="clockDigital"></div>${handle}</div>`;
            tickDigitalClock();
        } else if (clockMode === 'cff') {
            container.classList.add('cff-mode');
            container.innerHTML = `<div class="clock-clickable" onclick="cycleClock()"${titleAttr}>${buildCffSvg()}${handle}</div>`;
            tickCffClock();
        } else if (clockMode === 'both') {
            container.classList.add('both-mode');
            container.innerHTML = `<div class="clock-clickable" onclick="cycleClock()"${titleAttr}>${buildCffSvg()}<div class="clock-digital" id="clockDigital"></div>${handle}</div>`;
            tickCffClock();
            tickDigitalClock();
        }
        // Apply the persisted scale
        applyClockScale();
    }

    function applyClockScale() {
        const wrapper = document.querySelector('.clock-clickable');
        applyScale(wrapper, clockScale);
    }

    // --- Drag & drop to resize the clock via the handle ---
    function startClockResize(e) {
        const wrapper = document.querySelector('.clock-clickable');
        if (!wrapper) return;
        e.preventDefault();
        // Initial coordinates (mouse or touch)
        const point = e.touches ? e.touches[0] : e;
        const startX = point.clientX;
        const startY = point.clientY;
        const startScale = clockScale;
        wrapper.classList.add('resizing');
        let aBouge = false;

        const onMove = (ev) => {
            const p = ev.touches ? ev.touches[0] : ev;
            const dx = p.clientX - startX;
            const dy = p.clientY - startY;
            if (Math.abs(dx) + Math.abs(dy) > 3) aBouge = true;
            // Average of horizontal and vertical movement (positive = bottom-right = larger)
            const delta = (dx + dy) / 2;
            // Sensitivity: 100 px of movement = +1.0 scale
            let newScale = startScale + delta / 100;
            if (newScale < 0.5) newScale = 0.5;
            if (newScale > 3.0) newScale = 3.0;
            clockScale = Math.round(newScale * 100) / 100;
            // Apply scale in real-time (uses 'zoom' on browsers that support it,
            // which triggers proper layout reflow so timers below adjust their position).
            applyClockScale();
        };
        const onEnd = () => {
            wrapper.classList.remove('resizing');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
            // Useful for adjusting default values: log the final scale on release.
            console.log('[clock resize] clockScale =', clockScale);
            // If the user actually moved, block the click following the mouseup
            // (otherwise cycleClock would be triggered by mistake)
            if (aBouge) {
                const blockClick = (ev) => {
                    ev.stopPropagation();
                    ev.preventDefault();
                    document.removeEventListener('click', blockClick, true);
                };
                document.addEventListener('click', blockClick, true);
            }
            save();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });

    function buildCffSvg() {
        // SVG 200x200, centre 100,100, rayon 95
        // Marques d'heures : 12 traits longs et larges
        // Marques de minutes : les 60 - 12 = 48 traits fins
        let ticks = '';
        for (let i = 0; i < 60; i++) {
            const angle = (i * 6 - 90) * Math.PI / 180;
            const isHour = i % 5 === 0;
            const r1 = isHour ? 70 : 86;
            const r2 = 92;
            const x1 = 100 + r1 * Math.cos(angle);
            const y1 = 100 + r1 * Math.sin(angle);
            const x2 = 100 + r2 * Math.cos(angle);
            const y2 = 100 + r2 * Math.sin(angle);
            ticks += `<line class="${isHour ? 'cff-tick-hour' : 'cff-tick-min'}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
        }
        return `
        <svg class="clock-cff" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle class="cff-bg" cx="100" cy="100" r="95"/>
            ${ticks}
            <!-- Hour hand: bar rounded at ends -->
            <g id="cff-hour-group">
                <rect class="cff-hand-hour" x="94" y="46" width="12" height="62" rx="2"/>
            </g>
            <!-- Aiguille des minutes -->
            <g id="cff-min-group">
                <rect class="cff-hand-min" x="96" y="20" width="8" height="88" rx="2"/>
            </g>
            <!-- Second hand: stem + red disk at the end -->
            <g class="cff-hand-sec" id="cff-sec-group">
                <rect x="98.5" y="32" width="3" height="74"/>
                <circle cx="100" cy="40" r="9"/>
            </g>
        </svg>`;
    }

    function tickCffClock() {
        const hourGroup = document.getElementById('cff-hour-group');
        const minGroup = document.getElementById('cff-min-group');
        const secGroup = document.getElementById('cff-sec-group');
        if (!hourGroup || !minGroup || !secGroup) return;
        const now = new Date();
        const h = now.getHours() % 12;
        const m = now.getMinutes();
        // Aiguille des heures : bouge en continu selon les minutes (30°/h + 0.5°/min)
        const hourAngle = h * 30 + m * 0.5;
        // Minute hand: jumps one notch each minute (CFF style)
        const minAngle = m * 6;
        // SVG-native rotation around the clock center (cx=100, cy=100). This is the only
        // way to get a stable rotation point under CSS 'zoom' on Safari, which doesn't
        // honor CSS 'transform-origin' values in SVG user-space coordinates.
        hourGroup.setAttribute('transform', `rotate(${hourAngle} 100 100)`);
        minGroup.setAttribute('transform', `rotate(${minAngle} 100 100)`);
        // Second hand: 360° in 58.5s, then pause at 360° (=0°) for 1.5s
        // Animation computed each frame from Date.now() → smooth at 60fps without setInterval
        const msInMinute = (now.getSeconds() * 1000) + now.getMilliseconds();
        const ratio = Math.min(msInMinute / 58500, 1);
        const secAngle = ratio * 360;
        secGroup.setAttribute('transform', `rotate(${secAngle} 100 100)`);
        cffClockRaf = requestAnimationFrame(tickCffClock);
    }
