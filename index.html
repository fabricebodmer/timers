    function startTimer(id) {
        unlockAudio();
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if(!obj) return;
        obj.start = Date.now();
        obj.extraSecs = 0;  // Reset extra time on start
        updateActiveUI(id); updateEndTime(id); updateTimerTitle(id); startTick(id); save();
    }

    // Updates the title text "DURATION — X:XX" or "DURATION — X:XX (+30s)" if extraSecs > 0
    function updateTimerTitle(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const titleEl = document.getElementById(`title-${id}`);
        if (!titleEl) return;
        // Don't overwrite if the user is in edit mode
        if (titleEl.classList.contains('duration-edit-form')) return;
        const t = i18n[currentLang];
        let txt = `${t.duration} — ${formatTime(obj.totalSecs)}`;
        if (obj.extraSecs > 0) {
            txt += ` (+${formatExtraTime(obj.extraSecs)})`;
        }
        titleEl.textContent = txt;
    }

    // Compact format for extra time: "0:30", "1:00", "1:30"
    function formatExtraTime(s) {
        const m = Math.floor(s/60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2,'0')}`;
    }

    // Single global tick: all timers are refreshed at the same time,
    // which guarantees synchronous display for duplicated timers (same start).
    let globalTickInterval = null;
    let activeTickIds = new Set();

    // Starts all timers that are not yet started (start === null).
    // Does not affect running or finished timers.
    function startAll() {
        timersList.forEach(d => {
            if (d.start === null) startTimer(d.id);
        });
    }

    // Stops all running or finished timers (resets them to initial state).
    function stopAll() {
        timersList.forEach(d => {
            if (d.start !== null) stopTimer(d.id);
        });
    }

    // Changes the zoom level of the timers grid (all cards and their contents,
    // including in-place edit forms created on the fly, are affected).
    // Bounds: 0.6 (60%) to 2.0 (200%).
    // Dispatch zoom according to the active tab:
    // - on the timers tab, modifies timersZoom and applies to #durationsList
    // - on the notes tab, modifies richtextZoom and applies to #richtextEditor
    function zoomTimers(delta) {
        if (currentTab === 'instructions') {
            changeZoom(delta);
            return;
        }
        const newZoom = Math.round((timersZoom + delta) * 10) / 10;
        if (newZoom < 0.6 || newZoom > 2.0) return;
        timersZoom = newZoom;
        applyTimersZoom();
        save();
    }

    function resetZoomTimers() {
        if (currentTab === 'instructions') {
            setZoom(1.0);
            return;
        }
        timersZoom = 1.0;
        applyTimersZoom();
        save();
    }

    function applyTimersZoom() {
        const list = document.getElementById('durationsList');
        applyScale(list, timersZoom);
        // Synchroniser les boutons UNIQUEMENT si on est sur l'onglet timers
        // (otherwise they reflect richtextZoom applied via applyZoom)
        if (currentTab === 'timers') syncZoomButtons();
    }

    // Updates the % label and the disabled state of the floating zoom buttons
    // according to the currently displayed tab.
    function syncZoomButtons() {
        const zoom = currentTab === 'instructions' ? richtextZoom : timersZoom;
        const btnIn = document.getElementById('btnZoomIn');
        const btnOut = document.getElementById('btnZoomOut');
        const btnReset = document.getElementById('btnZoomReset');
        const lbl = document.getElementById('btnZoomResetLabel');
        if (btnIn) btnIn.disabled = zoom >= 2.0;
        if (btnOut) btnOut.disabled = zoom <= 0.6;
        if (btnReset) btnReset.disabled = Math.abs(zoom - 1.0) < 0.01;
        if (lbl) lbl.textContent = Math.round(zoom * 100) + '%';
    }
    // Two separate handles: one for the digital setTimeout, one for the CFF rAF.
    // Allows having both in parallel ('both' mode) and cleaning up properly.
    let digitalClockTimeout = null;
    let cffClockRaf = null;

    function stopClockAnimations() {
        if (digitalClockTimeout !== null) { clearTimeout(digitalClockTimeout); digitalClockTimeout = null; }
        if (cffClockRaf !== null) { cancelAnimationFrame(cffClockRaf); cffClockRaf = null; }
    }

    function onClockModeChange() {
        const sel = document.getElementById('clockModeSelect');
        if (!sel) return;
        clockMode = sel.value;
        applyClock();
        save();
    }

    // Clic sur l'horloge : cycler entre les 3 modes visibles (digital → cff → both → digital).
    // The "none" mode is set only via the menu and doesn't enter the cycle.
    function cycleClock() {
        const cycle = ['digital', 'cff', 'both', 'none'];
        const idx = cycle.indexOf(clockMode);
        clockMode = cycle[(idx + 1) % cycle.length] || 'digital';
        const sel = document.getElementById('clockModeSelect');
        if (sel) sel.value = clockMode;
        applyClock();
        save();
    }

    function applyClock() {
        const container = document.getElementById('clockContainer');
        if (!container) return;
        stopClockAnimations();
        container.classList.remove('cff-mode', 'both-mode');
        const t = i18n[currentLang];
        const titleAttr = t.clockToggleTitle ? ` title="${t.clockToggleTitle}"` : '';
        // Resize handle, visible on wrapper hover.
        const handle = `<div class="clock-resize-handle" onmousedown="event.stopPropagation(); startClockResize(event)" ontouchstart="event.stopPropagation(); startClockResize(event)" title="${t.clockResizeTitle || 'Glisser pour redimensionner'}"></div>`;
        if (clockMode === 'none') {
            // Empty but clickable zone to allow returning to a visible mode.
            // Height reserved to stay consistent with other modes.
            container.innerHTML = `<div class="clock-clickable clock-empty" onclick="cycleClock()"${titleAttr}></div>`;
            return;
        }
        if (clockMode === 'digital') {
            container.innerHTML = `<div class="clock-clickable" onclick="cycleClock()"${titleAttr}><div class="clock-digital" id="clockDigital"></div>${handle}</div>`;
            tickDigitalClock();
        } else if (clockMode === 'cff') {
            container.classList.add('cff-mode');
            container.innerHTML = `<div class="clock-clickable" onclick="cycleClock()"${titleAttr}>${buildCffSvg()}${handle}</div>`;
            tickCffClock();
        } else if (clockMode === 'both') {
            container.classList.add('both-mode');
            container.innerHTML = `<div class="clock-clickable" onclick="cycleClock()"${titleAttr}>${buildCffSvg()}<div class="clock-digital" id="clockDigital"></div>${handle}</div>`;
            tickCffClock();
            tickDigitalClock();
        }
        // Apply the persisted scale
        applyClockScale();
    }

    function applyClockScale() {
        const wrapper = document.querySelector('.clock-clickable');
        applyScale(wrapper, clockScale);
    }

    // --- Drag & drop to resize the clock via the handle ---
    function startClockResize(e) {
        const wrapper = document.querySelector('.clock-clickable');
        if (!wrapper) return;
        e.preventDefault();
        // Initial coordinates (mouse or touch)
        const point = e.touches ? e.touches[0] : e;
        const startX = point.clientX;
        const startY = point.clientY;
        const startScale = clockScale;
        wrapper.classList.add('resizing');
        let aBouge = false;

        const onMove = (ev) => {
            const p = ev.touches ? ev.touches[0] : ev;
            const dx = p.clientX - startX;
            const dy = p.clientY - startY;
            if (Math.abs(dx) + Math.abs(dy) > 3) aBouge = true;
            // Average of horizontal and vertical movement (positive = bottom-right = larger)
            const delta = (dx + dy) / 2;
            // Sensitivity: 100 px of movement = +1.0 scale
            let newScale = startScale + delta / 100;
            if (newScale < 0.5) newScale = 0.5;
            if (newScale > 3.0) newScale = 3.0;
            clockScale = Math.round(newScale * 100) / 100;
            applyClockScale();
        };
        const onEnd = () => {
            wrapper.classList.remove('resizing');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
            // If the user actually moved, block the click following the mouseup
            // (otherwise cycleClock would be triggered by mistake)
            if (aBouge) {
                const blockClick = (ev) => {
                    ev.stopPropagation();
                    ev.preventDefault();
                    document.removeEventListener('click', blockClick, true);
                };
                document.addEventListener('click', blockClick, true);
            }
            save();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
    }

    function tickDigitalClock() {
        const el = document.getElementById('clockDigital');
        if (!el) return;
        const now = new Date();
        const h = now.getHours().toString().padStart(2, '0');
        const m = now.getMinutes().toString().padStart(2, '0');
        el.textContent = `${h}:${m}`;
        // Re-planifier au prochain changement de minute
        const ms = 60000 - (Date.now() % 60000);
        digitalClockTimeout = setTimeout(tickDigitalClock, ms);
    }

    function buildCffSvg() {
        // SVG 200x200, centre 100,100, rayon 95
        // Marques d'heures : 12 traits longs et larges
        // Marques de minutes : les 60 - 12 = 48 traits fins
        let ticks = '';
        for (let i = 0; i < 60; i++) {
            const angle = (i * 6 - 90) * Math.PI / 180;
            const isHour = i % 5 === 0;
            const r1 = isHour ? 70 : 86;
            const r2 = 92;
            const x1 = 100 + r1 * Math.cos(angle);
            const y1 = 100 + r1 * Math.sin(angle);
            const x2 = 100 + r2 * Math.cos(angle);
            const y2 = 100 + r2 * Math.sin(angle);
            ticks += `<line class="${isHour ? 'cff-tick-hour' : 'cff-tick-min'}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
        }
        return `
        <svg class="clock-cff" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle class="cff-bg" cx="100" cy="100" r="95"/>
            ${ticks}
            <!-- Hour hand: bar rounded at ends -->
            <g id="cff-hour-group" style="transform-origin: 100px 100px;">
                <rect class="cff-hand-hour" x="94" y="46" width="12" height="62" rx="2"/>
            </g>
            <!-- Aiguille des minutes -->
            <g id="cff-min-group" style="transform-origin: 100px 100px;">
                <rect class="cff-hand-min" x="96" y="20" width="8" height="88" rx="2"/>
            </g>
            <!-- Second hand: stem + red disk at the end -->
            <g class="cff-hand-sec" id="cff-sec-group">
                <rect x="98.5" y="32" width="3" height="74"/>
                <circle cx="100" cy="40" r="9"/>
            </g>
        </svg>`;
    }

    function tickCffClock() {
        const hourGroup = document.getElementById('cff-hour-group');
        const minGroup = document.getElementById('cff-min-group');
        const secGroup = document.getElementById('cff-sec-group');
        if (!hourGroup || !minGroup || !secGroup) return;
        const now = new Date();
        const h = now.getHours() % 12;
        const m = now.getMinutes();
        // Aiguille des heures : bouge en continu selon les minutes (30°/h + 0.5°/min)
        const hourAngle = h * 30 + m * 0.5;
        // Minute hand: jumps one notch each minute (CFF style)
        const minAngle = m * 6;
        hourGroup.style.transform = `rotate(${hourAngle}deg)`;
        minGroup.style.transform = `rotate(${minAngle}deg)`;
        // Second hand: 360° in 58.5s, then pause at 360° (=0°) for 1.5s
        // Animation computed each frame from Date.now() → smooth at 60fps without setInterval
        const msInMinute = (now.getSeconds() * 1000) + now.getMilliseconds();
        const ratio = Math.min(msInMinute / 58500, 1);
        const secAngle = ratio * 360;
        secGroup.style.transform = `rotate(${secAngle}deg)`;
        cffClockRaf = requestAnimationFrame(tickCffClock);
    }


    function globalTick() {
        activeTickIds.forEach(id => {
            const obj = timersList.find(d => d.id.toString() === id.toString());
            if (!obj?.start) { activeTickIds.delete(id); return; }
            const ecoule = Date.now() - obj.start;
            const total = (obj.totalSecs + obj.extraSecs) * 1000;
            const restant = total - ecoule;
            const timeEl = document.getElementById(`time-${id}`);
            const progressEl = document.getElementById(`progress-${id}`);
            const card = document.getElementById(`card-${id}`);
            if (!timeEl || !progressEl || !card) { activeTickIds.delete(id); return; }
            if (restant <= 0) {
                timeEl.textContent = "0:00";
                progressEl.style.width = "100%";
                if (!card.classList.contains('finished')) { markFinished(id); }
                activeTickIds.delete(id);
                return;
            }
            timeEl.textContent = formatTime(Math.ceil(restant/1000));
            progressEl.style.width = (ecoule/total*100) + "%";
        });
        // No more active timers → stop the clock
        if (activeTickIds.size === 0 && globalTickInterval !== null) {
            clearInterval(globalTickInterval);
            globalTickInterval = null;
        }
    }

    function startTick(id) {
        activeTickIds.add(id.toString());
        // Start the global tick if not already active
        if (globalTickInterval === null) {
            globalTickInterval = setInterval(globalTick, 250);
        }
        // Immediate refresh so the card displays the correct value right away
        globalTick();
    }

    function stopTick(id) {
        activeTickIds.delete(id.toString());
        if (activeTickIds.size === 0 && globalTickInterval !== null) {
            clearInterval(globalTickInterval);
            globalTickInterval = null;
        }
    }

    function playAlarm(id) { playBellSound(id); soundIntervals[id] = setInterval(() => playBellSound(id), 3000); }

    // Map id → setTimeout for auto-reset countdowns
    let autoResetTimeouts = {};

    // Marks a timer as finished: adds the finished class, plays the alarm, and starts
    // possibly the auto-reset depending on the setting. Centralized to avoid duplicating logic.
    function markFinished(id) {
        const card = document.getElementById(`card-${id}`);
        if (!card || card.classList.contains('finished')) return;
        card.classList.add('finished');
        playAlarm(id);
        if (autoResetDelay > 0) startAutoReset(id);
    }

    function startAutoReset(id) {
        // Cancel any previously scheduled reset for this timer
        cancelAutoReset(id);
        const card = document.getElementById(`card-${id}`);
        const fill = document.getElementById(`progress-${id}`);
        if (!card || !fill) return;
        // Animate the red bar from right to left: invert direction via a class,
        // then trigger the transition to width:0 over the autoResetDelay duration.
        card.classList.add('auto-resetting');
        // Forcer reflow pour que la transition prenne effet (sinon le navigateur peut
        // grouper les changements de style et zapper la transition).
        fill.style.width = '100%';
        // eslint-disable-next-line no-unused-expressions
        fill.offsetWidth;
        fill.style.transition = `width ${autoResetDelay}s linear`;
        fill.style.width = '0%';
        // At the end of the delay, reset the timer
        autoResetTimeouts[id] = setTimeout(() => {
            delete autoResetTimeouts[id];
            stopTimer(id);
        }, autoResetDelay * 1000);
    }

    function cancelAutoReset(id) {
        if (autoResetTimeouts[id]) {
            clearTimeout(autoResetTimeouts[id]);
            delete autoResetTimeouts[id];
        }
        const card = document.getElementById(`card-${id}`);
        const fill = document.getElementById(`progress-${id}`);
        if (card) card.classList.remove('auto-resetting');
        if (fill) {
            // Restore the default transition (1s linear like in the base CSS)
            fill.style.transition = '';
        }
    }

    function onGlobalControlsChange() {
        const checkbox = document.getElementById('globalCtrlsCheckbox');
        if (!checkbox) return;
        showGlobalControls = checkbox.checked;
        applyGlobalControlsVisibility();
        save();
    }

    // Updates the visibility of global play/stop buttons according to showGlobalControls
    // AND according to the current tab (they should only appear on the timers tab).
    function applyGlobalControlsVisibility() {
        const masquer = !showGlobalControls || currentTab !== 'timers';
        const btnStartAll = document.getElementById('btnStartAll');
        if (btnStartAll) btnStartAll.classList.toggle('hidden', masquer);
        const btnStopAll = document.getElementById('btnStopAll');
        if (btnStopAll) btnStopAll.classList.toggle('hidden', masquer);
    }

    // Detect browsers that correctly support the CSS 'zoom' property.
    // Exclude Safari/iOS which has buggy support (only applies to the visual box, not to rem).
    // Firefox 126+, Chrome, Edge support it correctly.
    const supportsCssZoom = (() => {
        const ua = navigator.userAgent;
        const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isSafariDesktop = /Safari/.test(ua) && !/Chrome/.test(ua) && !/Edg/.test(ua) && !isIOS;
        // iOS and Safari desktop: avoid 'zoom' (inconsistent rendering)
        return !isIOS && !isSafariDesktop;
    })();

    // Applies a visual scaling factor to an element, in a compatible way.
    // Strategy:
    //   - On Firefox/Chrome/Edge: 'zoom' (clean rendering, layout handled automatically)
    //   - On Safari/iOS: 'transform: scale' with centered transform-origin and compensating margin
    function applyScale(el, scale) {
        if (!el) return;
        // Reset if scale = 1 (default case)
        if (Math.abs(scale - 1.0) < 0.001) {
            el.style.transform = '';
            el.style.transformOrigin = '';
            el.style.marginBottom = '';
            el.style.zoom = '';
            return;
        }
        if (supportsCssZoom) {
            // Main path (desktop except Safari): native zoom
            el.style.zoom = scale;
            el.style.transform = '';
            el.style.transformOrigin = '';
            el.style.marginBottom = '';
            return;
        }
        // Safari/iOS path: transform: scale + vertical compensation
        el.style.zoom = '';
        el.style.transformOrigin = '50% 0';
        el.style.transform = `scale(${scale})`;
        // Reserve additional vertical space if scale > 1
        requestAnimationFrame(() => {
            const naturalHeight = el.offsetHeight;
            if (scale > 1) {
                el.style.marginBottom = (naturalHeight * (scale - 1)) + 'px';
            } else {
                el.style.marginBottom = '';
            }
        });
    }

    function onAutoResetChange() {
        const input = document.getElementById('autoResetInput');
        if (!input) return;
        let val = parseInt(input.value);
        if (isNaN(val) || val < 0) val = 0;
        if (val > 3600) val = 3600;
        input.value = val;
        autoResetDelay = val;
        save();
    }

    function onExtraDelayChange() {
        const input = document.getElementById('extraDelayInput');
        if (!input) return;
        let val = parseInt(input.value);
        if (isNaN(val) || val < 1) val = 1;
        if (val > 3600) val = 3600;
        input.value = val;
        extraDelay = val;
        // Update the label of the "+Xs" button on all active timers
        document.querySelectorAll('.btn-plus').forEach(btn => {
            btn.textContent = extraLabel();
        });
        save();
    }

    // Generates the label of the "+Xs" button based on the extraDelay value
    function extraLabel() {
        const m = Math.floor(extraDelay / 60);
        const sec = extraDelay % 60;
        return `+ ${m}:${sec.toString().padStart(2,'0')}`;
    }

    function stopTimer(id) {
        stopTick(id); clearInterval(soundIntervals[id]); cancelAutoReset(id);
        const obj = timersList.find(d => d.id.toString() === id.toString());
        obj.start = null; obj.extraSecs = 0;
        obj.muted = false;
        const card = document.getElementById(`card-${id}`);
        card.classList.remove('active', 'finished');
        // Immediate bar reset, without animation (otherwise we'd see the bar "flow" to 0)
        const fill = document.getElementById(`progress-${id}`);
        if (fill) {
            fill.style.transition = 'none';
            fill.style.width = '0%';
            // Force reflow then restore the default transition for future uses
            // eslint-disable-next-line no-unused-expressions
            fill.offsetWidth;
            fill.style.transition = '';
        }
        document.getElementById(`time-${id}`).textContent = formatTime(obj.totalSecs);
        document.getElementById(`endtime-${id}`).textContent = "";
        updateTimerTitle(id);
        document.getElementById(`actions-${id}`).innerHTML = `<button class="btn-start" onclick="startTimer('${id}')">${i18n[currentLang].start}</button>`;
        save();
    }

    function updateActiveUI(id) {
        const t = i18n[currentLang]; const obj = timersList.find(d => d.id.toString() === id.toString());
        document.getElementById(`card-${id}`).classList.add('active');
        document.getElementById(`actions-${id}`).innerHTML = `
            <button class="btn-action btn-plus" onclick="addExtraTime('${id}')">${extraLabel()}</button>
            <button class="btn-action btn-stop" onclick="stopTimer('${id}')">🛑 ${t.stop}</button>
            <button id="btn-mute-${id}" class="btn-action" onclick="toggleMute('${id}')">${obj.muted?'🔇':'🔊'} ${t.mute}</button>`;
    }

    function toggleMute(id) { 
        const obj = timersList.find(d => d.id.toString() === id.toString());
        obj.muted = !obj.muted; 
        document.getElementById(`btn-mute-${id}`).innerHTML = `${obj.muted?'🔇':'🔊'} ${i18n[currentLang].mute}`;
        save();
    }

    function addExtraTime(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        const card = document.getElementById(`card-${id}`);
        const etaitFini = card.classList.contains('finished');
        // If the timer is finished, we also need to compensate for accumulated delay so that
        // +30s actually elapses from now. The compensation is added to
        // extraSecs: this way the title "(+X:XX)" reflects the total time actually added
        // beyond the original duration.
        if (etaitFini && obj.start) {
            const ecouleSec = (Date.now() - obj.start) / 1000;
            const totalActuel = obj.totalSecs + obj.extraSecs;
            const retardSec = Math.max(0, Math.round(ecouleSec - totalActuel));
            obj.extraSecs += retardSec;
        }
        obj.extraSecs += extraDelay;
        updateEndTime(id); updateTimerTitle(id);
        if (etaitFini) {
            cancelAutoReset(id);
            card.classList.remove('finished');
            // Restore the bar to full width (auto-reset may have already shrunk it)
            const fill = document.getElementById(`progress-${id}`);
            if (fill) { fill.style.transition = ''; fill.style.width = '100%'; }
            clearInterval(soundIntervals[id]); startTick(id);
        }
        save();
    }

    async function deleteTimer(id) {
        if (!document.getElementById(`card-${id}`).classList.contains('finished')) {
            const ok = await confirmDialog(i18n[currentLang].confirmDelete);
            if (!ok) return;
        }
        stopTick(id); clearInterval(soundIntervals[id]); cancelAutoReset(id);
        document.getElementById(`card-${id}`).remove();
        timersList = timersList.filter(d => d.id.toString() !== id.toString());
        save();
    }

    // Custom confirmation modal (preserves full-screen, unlike window.confirm)
    function confirmDialog(message, options = {}) {
        return new Promise((resolve) => {
            const overlay = document.getElementById('confirmModal');
            const msg = document.getElementById('confirmModalMessage');
            const btnOk = document.getElementById('confirmModalOk');
            const btnCancel = document.getElementById('confirmModalCancel');
            const t = i18n[currentLang];
            const alertMode = options.alertMode === true;
            msg.textContent = message;
            btnOk.textContent = t.save || 'OK';
            btnCancel.textContent = t.cancel || 'Annuler';
            // En mode alerte, on n'affiche que OK
            btnCancel.style.display = alertMode ? 'none' : '';
            overlay.classList.add('visible');

            const cleanup = (result) => {
                overlay.classList.remove('visible');
                btnCancel.style.display = '';
                btnOk.removeEventListener('click', onOk);
                btnCancel.removeEventListener('click', onCancel);
                document.removeEventListener('keydown', onKey);
                overlay.removeEventListener('click', onOverlayClick);
                resolve(result);
            };
            const onOk = () => cleanup(true);
            const onCancel = () => cleanup(false);
            const onKey = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); cleanup(true); }
                else if (e.key === 'Escape') { e.preventDefault(); cleanup(alertMode ? true : false); }
            };
            const onOverlayClick = (e) => {
                // Click on the backdrop (not the box) = cancel (or OK in alert mode)
                if (e.target === overlay) cleanup(alertMode ? true : false);
            };
            btnOk.addEventListener('click', onOk);
            btnCancel.addEventListener('click', onCancel);
            document.addEventListener('keydown', onKey);
            overlay.addEventListener('click', onOverlayClick);
            // En mode alerte, focus sur OK ; sinon sur Annuler (action moins destructive)
            setTimeout(() => (alertMode ? btnOk : btnCancel).focus(), 0);
        });
    }

    function duplicateTimer(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        // Guarantee a unique id even with rapid clicks
        let nouvelId = Date.now();
        while (timersList.some(d => d.id === nouvelId)) nouvelId++;
        // Copy ALL properties from the source timer
        const sourceLancee = obj.start !== null;
        const copie = {
            id: nouvelId,
            nom: obj.nom,
            totalSecs: obj.totalSecs,
            start: obj.start,           // same exact start time (millisecond-synced)
            extraSecs: obj.extraSecs,   // same extra time
            muted: obj.muted            // same mute state
        };
        // Insert right after the original in the data list
        const index = timersList.findIndex(d => d.id.toString() === id.toString());
        timersList.splice(index + 1, 0, copie);
        // Create the HTML card and insert it right after the original in the DOM
        createCardHTML(copie);
        const cardOriginale = document.getElementById(`card-${id}`);
        const cardCopie = document.getElementById(`card-${nouvelId}`);
        cardOriginale.after(cardCopie);
        // If the source timer was running, reflect the running state on the copy
        if (sourceLancee) {
            const ecoule = Date.now() - copie.start;
            const total = (copie.totalSecs + copie.extraSecs) * 1000;
            if (ecoule < total) {
                updateActiveUI(nouvelId);
                updateEndTime(nouvelId);
                updateTimerTitle(nouvelId);
                startTick(nouvelId);
            } else {
                // Timer already finished at duplication time → reproduce the "finished" state
                updateActiveUI(nouvelId);
                updateTimerTitle(nouvelId);
                document.getElementById(`time-${nouvelId}`).textContent = "0:00";
                document.getElementById(`progress-${nouvelId}`).style.width = "100%";
                markFinished(nouvelId);
            }
        }
        save();
    }

    function editTimer(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const titleEl = document.getElementById(`title-${id}`);
        if (!titleEl) return;
        // If already in edit mode, do nothing
        if (titleEl.querySelector('input')) return;
        // Close any other ongoing edit
        document.querySelectorAll('.duration-edit-form').forEach(el => {
            const otherId = el.id.replace('title-', '');
            if (otherId !== id.toString()) cancelTimerEdit(otherId);
        });
        const t = i18n[currentLang];
        const min = Math.floor(obj.totalSecs / 60);
        const sec = obj.totalSecs % 60;
        titleEl.classList.remove('label-duree-titre');
        titleEl.classList.add('duration-edit-form');
        titleEl.onclick = null;
        // "Cancel extra time" button only if extraSecs > 0
        const btnRemoveExtra = obj.extraSecs > 0
            ? `<button type="button" class="btn-remove-extra" id="edit-remove-extra-${id}" title="${t.removeExtraTitle}">↩ ${formatExtraTime(obj.extraSecs)}</button>`
            : '';
        titleEl.innerHTML = `
            <input type="number" id="edit-min-${id}" value="${min}" min="0" />
            <span>${t.labelMin}</span>
            <input type="number" id="edit-sec-${id}" value="${sec}" min="0" max="59" />
            <span>${t.labelSec}</span>
            <button type="button" id="edit-ok-${id}" title="${t.save}">✓</button>
            <button type="button" class="btn-cancel" id="edit-cancel-${id}" title="${t.cancel}">✕</button>
            ${btnRemoveExtra}
        `;
        const minInput = document.getElementById(`edit-min-${id}`);
        const secInput = document.getElementById(`edit-sec-${id}`);
        const btnOk = document.getElementById(`edit-ok-${id}`);
        const btnCancel = document.getElementById(`edit-cancel-${id}`);
        const btnRemove = document.getElementById(`edit-remove-extra-${id}`);

        // Attach handlers via addEventListener for better reliability
        // stopPropagation so any parent onclick doesn't fire
        btnOk.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            confirmTimerEdit(id);
        });
        btnCancel.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            cancelTimerEdit(id);
        });
        if (btnRemove) {
            btnRemove.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                cancelExtraTime(id);
            });
        }
        // Prevent clicks on the inputs from closing/reopening anything
        [minInput, secInput].forEach(el => {
            el.addEventListener('click', (e) => e.stopPropagation());
        });

        minInput.focus();
        minInput.select();
        // Prevent drag during edit
        const card = document.getElementById(`card-${id}`);
        if (card) card.draggable = false;
        // Validate with Enter, cancel with Escape
        const handler = (e) => {
            if (e.key === 'Enter') { e.preventDefault(); confirmTimerEdit(id); }
            else if (e.key === 'Escape') { e.preventDefault(); cancelTimerEdit(id); }
        };
        minInput.addEventListener('keydown', handler);
        secInput.addEventListener('keydown', handler);
    }

    function confirmTimerEdit(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const minInput = document.getElementById(`edit-min-${id}`);
        const secInput = document.getElementById(`edit-sec-${id}`);
        if (!minInput || !secInput) return;
        const nouveauTotal = (parseInt(minInput.value) || 0) * 60 + (parseInt(secInput.value) || 0);
        if (nouveauTotal <= 0) {
            // Invalid duration, cancel
            cancelTimerEdit(id);
            return;
        }
        // IMPORTANT: we do NOT touch obj.start if the timer is running.
        // We only modify the total duration; the tick will recalculate automatically.
        obj.totalSecs = nouveauTotal;

        // Restaurer le titre
        restoreTimerTitle(id);

        // If the timer was running and we have a new duration longer than elapsed time,
        // we may need to take it out of the "finished" state and restart the tick.
        const card = document.getElementById(`card-${id}`);
        if (obj.start) {
            const ecoule = Date.now() - obj.start;
            const total = (obj.totalSecs + obj.extraSecs) * 1000;
            if (ecoule < total) {
                // Le timer doit (re)tourner
                if (card.classList.contains('finished')) {
                    card.classList.remove('finished');
                    clearInterval(soundIntervals[id]);
                }
                startTick(id);
                updateEndTime(id);
            } else {
                // The new duration is exceeded → force the finished state if not already
                document.getElementById(`time-${id}`).textContent = "0:00";
                document.getElementById(`progress-${id}`).style.width = "100%";
                if (!card.classList.contains('finished')) {
                    markFinished(id);
                }
                stopTick(id);
            }
        } else {
            // Timer not started: just refresh the remaining-time display
            document.getElementById(`time-${id}`).textContent = formatTime(obj.totalSecs);
        }
        save();
    }

    function cancelTimerEdit(id) {
        restoreTimerTitle(id);
    }

    // Sets extraSecs back to 0 (timer shortened by the extra time added via +Xs).
    // If the result puts the timer behind, it transitions to finished like in confirmTimerEdit.
    function cancelExtraTime(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        obj.extraSecs = 0;
        // Close the edit form
        restoreTimerTitle(id);
        // If the timer is running, check if the new duration is exceeded
        const card = document.getElementById(`card-${id}`);
        if (obj.start && card) {
            const ecoule = Date.now() - obj.start;
            const total = obj.totalSecs * 1000;
            if (ecoule >= total) {
                // Duration exceeded → mark finished if not already
                document.getElementById(`time-${id}`).textContent = "0:00";
                document.getElementById(`progress-${id}`).style.width = "100%";
                if (!card.classList.contains('finished')) {
                    markFinished(id);
                }
                stopTick(id);
            } else {
                // The timer continues with its original duration, update the end time
                updateEndTime(id);
            }
        }
        save();
    }

    function restoreTimerTitle(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const titleEl = document.getElementById(`title-${id}`);
        if (!titleEl) return;
        const t = i18n[currentLang];
        titleEl.classList.remove('duration-edit-form');
        titleEl.classList.add('label-duree-titre');
        titleEl.title = t.editDurationTitle;
        titleEl.onclick = () => editTimer(id);
        const card = document.getElementById(`card-${id}`);
        if (card) card.draggable = true;
        // Recalculer le texte avec extraSecs si pertinent
        updateTimerTitle(id);
    }

    // Escape HTML characters to avoid injections via timer name
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // --- TIMER NAME EDITING ---
    function editName(id) {

        const nomEl = document.getElementById(`nom-${id}`);

            else if (e.key === 'Escape') { e.preventDefault(); cancelNameEdit(id); }
        };
        input.addEventListener('keydown', handler);
    }

    function confirmNameEdit(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());
        if (!obj) return;
        const input = document.getElementById(`edit-nom-${id}`);
        if (!input) return;
        const nouveau = input.value.trim();
        obj.nom = nouveau;

    function cancelNameEdit(id) {
        restoreName(id);
    }

    function restoreName(id) {
        const obj = timersList.find(d => d.id.toString() === id.toString());

    function save() {

        }

    function handleDragStart(e) {
        this.classList.add('dragging');
        dragSrcEl = this;
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnter(e) {
        // (nothing: we handle everything in dragover to have the cursor position)
    }

    function handleDragLeave(e) {
        // (nothing: we hide the indicator only on dragend or drop)
    }

    function handleDragOver(e) {
        if (e.preventDefault) e.preventDefault();
        if (this === dragSrcEl) return false;
        const rect = this.getBoundingClientRect();
        // Layout detection: if the direct neighbor is to the right (same row), we're in multi-column mode
        // → use X to decide insertion side. Otherwise (single-column), use Y.
        const list = document.getElementById('durationsList');
        const cards = Array.from(list.querySelectorAll('.duration-card'));
        const idx = cards.indexOf(this);
        const voisinDroite = cards[idx + 1];
        const voisinGauche = cards[idx - 1];
        const memeRangee = (
            (voisinDroite && Math.abs(voisinDroite.getBoundingClientRect().top - rect.top) < 10) ||
            (voisinGauche && Math.abs(voisinGauche.getBoundingClientRect().top - rect.top) < 10)
        );
        const insererAvant = memeRangee
            ? (e.clientX < rect.left + rect.width / 2)
            : (e.clientY < rect.top + rect.height / 2);
        positionDropIndicator(this, insererAvant, memeRangee);
        return false;
    }

    function positionDropIndicator(targetCard, insererAvant, vertical) {
        const indicator = document.getElementById('dropIndicator');
        if (!indicator) return;
        const list = document.getElementById('durationsList');
        const cards = Array.from(list.querySelectorAll('.duration-card'));
        const idx = cards.indexOf(targetCard);
        // Find the neighbor card on the insertion side (may be null at the edges)
        const voisin = insererAvant ? cards[idx - 1] : cards[idx + 1];
        const targetRect = targetCard.getBoundingClientRect();
        const voisinRect = voisin ? voisin.getBoundingClientRect() : null;

        if (vertical) {
            // Barre verticale dans le gap horizontal entre deux cartes voisines
            // If no neighbor (edge), place right next to the target card
            let centerX;
            if (voisinRect) {
                if (insererAvant) centerX = (voisinRect.right + targetRect.left) / 2;
                else centerX = (targetRect.right + voisinRect.left) / 2;
            } else {
                centerX = insererAvant ? targetRect.left - 8 : targetRect.right + 8;
            }
            indicator.style.left = (centerX - 3 + window.scrollX) + 'px';
            indicator.style.top = (targetRect.top + window.scrollY) + 'px';
            indicator.style.width = '6px';
            indicator.style.height = targetRect.height + 'px';
        } else {
            // Horizontal bar in the vertical gap between two cards (single-column or different rows)
            let centerY;
            if (voisinRect) {
                if (insererAvant) centerY = (voisinRect.bottom + targetRect.top) / 2;
                else centerY = (targetRect.bottom + voisinRect.top) / 2;
            } else {
                centerY = insererAvant ? targetRect.top - 8 : targetRect.bottom + 8;
            }
            indicator.style.left = (targetRect.left + window.scrollX) + 'px';
            indicator.style.top = (centerY - 3 + window.scrollY) + 'px';
            indicator.style.width = targetRect.width + 'px';
            indicator.style.height = '6px';
        }
        indicator.classList.add('visible');
        indicator.dataset.targetId = targetCard.id;
        indicator.dataset.before = insererAvant ? '1' : '0';
    }

    function hideDropIndicator() {
        const indicator = document.getElementById('dropIndicator');
        if (indicator) {
            indicator.classList.remove('visible');
            delete indicator.dataset.targetId;
            delete indicator.dataset.before;
        }
    }

    function handleDrop(e) {
        if (e.stopPropagation) e.stopPropagation();
        if (e.preventDefault) e.preventDefault();
        const indicator = document.getElementById('dropIndicator');
        const targetId = indicator?.dataset.targetId;
        const before = indicator?.dataset.before === '1';
        hideDropIndicator();
        if (!dragSrcEl || !targetId) return false;
        const target = document.getElementById(targetId);
        if (!target || target === dragSrcEl) return false;
        if (before) target.before(dragSrcEl);
        else target.after(dragSrcEl);
        reindexList();
        return false;
    }

    function handleDragEnd(e) {
        hideDropIndicator();
        const cards = document.querySelectorAll('.duration-card');
        cards.forEach(card => {
            card.classList.remove('over');
            card.classList.remove('dragging');
        });
    }

    function reindexList() {
        const nouvellesCartes = document.querySelectorAll('.duration-card');
        const nouvelleListe = [];
        nouvellesCartes.forEach(carte => {
            const id = carte.id.replace('card-', '');
            const timerObj = timersList.find(d => d.id.toString() === id.toString());
            if (timerObj) nouvelleListe.push(timerObj);
        });
        timersList = nouvelleListe;
        save();
    }

    function attachDragEvents(el) {
        el.addEventListener('dragstart', handleDragStart, false);
        el.addEventListener('dragenter', handleDragEnter, false);
        el.addEventListener('dragover', handleDragOver, false);
        el.addEventListener('dragleave', handleDragLeave, false);
        el.addEventListener('drop', handleDrop, false);
        el.addEventListener('dragend', handleDragEnd, false);
        // Touch support (iOS/Android): HTML5 drag events don't work on Safari iOS,
        // so we simulate via touchstart/move/end with a long-press to activate.
        el.addEventListener('touchstart', handleTouchStart, { passive: true });
    }

    // --- DRAG TACTILE (iPad/Android) ---
    let touchDragState = null;

    function handleTouchStart(e) {
        // Ignore if already dragging, or if touching a button/input/link inside the card
        // (we don't want to start a drag when the user taps START, +30s, the pencil, etc.)
        const target = e.target;
        if (target.closest('button, input, select, textarea, a, .btn-edit-start, .duration-edit-form, .name-edit-form, .end-time-display.start-edit-form')) return;
        if (touchDragState) return;
        const card = e.currentTarget;
        const touch = e.touches[0];
        touchDragState = {
            card,
            startX: touch.clientX,
            startY: touch.clientY,
            longPressTimer: null,
            active: false,
            cancelled: false
        };
        // Start a 400ms long-press; if the user moves before that, it's a scroll so we cancel.
        touchDragState.longPressTimer = setTimeout(() => activateTouchDrag(), 400);
        document.addEventListener('touchmove', handleTouchMove, { passive: false });
        document.addEventListener('touchend', handleTouchEnd, { passive: true });
        document.addEventListener('touchcancel', handleTouchEnd, { passive: true });
    }

    function activateTouchDrag() {
        if (!touchDragState || touchDragState.cancelled) return;
        touchDragState.active = true;
        const card = touchDragState.card;
        card.classList.add('dragging');
        dragSrcEl = card;
        // Light vibration to indicate the drag is armed (if supported)
        if (navigator.vibrate) navigator.vibrate(30);
    }

    function handleTouchMove(e) {
        if (!touchDragState) return;
        const touch = e.touches[0];
        const dx = touch.clientX - touchDragState.startX;
        const dy = touch.clientY - touchDragState.startY;

        if (!touchDragState.active) {
            // Not yet in drag mode: if the user moves significantly, it's a scroll.
            // Cancel the long-press to let the natural scroll happen.
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                clearTimeout(touchDragState.longPressTimer);
                touchDragState.cancelled = true;
            }
            return;
        }
        // Active drag mode: prevent page scroll while moving
        e.preventDefault();
        // Find the card under the finger
        const targetCard = findCardUnder(touch.clientX, touch.clientY);
        if (!targetCard || targetCard === touchDragState.card) {
            hideDropIndicator();
            return;
        }
        // Reuses the same logic as handleDragOver to position the indicator
        const rect = targetCard.getBoundingClientRect();
        const list = document.getElementById('durationsList');
        const cards = Array.from(list.querySelectorAll('.duration-card'));
        const idx = cards.indexOf(targetCard);
        const voisinDroite = cards[idx + 1];
        const voisinGauche = cards[idx - 1];
        const memeRangee = (
            (voisinDroite && Math.abs(voisinDroite.getBoundingClientRect().top - rect.top) < 10) ||
            (voisinGauche && Math.abs(voisinGauche.getBoundingClientRect().top - rect.top) < 10)
        );
        const insererAvant = memeRangee
            ? (touch.clientX < rect.left + rect.width / 2)
            : (touch.clientY < rect.top + rect.height / 2);
        positionDropIndicator(targetCard, insererAvant, memeRangee);
    }

    function handleTouchEnd(e) {
        if (!touchDragState) return;
        clearTimeout(touchDragState.longPressTimer);
        document.removeEventListener('touchmove', handleTouchMove);
        document.removeEventListener('touchend', handleTouchEnd);
        document.removeEventListener('touchcancel', handleTouchEnd);

        if (touchDragState.active) {
            // Perform the drop if we have a valid indicator
            const indicator = document.getElementById('dropIndicator');
            const targetId = indicator?.dataset.targetId;
            const before = indicator?.dataset.before === '1';
            const card = touchDragState.card;
            card.classList.remove('dragging');
            hideDropIndicator();
            if (targetId && dragSrcEl) {
                const target = document.getElementById(targetId);
                if (target && target !== dragSrcEl) {
                    if (before) target.before(dragSrcEl);
                    else target.after(dragSrcEl);
                    reindexList();
                }
            }
            dragSrcEl = null;
        }
        touchDragState = null;
    }

    // Helper: find the card under (clientX, clientY) coordinates, even if multiple
    // elements overlap. We look for the first .duration-card in the stack.
    function findCardUnder(x, y) {
        const els = document.elementsFromPoint(x, y);
        for (const el of els) {
            const card = el.closest('.duration-card');
            if (card) return card;
        }
        return null;
    }

    // --- MENU DROPDOWN ---
    function toggleMenu(e) {

    // Text input modal (used for Import from URL)
    function promptDialog(message, defaultValue = '', placeholder = '') {
        return new Promise((resolve) => {
            const overlay = document.getElementById('promptModal');
            const msg = document.getElementById('promptModalMessage');
            const input = document.getElementById('promptModalInput');
            const btnOk = document.getElementById('promptModalOk');
            const btnCancel = document.getElementById('promptModalCancel');
            const t = i18n[currentLang];
            msg.textContent = message;
            btnOk.textContent = t.save || 'OK';
            btnCancel.textContent = t.cancel || 'Annuler';
            input.value = defaultValue;
            input.placeholder = placeholder || '';
            overlay.classList.add('visible');
            setTimeout(() => { input.focus(); input.select(); }, 0);

            const cleanup = (result) => {
                overlay.classList.remove('visible');
                btnOk.removeEventListener('click', onOk);
                btnCancel.removeEventListener('click', onCancel);
                document.removeEventListener('keydown', onKey);
                overlay.removeEventListener('click', onOverlayClick);
                resolve(result);
            };
            const onOk = () => cleanup(input.value.trim());
            const onCancel = () => cleanup(null);
            const onKey = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); cleanup(input.value.trim()); }
                else if (e.key === 'Escape') { e.preventDefault(); cleanup(null); }
            };
            const onOverlayClick = (e) => {
                if (e.target === overlay) cleanup(null);
            };
            btnOk.addEventListener('click', onOk);
            btnCancel.addEventListener('click', onCancel);
            document.addEventListener('keydown', onKey);
            overlay.addEventListener('click', onOverlayClick);
        });
    }

    // Applies an already-parsed import object (used by file and URL).
    // Returns true if the import was applied and the page will reload.
    async function applyImport(parsed) {
        if (!parsed || typeof parsed !== 'object' || !parsed.data || typeof parsed.data !== 'object') {
            throw new Error('Structure invalide');
        }
        const knownKeys = ['timers_v17_data', 'timers_richtext', 'timers_markdown', 'timers_current_tab'];
        const hasAnyKey = knownKeys.some(k => k in parsed.data);
        if (!hasAnyKey) throw new Error('Aucune donnée reconnue');
        const ok = await confirmDialog(i18n[currentLang].confirmImport);
        if (!ok) return false;
        knownKeys.forEach(k => {
            const v = parsed.data[k];
            if (v === null || v === undefined) {
                localStorage.removeItem(k);
            } else if (typeof v === 'string') {
                localStorage.setItem(k, v);
            }
        });
        location.reload();
        return true;
    }

    async function handleFileImport(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        await importJsonFile(file);
    }

    // Common function to import a JSON file (used by <input type="file">
    // and by file drag&drop from the desktop).
    async function importJsonFile(file) {
        try {
            const text = await file.text();
            const parsed = JSON.parse(text);
            await applyImport(parsed);
        } catch (e) {
            console.error('Import error:', e);
            await confirmDialog(i18n[currentLang].importError, { alertMode: true });
        }
    }

    // Installs global listeners to allow drag&drop of a JSON file
    // from the desktop directly onto the window.
    function installGlobalFileDrop() {
        const overlay = document.getElementById('fileDropOverlay');
        if (!overlay) return;
        // dragenter/dragleave counter: these events fire on each traversal
        // of a child element, so we count to know when we really leave.
        let dragCounter = 0;

        // Detection: dragging a file (not an internal timer card drag)?
        const hasFiles = (e) => {
            if (!e.dataTransfer) return false;
            const types = e.dataTransfer.types;
            // types can be a DOMStringList or an array depending on the browser
            if (!types) return false;
            for (let i = 0; i < types.length; i++) {
                if (types[i] === 'Files') return true;
            }
            return false;
        };

        document.addEventListener('dragenter', (e) => {
            if (!hasFiles(e)) return;
            dragCounter++;
            overlay.classList.add('visible');
        });
        document.addEventListener('dragover', (e) => {
            if (!hasFiles(e)) return;
            // preventDefault is required to allow the drop
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        });
        document.addEventListener('dragleave', (e) => {
            if (!hasFiles(e)) return;
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                overlay.classList.remove('visible');
            }
        });
        document.addEventListener('drop', async (e) => {
            if (!hasFiles(e)) return;
            e.preventDefault();
            dragCounter = 0;
            overlay.classList.remove('visible');
            const files = e.dataTransfer.files;
            if (!files || files.length === 0) return;
            const file = files[0];
            // Filter on extension/type to reject obviously incorrect files
            const isJson = /\.json$/i.test(file.name) || file.type === 'application/json';
            if (!isJson) {
                await confirmDialog(i18n[currentLang].importError, { alertMode: true });
                return;
            }
            await importJsonFile(file);
        });
    }

    // --- URL SHARING (config encoded as URL-safe base64) ---
    function encodeBase64UrlSafe(str) {
        const bytes = new TextEncoder().encode(str);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function decodeBase64UrlSafe(b64) {
        let s = b64.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder().decode(bytes);
    }

    function buildExportConfig() {
        return {
            version: 1,
            exportedAt: new Date().toISOString(),
            data: {
                timers_v17_data: localStorage.getItem('timers_v17_data'),
                timers_richtext: localStorage.getItem('timers_richtext'),

            }
        };

    async function shareLink() {
        closeMenu();
        const t = i18n[currentLang];
        const config = buildExportConfig();
        const json = JSON.stringify(config);
        const encoded = encodeBase64UrlSafe(json);
        const base = location.origin + location.pathname;
        const lien = `${base}?config=${encoded}`;
        let copied = false;
        try {
            await navigator.clipboard.writeText(lien);
            copied = true;
        } catch (e) {
            try {
                const ta = document.createElement('textarea');
                ta.value = lien;
                ta.style.position = 'fixed'; ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                copied = document.execCommand('copy');
                document.body.removeChild(ta);
            } catch (e2) {
                console.error('Copy failed:', e2);
            }
        }
        if (copied) {
            await confirmDialog(t.linkCopied, { alertMode: true });
        } else {
            console.log('Lien partageable :', lien);
            await confirmDialog(t.linkTooLong, { alertMode: true });
        }
    }

    // Detect import on load via URL params (?config=... or ?configUrl=...)
    async function detectImportFromUrl() {
        const params = new URLSearchParams(location.search);
        const configParam = params.get('config');
        const configUrlParam = params.get('configUrl');
        if (!configParam && !configUrlParam) return;
        const t = i18n[currentLang];
        try {
            let parsed;
            if (configParam) {
                const json = decodeBase64UrlSafe(configParam);
                parsed = JSON.parse(json);
            } else {
                const response = await fetch(configUrlParam);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                parsed = JSON.parse(await response.text());
            }
            if (!parsed?.data || typeof parsed.data !== 'object') throw new Error('Structure invalide');
            const knownKeys = ['timers_v17_data', 'timers_richtext', 'timers_markdown', 'timers_current_tab'];
            const hasAnyKey = knownKeys.some(k => k in parsed.data);
            if (!hasAnyKey) throw new Error('Aucune donnée reconnue');

            const ok = await confirmDialog(t.confirmSharedImport);
            // Nettoyer l'URL dans tous les cas pour ne pas redemander au prochain rechargement
            history.replaceState(null, '', location.pathname);
            if (!ok) return;
            knownKeys.forEach(k => {
                const v = parsed.data[k];
                if (v === null || v === undefined) localStorage.removeItem(k);
                else if (typeof v === 'string') localStorage.setItem(k, v);
            });
            location.reload();
        } catch (e) {
            console.error('Shared link import error:', e);
            history.replaceState(null, '', location.pathname);
            const isFetchError = e instanceof TypeError || (e.message && e.message.startsWith('HTTP'));
            const msg = isFetchError ? t.urlFetchError : t.importError;
            await confirmDialog(msg, { alertMode: true });
        }
    }

    window.onload = () => {
        const savedData = localStorage.getItem('timers_v17_data');
        
        if (savedData) {
            const data = JSON.parse(savedData);
            
            // 1. Restore settings
            currentLang = data.lang || 'fr';
            globalSoundEnabled = data.globalSound !== undefined ? data.globalSound : true;
            darkMode = data.darkMode !== undefined ? data.darkMode : false;
            hideSeconds = data.hideSeconds !== undefined ? data.hideSeconds : false;
            secondsThreshold = data.secondsThreshold !== undefined ? data.secondsThreshold : 180;
            autoResetDelay = data.autoResetDelay !== undefined ? data.autoResetDelay : 60;
            extraDelay = data.extraDelay !== undefined ? data.extraDelay : 30;
            timersZoom = data.timersZoom !== undefined ? data.timersZoom : 1.0;
            clockScale = data.clockScale !== undefined ? data.clockScale : 1.0;
            showGlobalControls = data.showGlobalControls !== undefined ? data.showGlobalControls : true;
            clockMode = data.clockMode || 'digital';
            // Migration : si l'ancienne forme (Set d'IDs) existe, on prend "true" si non vide
            if (data.showStartTime !== undefined) {
                showStartTime = data.showStartTime;
            } else if (Array.isArray(data.showStartTimeIds) && data.showStartTimeIds.length > 0) {
                showStartTime = true;
            } else {
                showStartTime = false;
            }
            richtextZoom = data.richtextZoom !== undefined ? data.richtextZoom : 1.0;
            
            // 2. Vider la liste actuelle avant de recharger
            timersList = [];
            document.getElementById('durationsList').innerHTML = "";

            // 3. Recharger les timers
            if (data.timers && data.timers.length > 0) {
                data.timers.forEach(d => {
                    timersList.push(d);
                    createCardHTML(d);
                    
                    if (d.start) {
                        const ecoule = Date.now() - d.start;
                        const total = (d.totalSecs + d.extraSecs) * 1000;
                        
                        if (ecoule < total) {
                            updateActiveUI(d.id);
                            updateEndTime(d.id);
                            startTick(d.id);
                        } else {
                            d.start = null; 
                            d.extraSecs = 0;
                            d.muted = false;
                        }
                    }
                });
            }
            
            // 4. Apply language, sound, theme and seconds threshold
            changeLanguage(currentLang);
            updateGlobalSoundUI();
            const threshInput = document.getElementById('thresholdInput');
            if (threshInput) threshInput.value = Math.round(secondsThreshold / 60);
            const autoResetInput = document.getElementById('autoResetInput');
            if (autoResetInput) autoResetInput.value = autoResetDelay;
            const extraInput = document.getElementById('extraDelayInput');
            if (extraInput) extraInput.value = extraDelay;
            const clockSelect = document.getElementById('clockModeSelect');
            if (clockSelect) clockSelect.value = clockMode;
            applyTheme();
        }
        // Init UI fields that must always reflect values (default or restored)
        const globalCtrlsCheckbox = document.getElementById('globalCtrlsCheckbox');
        if (globalCtrlsCheckbox) globalCtrlsCheckbox.checked = showGlobalControls;
        
        // 5. Restaurer l'onglet actif
        const savedTab = localStorage.getItem('timers_current_tab');
        if (savedTab) {
            currentTab = savedTab;
            switchTab(savedTab);
        }
        
        // 6. Initialize floating buttons according to the active tab
        const btnAdd = document.getElementById('btnAddFloating');
        if (btnAdd) btnAdd.classList.toggle('hidden', currentTab !== 'timers');
        applyGlobalControlsVisibility();
        // Boutons zoom visibles sur les deux onglets
        syncZoomButtons();
        // Apply the restored zoom
        applyTimersZoom();

        // 7. Initialize the richtext editor (toolbar + content)
        attachRichtextToolbar();
        loadRichtext();

        // 8. Attacher le gestionnaire d'import de fichier
        const importInput = document.getElementById('importFileInput');
        if (importInput) importInput.addEventListener('change', handleFileImport);

        // 8b. Drag-and-drop a JSON file from the desktop (onto the window)
        installGlobalFileDrop();

        // 9. Detect any import via URL parameter (?config=... or ?configUrl=...)
        // (last so that language and UI are already initialized before confirmation)
        detectImportFromUrl();

        // 10. Initialize the clock if enabled
        applyClock();
    };

</script>
</body>
</html>
