    function openHelp() {
        const overlay = document.getElementById('helpOverlay');
        const content = document.getElementById('helpContent');
        content.innerHTML = helpManual[currentLang] || helpManual.fr;
        content.scrollTop = 0;
        overlay.classList.add('visible');
        // Close on Escape
        const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); closeHelp(); } };
        document.addEventListener('keydown', onKey);
        overlay._onKey = onKey;
        // Close on backdrop click
        const onClick = (e) => { if (e.target === overlay) closeHelp(); };
        overlay.addEventListener('click', onClick);
        overlay._onClick = onClick;
    }

    function closeHelp() {
        const overlay = document.getElementById('helpOverlay');
        overlay.classList.remove('visible');
        if (overlay._onKey) { document.removeEventListener('keydown', overlay._onKey); overlay._onKey = null; }
        if (overlay._onClick) { overlay.removeEventListener('click', overlay._onClick); overlay._onClick = null; }
    }

    // --- MENU DROPDOWN ---
    function toggleMenu(e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById('dropdownMenu');
        if (!menu) return;
        if (menu.classList.contains('visible')) {
            closeMenu();
        } else {
            openMenu();
        }
    }
    function openMenu() {
        const menu = document.getElementById('dropdownMenu');
        const backdrop = document.getElementById('menuBackdrop');
        if (menu) menu.classList.add('visible');
        if (backdrop) backdrop.classList.add('visible');
        // Close on Escape
        const onKey = (ev) => { if (ev.key === 'Escape') { ev.preventDefault(); closeMenu(); } };
        document.addEventListener('keydown', onKey);
        menu._onKey = onKey;
    }
    function closeMenu() {
        const menu = document.getElementById('dropdownMenu');
        const backdrop = document.getElementById('menuBackdrop');
        if (menu) {
            menu.classList.remove('visible');
            if (menu._onKey) { document.removeEventListener('keydown', menu._onKey); menu._onKey = null; }
        }
        if (backdrop) backdrop.classList.remove('visible');
    }

    // --- EXPORT / IMPORT ---
    function exportConfig() {
        closeMenu();
        const data = {
            version: 1,
            exportedAt: new Date().toISOString(),
            data: {
                timers_v17_data: localStorage.getItem('timers_v17_data'),
                timers_richtext: localStorage.getItem('timers_richtext'),
                timers_markdown: localStorage.getItem('timers_markdown'), // legacy, for older users not yet migrated
                timers_current_tab: localStorage.getItem('timers_current_tab')
            }
        };
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        // Format YYYY-MM-DD_HH-MM-SS based on local time (avoiding ':' which is invalid
        // in filenames on Windows and iOS).
        const now = new Date();
        const pad = (n) => n.toString().padStart(2, '0');
        const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
        a.href = url;
        a.download = `timers-config-${stamp}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function importConfig() {
        closeMenu();
        const input = document.getElementById('importFileInput');
        if (!input) return;
        // Reset value to allow re-importing the same file twice in a row
        input.value = '';
        input.click();
    }

    // Text input modal (used for Import from URL)
    function promptDialog(message, defaultValue = '', placeholder = '') {
        return new Promise((resolve) => {
            const overlay = document.getElementById('promptModal');
            const msg = document.getElementById('promptModalMessage');
            const input = document.getElementById('promptModalInput');
            const btnOk = document.getElementById('promptModalOk');
            const btnCancel = document.getElementById('promptModalCancel');
            const t = i18n[currentLang];
            msg.textContent = message;
            btnOk.textContent = t.save || 'OK';
            btnCancel.textContent = t.cancel || 'Annuler';
            input.value = defaultValue;
            input.placeholder = placeholder || '';
            overlay.classList.add('visible');
            setTimeout(() => { input.focus(); input.select(); }, 0);

            const cleanup = (result) => {
                overlay.classList.remove('visible');
                btnOk.removeEventListener('click', onOk);
                btnCancel.removeEventListener('click', onCancel);
                document.removeEventListener('keydown', onKey);
                overlay.removeEventListener('click', onOverlayClick);
                resolve(result);
            };
            const onOk = () => cleanup(input.value.trim());
            const onCancel = () => cleanup(null);
            const onKey = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); cleanup(input.value.trim()); }
                else if (e.key === 'Escape') { e.preventDefault(); cleanup(null); }
            };
            const onOverlayClick = (e) => {
                if (e.target === overlay) cleanup(null);
            };
            btnOk.addEventListener('click', onOk);
            btnCancel.addEventListener('click', onCancel);
            document.addEventListener('keydown', onKey);
            overlay.addEventListener('click', onOverlayClick);
        });
    }

    // Applies an already-parsed import object (used by file and URL).
    // Returns true if the import was applied and the page will reload.
    // List of localStorage keys covered by import/export — keep in sync with applyImport.
    const IMPORT_KEYS = ['timers_v17_data', 'timers_richtext', 'timers_markdown', 'timers_current_tab'];
    // Stores the most recently imported configuration. The user can re-apply it at any time
    // via the "Revert to last imported configuration" menu entry — useful when the imported
    // config is a "lesson reference" the user wants to come back to after live edits.
    const LAST_IMPORT_KEY = 'timers_last_import';

    // Save an imported config (the parsed `data` object containing IMPORT_KEYS values)
    // into a backup blob, so the user can revert to it later via the menu.
    function saveLastImport(parsedData) {
        const snapshot = {};
        IMPORT_KEYS.forEach(k => {
            // Only save keys that were part of the import (others may have been left
            // unchanged in localStorage, which is the correct behavior for both import
            // and revert).
            if (k in parsedData) snapshot[k] = parsedData[k];
        });
        localStorage.setItem(LAST_IMPORT_KEY, JSON.stringify(snapshot));
    }

    // Re-apply the most recently imported configuration. The backup is NOT cleared after
    // use — the user can revert multiple times to the same reference state.
    async function revertToLastImport() {
        const raw = localStorage.getItem(LAST_IMPORT_KEY);
        if (!raw) return;
        const t = i18n[currentLang];
        const ok = await confirmDialog(t.confirmRevertImport);
        if (!ok) return;
        try {
            const snapshot = JSON.parse(raw);
            IMPORT_KEYS.forEach(k => {
                const v = snapshot[k];
                if (v === null || v === undefined) localStorage.removeItem(k);
                else if (typeof v === 'string') localStorage.setItem(k, v);
            });
        } catch (e) {
            console.error('Last-import restore failed:', e);
            return;
        }
        location.reload();
    }

    async function applyImport(parsed, options = {}) {
        if (!parsed || typeof parsed !== 'object' || !parsed.data || typeof parsed.data !== 'object') {
            throw new Error('Structure invalide');
        }
        const hasAnyKey = IMPORT_KEYS.some(k => k in parsed.data);
        if (!hasAnyKey) throw new Error('Aucune donnée reconnue');
        // skipConfirm: bypass the confirmation dialog (used for ?force=1 in shared URLs).
        if (!options.skipConfirm) {
            const ok = await confirmDialog(i18n[currentLang].confirmImport);
            if (!ok) return false;
        }
        // Save the imported config so the user can later revert to it via the menu.
        saveLastImport(parsed.data);
        IMPORT_KEYS.forEach(k => {
            const v = parsed.data[k];
            if (v === null || v === undefined) {
                localStorage.removeItem(k);
            } else if (typeof v === 'string') {
                localStorage.setItem(k, v);
            }
        });
        location.reload();
        return true;
    }

    async function handleFileImport(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        await importJsonFile(file);
    }

    // Common function to import a JSON file (used by <input type="file">
    // and by file drag&drop from the desktop).
    async function importJsonFile(file) {
        try {
            const text = await file.text();
            const parsed = JSON.parse(text);
            await applyImport(parsed);
        } catch (e) {
            console.error('Import error:', e);
            await confirmDialog(i18n[currentLang].importError, { alertMode: true });
        }
    }

    // Installs global listeners to allow drag&drop of a JSON file
    // from the desktop directly onto the window.
    function installGlobalFileDrop() {
        const overlay = document.getElementById('fileDropOverlay');
        if (!overlay) return;
        // dragenter/dragleave counter: these events fire on each traversal
        // of a child element, so we count to know when we really leave.
        let dragCounter = 0;

        // Detection: dragging a file (not an internal timer card drag)?
        const hasFiles = (e) => {
            if (!e.dataTransfer) return false;
            const types = e.dataTransfer.types;
            // types can be a DOMStringList or an array depending on the browser
            if (!types) return false;
            for (let i = 0; i < types.length; i++) {
                if (types[i] === 'Files') return true;
            }
            return false;
        };

        document.addEventListener('dragenter', (e) => {
            if (!hasFiles(e)) return;
            dragCounter++;
            overlay.classList.add('visible');
        });
        document.addEventListener('dragover', (e) => {
            if (!hasFiles(e)) return;
            // preventDefault is required to allow the drop
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        });
        document.addEventListener('dragleave', (e) => {
            if (!hasFiles(e)) return;
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                overlay.classList.remove('visible');
            }
        });
        document.addEventListener('drop', async (e) => {
            if (!hasFiles(e)) return;
            e.preventDefault();
            dragCounter = 0;
            overlay.classList.remove('visible');
            const files = e.dataTransfer.files;
            if (!files || files.length === 0) return;
            const file = files[0];
            // Filter on extension/type to reject obviously incorrect files
            const isJson = /\.json$/i.test(file.name) || file.type === 'application/json';
            if (!isJson) {
                await confirmDialog(i18n[currentLang].importError, { alertMode: true });
                return;
            }
            await importJsonFile(file);
        });
    }

    // --- URL SHARING (config encoded as URL-safe base64) ---
    // Lightweight checksum (FNV-1a, 32-bit, hex) used to detect a truncated/corrupted
    // shared link. It is NOT cryptographic — just a fast integrity check so that a link cut
    // off in transit (by a messaging app, proxy, etc.) is rejected instead of importing a
    // partial config. Synchronous and dependency-free.
    function configChecksum(str) {
        let h = 0x811c9dc5;
        for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            // 32-bit FNV prime multiply, kept in 32-bit range via Math.imul
            h = Math.imul(h, 0x01000193);
        }
        // Unsigned 32-bit, hex
        return (h >>> 0).toString(16);
    }

    function encodeBase64UrlSafe(str) {
        const bytes = new TextEncoder().encode(str);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function decodeBase64UrlSafe(b64) {
        let s = b64.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder().decode(bytes);
    }

    function buildExportConfig() {
        return {
            version: 1,
            exportedAt: new Date().toISOString(),
            data: {
                timers_v17_data: localStorage.getItem('timers_v17_data'),
                timers_richtext: localStorage.getItem('timers_richtext'),
                timers_markdown: localStorage.getItem('timers_markdown'),
                timers_current_tab: localStorage.getItem('timers_current_tab')
            }
        };
    }

    async function shareLink() {
        closeMenu();
        const t = i18n[currentLang];
        const config = buildExportConfig();
        const json = JSON.stringify(config);
        const encoded = encodeBase64UrlSafe(json);
        const base = location.origin + location.pathname;
        // Append a checksum of the encoded payload so a truncated link can be detected.
        const ck = configChecksum(encoded);
        const lien = `${base}?config=${encoded}&ck=${ck}`;
        let copied = false;
        try {
            await navigator.clipboard.writeText(lien);
            copied = true;
        } catch (e) {
            try {
                const ta = document.createElement('textarea');
                ta.value = lien;
                ta.style.position = 'fixed'; ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                copied = document.execCommand('copy');
                document.body.removeChild(ta);
            } catch (e2) {
                console.error('Copy failed:', e2);
            }
        }
        if (copied) {
            await confirmDialog(t.linkCopied, { alertMode: true });
        } else {
            console.log('Lien partageable :', lien);
            await confirmDialog(t.linkTooLong, { alertMode: true });
        }
    }

    // Detect import on load via URL params (?config=... or ?configUrl=...)
    // Optional &force=1 bypasses the confirmation dialog (manual addition by the user).
    async function detectImportFromUrl() {
        const params = new URLSearchParams(location.search);
        const configParam = params.get('config');
        const configUrlParam = params.get('configUrl');
        const forceParam = params.get('force') === '1';
        const ckParam = params.get('ck');
        if (!configParam && !configUrlParam) return;
        const t = i18n[currentLang];
        try {
            let parsed;
            if (configParam) {
                // If a checksum is present (newer links), verify the payload wasn't
                // truncated/corrupted in transit. Older links without 'ck' are still
                // accepted as-is (no checksum to compare).
                if (ckParam && configChecksum(configParam) !== ckParam) {
                    throw new Error('Checksum mismatch (lien tronqué ou corrompu)');
                }
                const json = decodeBase64UrlSafe(configParam);
                parsed = JSON.parse(json);
            } else {
                const response = await fetch(configUrlParam);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                parsed = JSON.parse(await response.text());
            }
            if (!parsed?.data || typeof parsed.data !== 'object') throw new Error('Structure invalide');
            const hasAnyKey = IMPORT_KEYS.some(k => k in parsed.data);
            if (!hasAnyKey) throw new Error('Aucune donnée reconnue');

            // Clean the URL whether or not the user accepts (so we don't re-ask on next reload).
            // With force=1, skip the confirmation entirely.
            let ok = true;
            if (!forceParam) {
                ok = await confirmDialog(t.confirmSharedImport);
            }
            history.replaceState(null, '', location.pathname);
            if (!ok) return;
            // Save the imported config so the user can later revert to it via the menu.
            saveLastImport(parsed.data);
            IMPORT_KEYS.forEach(k => {
                const v = parsed.data[k];
                if (v === null || v === undefined) localStorage.removeItem(k);
                else if (typeof v === 'string') localStorage.setItem(k, v);
            });
            location.reload();
        } catch (e) {
            console.error('Shared link import error:', e);
            history.replaceState(null, '', location.pathname);
            const isFetchError = e instanceof TypeError || (e.message && e.message.startsWith('HTTP'));
            const msg = isFetchError ? t.urlFetchError : t.importError;
            await confirmDialog(msg, { alertMode: true });
        }
    }

    document.addEventListener('dragend', (e) => {
        if (e.target.classList.contains('duration-card')) {
            e.target.classList.remove('dragging');
            reindexList();
        }
    });

    // Container-level drag handlers make dropping forgiving (works in the gaps between
    // cards, not only directly on a card). Attached once to #durationsList.
    (function attachContainerDragHandlers() {
        const list = document.getElementById('durationsList');
        if (!list) return;
        list.addEventListener('dragover', containerDragOver, false);
        list.addEventListener('drop', handleDrop, false);
    })();

    window.onload = () => {
        const savedData = localStorage.getItem('timers_v17_data');
        
        if (savedData) {
            const data = JSON.parse(savedData);
            
            // 1. Restore settings
            currentLang = data.lang || 'fr';
            globalSoundEnabled = data.globalSound !== undefined ? data.globalSound : true;
            darkMode = data.darkMode !== undefined ? data.darkMode : false;
            hideSeconds = data.hideSeconds !== undefined ? data.hideSeconds : false;
            secondsThreshold = data.secondsThreshold !== undefined ? data.secondsThreshold : 120;
            autoResetDelay = data.autoResetDelay !== undefined ? data.autoResetDelay : 60;
            extraDelay = data.extraDelay !== undefined ? data.extraDelay : 30;
            timersZoom = data.timersZoom !== undefined ? data.timersZoom : 1.0;
            clockScale = data.clockScale !== undefined ? data.clockScale : 0.85;
            buttonsHoverOnly = data.buttonsHoverOnly !== undefined ? data.buttonsHoverOnly : false;
            hideTimerButtons = data.hideTimerButtons !== undefined ? data.hideTimerButtons : false;
            chainTimers = data.chainTimers !== undefined ? data.chainTimers : false;
            autoStartTimers = data.autoStartTimers !== undefined ? data.autoStartTimers : false;
            hideFinished = data.hideFinished !== undefined ? data.hideFinished : false;
            showVisualTimer = data.showVisualTimer !== undefined ? data.showVisualTimer : (data.showTimeTimer !== undefined ? data.showTimeTimer : false);
            hideTimeWithVisualTimer = data.hideTimeWithVisualTimer !== undefined ? data.hideTimeWithVisualTimer : false;
            visualTimerScale = data.visualTimerScale !== undefined ? data.visualTimerScale : (data.timeTimerScale !== undefined ? data.timeTimerScale : 1.35);
            clockMode = data.clockMode || 'digital';
            notesClockVisible = data.notesClockVisible !== undefined ? data.notesClockVisible : true;
            notesClockMode = data.notesClockMode || 'both';
            notesClockScale = data.notesClockScale !== undefined ? data.notesClockScale : 1.4;
            // Migration : si l'ancienne forme (Set d'IDs) existe, on prend "true" si non vide
            if (data.showStartTime !== undefined) {
                showStartTime = data.showStartTime;
            } else if (Array.isArray(data.showStartTimeIds) && data.showStartTimeIds.length > 0) {
                showStartTime = true;
            } else {
                showStartTime = false;
            }
            richtextZoom = data.richtextZoom !== undefined ? data.richtextZoom : 1.0;
            
            // 2. Vider la liste actuelle avant de recharger
            timersList = [];
            document.getElementById('durationsList').innerHTML = "";

            // 3. Recharger les timers
            if (data.timers && data.timers.length > 0) {
                data.timers.forEach(d => {
                    // Migration: ensure pausedAt exists (defaults to null) on timers saved
                    // before the pause feature was added.
                    if (d.pausedAt === undefined) d.pausedAt = null;
                    if (d.hidden === undefined) d.hidden = false;
                    if (d.scheduledTimeOfDay === undefined) d.scheduledTimeOfDay = null;
                    timersList.push(d);
                    createCardHTML(d);
                    
                    if (d.start) {
                        // Use effectiveNow: a paused timer is frozen at d.pausedAt, not Date.now()
                        const now = (d.pausedAt !== null) ? d.pausedAt : Date.now();
                        const ecoule = now - d.start;
                        const total = (d.totalSecs + d.extraSecs) * 1000;
                        
                        if (ecoule < total) {
                            updateActiveUI(d.id);
                            updateEndTime(d.id);
                            // Don't tick a paused timer — its display stays frozen at pausedAt.
                            if (d.pausedAt === null) startTick(d.id);
                        } else {
                            d.start = null; 
                            d.extraSecs = 0;
                            d.muted = false;
                            d.pausedAt = null;
                        }
                    }
                });
            }
            
            // 4. Apply language, sound, theme and seconds threshold
            changeLanguage(currentLang);
            updateGlobalSoundUI();
            const threshInput = document.getElementById('thresholdInput');
            if (threshInput) threshInput.value = Math.round(secondsThreshold / 60);
            const autoResetInput = document.getElementById('autoResetInput');
            if (autoResetInput) autoResetInput.value = autoResetDelay;
            const extraInput = document.getElementById('extraDelayInput');
            if (extraInput) extraInput.value = extraDelay;
            const clockSelect = document.getElementById('clockModeSelect');
            if (clockSelect) clockSelect.value = clockMode;
            applyTheme();
        } else {
            // First launch (no saved data): create a default timer so the app isn't empty.
            // A 3-minute "soft-boiled egg" timer. The name is taken from i18n in the current
            // language at creation time (then it's a normal editable name, not retranslated).
            const defaultTimer = {
                id: Date.now(),
                nom: i18n[currentLang].defaultTimerName || 'œuf à la coque',
                totalSecs: 180,
                start: null,
                extraSecs: 0,
                muted: false,
                pausedAt: null,
                hidden: false,
                scheduledTimeOfDay: null
            };
            timersList.push(defaultTimer);
            createCardHTML(defaultTimer);
            changeLanguage(currentLang);
            updateGlobalSoundUI();
            const threshInput = document.getElementById('thresholdInput');
            if (threshInput) threshInput.value = Math.round(secondsThreshold / 60);
            applyTheme();
            save();
        }
        // Init UI fields that must always reflect values (default or restored)
        const buttonsHoverOnlyCheckbox = document.getElementById('buttonsHoverOnlyCheckbox');
        if (buttonsHoverOnlyCheckbox) buttonsHoverOnlyCheckbox.checked = buttonsHoverOnly;
        applyButtonsVisibilityMode();
        const hideTimerButtonsCheckbox = document.getElementById('hideTimerButtonsCheckbox');
        if (hideTimerButtonsCheckbox) hideTimerButtonsCheckbox.checked = hideTimerButtons;
        applyHideTimerButtonsMode();
        const chainTimersCheckbox = document.getElementById('chainTimersCheckbox');
        if (chainTimersCheckbox) chainTimersCheckbox.checked = chainTimers;
        const autoStartTimersCheckbox = document.getElementById('autoStartTimersCheckbox');
        if (autoStartTimersCheckbox) autoStartTimersCheckbox.checked = autoStartTimers;
        // Seed the last-fired map with today's most-recent occurrences so we don't fire
        // retroactively for timers whose scheduled time already passed before the page
        // was opened. New crossings (later today or tomorrow) will fire normally.
        seedSchedulesAtLoad();
        // If there are pending schedules and the option is on, start the scheduled tick.
        refreshScheduledTick();
        refreshAudioUnlockBanner();
        const hideFinishedCheckbox = document.getElementById('hideFinishedCheckbox');
        if (hideFinishedCheckbox) hideFinishedCheckbox.checked = hideFinished;
        const visualTimerCheckbox = document.getElementById('visualTimerCheckbox');
        if (visualTimerCheckbox) visualTimerCheckbox.checked = showVisualTimer;
        // Apply the restored Visual Timer scale to the document root (all wrappers read --vt-scale)
        applyVisualTimerScale();
        // Apply Visual Timer visibility to existing cards (in case createCardHTML ran
        // before the saved state was restored — safe to call always).
        applyVisualTimerVisibility();
        applyHideTimeWithVisualTimer();
        // Show "auto start" hints on chained timers, based on the restored state.
        refreshChainLabels();
        // Reflect the current running/paused state on the global pause/resume button.
        updatePauseAllButton();
        
        // 5. Restaurer l'onglet actif
        const savedTab = localStorage.getItem('timers_current_tab');
        if (savedTab) {
            currentTab = savedTab;
            switchTab(savedTab);
        }
        
        // 6. Initialize floating buttons according to the active tab
        const btnAdd = document.getElementById('btnAddFloating');
        if (btnAdd) btnAdd.classList.toggle('hidden', currentTab !== 'timers');
        const btnStartAll = document.getElementById('btnStartAll');
        if (btnStartAll) btnStartAll.classList.toggle('hidden', currentTab !== 'timers');
        const btnPauseAll = document.getElementById('btnPauseAll');
        if (btnPauseAll) btnPauseAll.classList.toggle('hidden', currentTab !== 'timers');
        const btnStopAll = document.getElementById('btnStopAll');
        if (btnStopAll) btnStopAll.classList.toggle('hidden', currentTab !== 'timers');
        // Boutons zoom visibles sur les deux onglets
        syncZoomButtons();
        // Apply the restored zoom
        applyTimersZoom();

        // 7. Initialize the richtext editor (toolbar + content)
        attachRichtextToolbar();
        loadRichtext();
        updateNotesClockButton();

        // 8. Attacher le gestionnaire d'import de fichier
        const importInput = document.getElementById('importFileInput');
        if (importInput) importInput.addEventListener('change', handleFileImport);

        // 8b. Drag-and-drop a JSON file from the desktop (onto the window)
        installGlobalFileDrop();

        // 9. Detect any import via URL parameter (?config=... or ?configUrl=...)
        // (last so that language and UI are already initialized before confirmation)
        detectImportFromUrl();

        // 10. Initialize the clock if enabled
        applyClock();
    };

</script>
</body>
